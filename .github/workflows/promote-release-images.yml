name: Finalize release assets and images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable release to promote, for example v1.3.29'
        required: true
        type: string
      artifact_run_id:
        description: 'Optional Package run ID: upload its verified cloud assets into an existing draft instead of promoting images'
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-release-images
  cancel-in-progress: false

jobs:
  upload_assets:
    if: inputs.artifact_run_id != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
    steps:
      - name: Require verified artifacts from the draft release commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq '.draft')" == true ]]
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq '.sha')
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq '.head_sha')" == "$commit" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/release-jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs = {j['name']:j['conclusion'] for j in json.loads((Path(os.environ['RUNNER_TEMP'])/'release-jobs.json').read_text())['jobs']}
          required = ['sources','quality / quality','native_linux / package',
              'agents (ubuntu-22.04, linux-arm64)','agents (windows-latest, windows-amd64)',
              'images (all-in-one)','images (control-plane)','images (agent)','images (dst-runtime)']
          assert all(jobs.get(name)=='success' for name in required), 'Cloud package checks must pass'
          PY
      - name: Download and verify cloud packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n dst-admin-linux-amd64 -n dst-admin-agent-linux-arm64 \
            -n dst-admin-agent-windows-amd64 -D "$RUNNER_TEMP/release-assets"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'release-assets'
          checksums=list(root.rglob('*.sha256'))
          assert len(checksums)==8
          for path in checksums:
              expected,name=path.read_text().split()
              assert Path(name).name==name
              assert hashlib.sha256((path.parent/name).read_bytes()).hexdigest()==expected
          PY
      - name: Upload verified files and keep the release as a draft
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find "$RUNNER_TEMP/release-assets" -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -print0)
          [[ "${#files[@]}" == 16 ]]
          gh release upload "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          echo 'Uploaded 16 verified cloud assets. The release remains a draft for final checks.' >> "$GITHUB_STEP_SUMMARY"
  promote:
    if: inputs.artifact_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
    steps:
      - name: Require the current published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ALIYUN_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ -n "$DOCKERHUB_TOKEN" && -n "$ALIYUN_USERNAME" && -n "$ALIYUN_PASSWORD" ]]
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          [[ "$latest" == "$RELEASE_VERSION" ]]
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || 'lcy0828' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Verify every versioned image before changing aliases
        shell: bash
        run: |
          set -euo pipefail
          digest() {
            local value
            value=$(docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" {print $2; exit}')
            [[ "$value" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s' "$value"
          }
          : > "$RUNNER_TEMP/release-images.tsv"
          for kind in all-in-one control-plane agent dst-runtime; do
            case "$kind" in
              all-in-one) prefix='' ;;
              control-plane) prefix='controller-' ;;
              agent) prefix='agent-' ;;
              dst-runtime) prefix='runtime-' ;;
            esac
            source="ghcr.io/${GITHUB_REPOSITORY,,}/$kind"
            expected=$(digest "$source:$RELEASE_VERSION")
            printf '%s\t%s\t%s\n' "$source" "$expected" latest >> "$RUNNER_TEMP/release-images.tsv"
            for target in docker.io/lcy0828/dst-admin-go "registry.cn-hangzhou.aliyuncs.com/$ALIYUN_NAMESPACE/dst-admin-go"; do
              [[ "$(digest "$target:$prefix$RELEASE_VERSION")" == "$expected" ]]
              printf '%s\t%s\t%s\n' "$target" "$expected" "${prefix}latest" >> "$RUNNER_TEMP/release-images.tsv"
            done
          done
      - name: Promote immutable manifests and verify all aliases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r repository expected alias; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
            [[ "$latest" == "$RELEASE_VERSION" ]]
            docker buildx imagetools create --prefer-index=false \
              --tag "$repository:$alias" "$repository@$expected"
            actual=$(docker buildx imagetools inspect "$repository:$alias" | awk '$1 == "Digest:" {print $2; exit}')
            [[ "$actual" == "$expected" ]]
            echo "Verified $repository:$alias = $expected" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/release-images.tsv"
