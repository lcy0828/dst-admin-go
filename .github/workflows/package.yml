name: Package

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: 'Official frontend branch, tag, or commit'
        default: master
        type: string
      publish_images:
        description: 'Publish tested images to GHCR and configured mirrors'
        default: true
        type: boolean

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: lcy0828
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  sources:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      frontend: ${{ steps.source.outputs.frontend }}
      version: ${{ steps.source.outputs.version }}
      stable: ${{ steps.source.outputs.stable }}
      dockerhub: ${{ steps.registries.outputs.dockerhub }}
      aliyun: ${{ steps.registries.outputs.aliyun }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lcy0828/dst-admin-vue
          ref: ${{ inputs.frontend_ref || 'master' }}
          path: .codex-build/frontend
          ssh-key: ${{ secrets.FRONTEND_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .codex-build/frontend/package-lock.json
      - name: Verify selected frontend
        working-directory: .codex-build/frontend
        run: |
          npm ci
          npm run lint -- --no-fix
          npm test
      - id: source
        name: Pin source revisions
        shell: bash
        run: |
          frontend=$(git -C .codex-build/frontend rev-parse HEAD)
          version="preview-${GITHUB_SHA:0:12}"
          stable=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo '::error::Release tags must use vX.Y.Z or vX.Y.Z-rc.N.'
              exit 1
            fi
            if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then stable=true; fi
          fi
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "Backend: $GITHUB_SHA; frontend: $frontend; version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Check mirror publishing configuration
        id: registries
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
            echo 'Docker Hub skipped: configure the DOCKERHUB_TOKEN Actions secret to enable publication.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$ALIYUN_USERNAME" && -n "$ALIYUN_PASSWORD" && -n "$ALIYUN_NAMESPACE" ]]; then
            echo 'aliyun=true' >> "$GITHUB_OUTPUT"
          else
            echo 'aliyun=false' >> "$GITHUB_OUTPUT"
            echo 'Alibaba Cloud skipped: configure ALIYUN_USERNAME and ALIYUN_PASSWORD secrets and the ALIYUN_NAMESPACE variable.' >> "$GITHUB_STEP_SUMMARY"
          fi

  native:
    needs: [sources, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-amd64
          - runner: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lcy0828/dst-admin-vue
          ref: ${{ needs.sources.outputs.frontend }}
          path: .codex-build/frontend
          ssh-key: ${{ secrets.FRONTEND_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .codex-build/frontend/package-lock.json
      - name: Build native package with embedded UI
        env:
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          FRONTEND_REF: ${{ needs.sources.outputs.frontend }}
        run: >-
          node deploy/scripts/build-native-release.mjs --version "$RELEASE_VERSION"
          --platform "$RELEASE_PLATFORM" --frontend .codex-build/frontend
          --frontend-ref "$FRONTEND_REF" --output dist
      - name: Start packaged binary without external UI
        env:
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          FRONTEND_REF: ${{ needs.sources.outputs.frontend }}
        run: >-
          node deploy/scripts/smoke-package.mjs
          --binary "dist/dst-admin-$RELEASE_VERSION-$RELEASE_PLATFORM/dst-admin"
          --frontend-commit "$FRONTEND_REF" --duration 180
      - name: Verify standalone Agent download
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum -c "dst-admin-agent-$RELEASE_PLATFORM.tar.gz.sha256"
          else
            shasum -a 256 -c "dst-admin-agent-$RELEASE_PLATFORM.tar.gz.sha256"
          fi
          agent_check=$(mktemp -d)
          tar -xzf "dst-admin-agent-$RELEASE_PLATFORM.tar.gz" -C "$agent_check"
          test -s "$agent_check/agent.conf.example"
          "$agent_check/dst-admin-agent" -version
      - uses: actions/upload-artifact@v4
        with:
          name: dst-admin-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  images:
    needs: [sources, quality]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        kind: [all-in-one, control-plane, agent, dst-runtime]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.kind == 'all-in-one' || matrix.kind == 'control-plane'
        with:
          repository: lcy0828/dst-admin-vue
          ref: ${{ needs.sources.outputs.frontend }}
          path: .codex-build/frontend
          ssh-key: ${{ secrets.FRONTEND_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build complete image
        env:
          IMAGE_KIND: ${{ matrix.kind }}
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
          FRONTEND_REF: ${{ needs.sources.outputs.frontend }}
        run: >-
          node deploy/scripts/build-image.mjs --kind "$IMAGE_KIND"
          --tag "dst-admin-test:$IMAGE_KIND" --version "$RELEASE_VERSION"
          --frontend .codex-build/frontend --frontend-ref "$FRONTEND_REF"
          --cache-from "type=registry,ref=ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE_KIND:preview"
          --cache-to type=inline --load
      - name: Check embedded UI and startup
        if: matrix.kind == 'all-in-one' || matrix.kind == 'control-plane'
        env:
          IMAGE_KIND: ${{ matrix.kind }}
          FRONTEND_REF: ${{ needs.sources.outputs.frontend }}
        run: >-
          node deploy/scripts/smoke-package.mjs --image "dst-admin-test:$IMAGE_KIND"
          --kind "$IMAGE_KIND" --frontend-commit "$FRONTEND_REF" --duration 180
      - name: Check Agent startup and graceful shutdown
        if: matrix.kind == 'agent'
        run: node deploy/scripts/smoke-agent-image.mjs dst-admin-test:agent 180
      - name: Check Runtime wrapper
        if: matrix.kind == 'dst-runtime'
        run: >-
          docker run --rm --entrypoint /usr/local/bin/dst-runtime-wrapper
          -e DST_ADMIN_VALIDATE_ONLY=1 -e DST_CLUSTER=Smoke -e DST_SHARD=Master
          -e DST_CONF_DIR=. -e DST_UGC_DIRECTORY=/opt/dst/workshop/steamapps/workshop
          dst-admin-test:dst-runtime
      - name: Push tested images to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        env:
          IMAGE_KIND: ${{ matrix.kind }}
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
        shell: bash
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE_KIND"
          docker tag "dst-admin-test:$IMAGE_KIND" "$target:$RELEASE_VERSION"
          docker push "$target:$RELEASE_VERSION"
          docker tag "dst-admin-test:$IMAGE_KIND" "$target:sha-$GITHUB_SHA"
          docker push "$target:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            docker tag "dst-admin-test:$IMAGE_KIND" "$target:preview"
            docker push "$target:preview"
          fi
          echo "Published $target:$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Docker Hub
        if: needs.sources.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the same tested images to Docker Hub
        if: needs.sources.outputs.dockerhub == 'true'
        env:
          IMAGE_KIND: ${{ matrix.kind }}
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
        shell: bash
        run: |
          case "$IMAGE_KIND" in
            all-in-one) prefix='' ;;
            control-plane) prefix='controller-' ;;
            agent) prefix='agent-' ;;
            dst-runtime) prefix='runtime-' ;;
            *) echo "::error::Unknown image kind: $IMAGE_KIND"; exit 1 ;;
          esac
          target="docker.io/$DOCKERHUB_NAMESPACE/dst-admin-go"
          tags=("$RELEASE_VERSION" "sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then tags+=(preview); fi
          for tag in "${tags[@]}"; do
            docker tag "dst-admin-test:$IMAGE_KIND" "$target:$prefix$tag"
            docker push "$target:$prefix$tag"
          done
          echo "Published $target:$prefix$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Alibaba Cloud ACR
        if: needs.sources.outputs.aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Push the same tested images to Alibaba Cloud
        if: needs.sources.outputs.aliyun == 'true'
        env:
          IMAGE_KIND: ${{ matrix.kind }}
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
        shell: bash
        run: |
          case "$IMAGE_KIND" in
            all-in-one) prefix='' ;;
            control-plane) prefix='controller-' ;;
            agent) prefix='agent-' ;;
            dst-runtime) prefix='runtime-' ;;
            *) echo "::error::Unknown image kind: $IMAGE_KIND"; exit 1 ;;
          esac
          target="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/dst-admin-go"
          tags=("$RELEASE_VERSION" "sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then tags+=(preview); fi
          for tag in "${tags[@]}"; do
            docker tag "dst-admin-test:$IMAGE_KIND" "$target:$prefix$tag"
            docker push "$target:$prefix$tag"
          done
          echo "Published $target:$prefix$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish_images)
    needs: [quality, sources, native, images]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dst-admin-*
          merge-multiple: true
          path: release
      - uses: docker/setup-buildx-action@v3
        if: needs.sources.outputs.stable == 'true'
      - name: Log in to GHCR for stable aliases
        if: needs.sources.outputs.stable == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub for stable aliases
        if: needs.sources.outputs.stable == 'true' && needs.sources.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote stable images after all package checks pass
        if: needs.sources.outputs.stable == 'true'
        env:
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
          PUBLISH_DOCKERHUB: ${{ needs.sources.outputs.dockerhub }}
        shell: bash
        run: |
          for kind in all-in-one control-plane agent dst-runtime; do
            target="ghcr.io/${GITHUB_REPOSITORY,,}/$kind"
            docker buildx imagetools create --prefer-index=false \
              --tag "$target:latest" "$target:$RELEASE_VERSION"
            echo "Published $target:latest from $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$PUBLISH_DOCKERHUB" == true ]]; then
              case "$kind" in
                all-in-one) prefix='' ;;
                control-plane) prefix='controller-' ;;
                agent) prefix='agent-' ;;
                dst-runtime) prefix='runtime-' ;;
              esac
              target="docker.io/$DOCKERHUB_NAMESPACE/dst-admin-go"
              docker buildx imagetools create --prefer-index=false \
                --tag "$target:${prefix}latest" "$target:$prefix$RELEASE_VERSION"
              echo "Published $target:${prefix}latest from $prefix$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Log in to Alibaba Cloud for stable aliases
        if: needs.sources.outputs.stable == 'true' && needs.sources.outputs.aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Promote stable Alibaba Cloud images
        if: needs.sources.outputs.stable == 'true' && needs.sources.outputs.aliyun == 'true'
        env:
          RELEASE_VERSION: ${{ needs.sources.outputs.version }}
        shell: bash
        run: |
          target="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/dst-admin-go"
          for prefix in '' controller- agent- runtime-; do
            docker buildx imagetools create --prefer-index=false \
              --tag "$target:${prefix}latest" "$target:$prefix$RELEASE_VERSION"
            echo "Published $target:${prefix}latest from $prefix$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Publish versioned downloads in the main repository
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_REF: ${{ needs.sources.outputs.frontend }}
        shell: bash
        run: |
          printf 'Backend: %s\nFrontend: %s\n\nWeb UI is embedded in the management binary.\n' "$GITHUB_SHA" "$FRONTEND_REF" > release-notes.md
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md "${args[@]}"
