    examples: ["提醒lcy该回家了", "通知小明快去打boss", "跟lcy说一声别乱跑", "对玩家lcy说注意安全", "提醒一下阿呆天要黑了", "给lcy发个提醒 准备过冬"]
    negatives: ["发全服公告", "给lcy发物品"]
    tier: R1
    confirm: none
    slots:
      message: {role: text}
    receipt: {done: "已提醒 {player}：{message}"}

  - id: player.ban
    aliases: [封禁, 封号, 拉黑, 封了, ban]
    examples: ["封禁lcy", "把小明封号三天", "拉黑这个捣乱的", "封了阿呆 理由是炸家", "ban掉lcy一天", "永久封禁玩家lcy"]
    negatives: ["解封lcy", "解除封禁"]
    tier: R3
    confirm: typed
    slots:
      reason: {role: text}
      duration: {role: enum}
    receipt: {done: "已封禁 {player}（{duration}）：{reason}"}

  - id: player.unban
    aliases: [解封, 解除封禁, 取消封禁, 移出黑名单, unban]
    examples: ["解封lcy", "把小明解除封禁", "取消阿呆的封禁", "lcy可以解封了", "把lcy从黑名单移出去", "unban lcy"]
    negatives: ["封禁lcy", "封号"]
    # 解封可随时撤销，一次确认即可。
    tier: R2
    confirm: once
    receipt: {done: "已解除 {player} 的封禁"}

  - id: player.god_mode
    aliases: [无敌, 无敌模式, 上帝模式, 不死, 免伤, 开无敌, 关无敌, god, godmode, invincible]
    examples: ["开启无敌模式", "给lcy开启无敌模式", "给lcy开无敌", "关掉lcy的无敌", "lcy开上帝模式", "让小明不死", "取消lcy的无敌模式", "给我开个无敌"]
    negatives: ["lcy开了无敌吗", "是否开启无敌", "超级无敌"]
    # 完整上帝模式；普通免伤是独立效果，不得按权限自动互换。
    tier: R1
    confirm: none
    slots:
      enabled: {role: toggle}
    receipt: {done: "已为 {player} {enabled}无敌模式", pending: "已提交：为 {player} {enabled}无敌模式，等待游戏确认"}

  - id: player.creative_mode
    aliases: [制作模式, 制造模式, 创造模式, 自由建造, 免费制作, 开创造, creative, freebuild, freecrafting]
    examples: ["开启制作模式", "给lcy开启制作模式", "关掉lcy的创造模式", "给小明开自由建造", "lcy开创造", "取消lcy的制造模式", "让阿呆免费制作"]
    negatives: ["lcy开了制作模式吗", "是否开启制造模式"]
    # 规范能力：set_player_mode.creative prefer 本能力。
    tier: R1
    confirm: none
    slots:
      enabled: {role: toggle}
    receipt: {done: "已为 {player} {enabled}制作模式", pending: "已提交：为 {player} {enabled}制作模式，等待游戏确认"}

  - id: player.give_item
