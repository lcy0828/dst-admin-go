# Bot capability semantic + policy registry (code-owned).
#
# 这里只描述“语言”和“面向机器人的策略”：别名、例句、反例、风险等级、确认方式、
# 槽位角色、回执模板。可执行的配方（BotCapabilities 的 build、控制台模板）仍然只在 Go
# 代码里，注册表永远不能提供脚本、路由或处理函数。
#
# 约定：
# - tier: R0 只读 | R1 单人可逆 | R2 影响全服/他人 | R3 破坏性/不可逆
# - confirm: none | once | typed（R0 必须 none；R2 至少 once；R3 必须 typed）
# - 带 actions 的能力：父级 tier/confirm 取所有子动作中的最高值；子动作未写 tier/confirm 时继承父级。
#   已知子动作时，决策层必须使用子动作的策略。
# - prefer: 指向同一意图的规范能力。发现时规范能力排在前面；被 prefer 的一方可以与规范能力共享别名。
# - 回执占位符：{player}（目标玩家显示名）、{world}（世界显示名），以及本能力的参数名。
# - 这里的 tier/confirm 只决定“是否需要确认”，不决定可见性或权限。

slot_defaults:
  worldId: {role: world, ask: never}
  playerId: {role: target_player}
  player_id: {role: target_player}
  feedback: {role: presentation}
  phase: {role: internal}
  preview_id: {role: internal}
  confirmed: {role: internal}
  confirmation: {role: internal}
  expected_session: {role: internal}

capabilities:
  # ───────────────────────────── 地点 ─────────────────────────────
  - id: location.save
    aliases: [保存位置, 保存地点, 记录地点, 标记地点, 记为基地, 当前位置, 存个点, mark location]
    examples: ["把lcy现在的位置存成基地", "保存lcy当前位置叫猪王村", "记录一下我现在的位置", "标记地点 矿区", "把小明站的地方记为基地", "帮lcy存个点叫家"]
    negatives: ["保存世界", "保存一下存档"]
    tier: R1
    confirm: none
    slots:
      name: {role: location}
    receipt: {done: "已把 {player} 当前位置保存为「{name}」"}

  - id: player.teleport
    aliases: [传送地点, 传送到地点, 传送到基地, 传送到, 回基地, 前往位置, 送回家, teleport destination]
    examples: ["把lcy传送到基地", "传送lcy到猪王村", "让小明回基地", "把玩家甲传送到营地", "送lcy回家", "lcy 传送到 矿区"]
    negatives: ["传送到玩家身边", "传送到地图中心"]
    # 地点由服务端解析，再由可信客户端确认（prepareRoomTeleport）。
    tier: R1
    confirm: none
    slots:
      locationName: {role: location}
      locationId: {role: internal}
      landmarkRef: {role: internal}
    actions:
      spawn:
        aliases: [出生点, 出生门, 绚丽之门]
        examples: [传送玩家到出生点, 把示例玩家送到绚丽之门, 示例玩家回出生门]
      pig_king:
        aliases: [猪王, 猪王村, pig_king]
        examples: [传送玩家到猪王, 把示例玩家送到猪王村, 示例玩家去猪王]
      lunar_island:
        aliases: [月岛, 月亮岛, lunar_island]
        examples: [传送玩家到月岛, 把示例玩家送到月亮岛, 示例玩家去月岛]
      oasis:
        aliases: [绿洲, oasis]
        examples: [传送玩家到绿洲, 把示例玩家送到绿洲, 示例玩家去绿洲]
      dragonfly:
        aliases: [龙蝇沙漠, 龙蝇, dragonfly]
        examples: [传送玩家到龙蝇沙漠, 把示例玩家送到龙蝇, 示例玩家去龙蝇沙漠]
      bee_queen:
        aliases: [蜂后, bee_queen]
        examples: [传送玩家到蜂后, 把示例玩家送到蜂后, 示例玩家去蜂后]
    receipt: {done: "已把 {player} 传送到「{locationName}」", pending: "已准备把 {player} 传送到「{locationName}」，等待确认"}

  - id: room.locations
    aliases: [有哪些地点, 已保存地点, 地点列表, 基地列表, 保存的位置, locations]
    examples: ["有哪些保存的地点", "看看地点列表", "我们存过哪些基地", "已保存地点有哪些", "查一下保存的位置", "地点都有啥"]
    negatives: ["保存当前位置", "传送到基地"]
    tier: R0
    confirm: none
    slots:
