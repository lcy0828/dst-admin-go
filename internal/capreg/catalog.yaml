    aliases: [给, 发, 发放, 给予, 发物品, 给物品, 物品, 肉丸, give item, meatballs]
    examples: ["给玩家lcy 发五个草", "给玩家lcy发五个草", "给lcy发5个草", "发五个草给lcy", "给小明10个木头", "给lcy来一组肉丸", "给他发五个草", "帮lcy刷20个金块"]
    negatives: ["给lcy开启无敌模式", "给lcy发个提醒"]
    tier: R1
    confirm: none
    slots:
      item: {role: item}
      count: {role: quantity}
    receipt: {done: "已给 {player} 发放 {item} ×{count}", pending: "已提交：给 {player} 发放 {item} ×{count}，等待游戏确认"}

  - id: player.kick
