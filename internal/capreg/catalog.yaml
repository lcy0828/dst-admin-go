    examples: ["把lcy踢出去", "踢掉小明", "踢人 阿呆", "把这个捣乱的踢了", "kick lcy", "让lcy先下线"]
    negatives: ["封禁lcy", "踢出黑名单"]
    # 踢人影响他人在线状态，按 R2 一次确认。
    tier: R2
    confirm: once
    receipt: {done: "已将 {player} 踢出房间"}

  - id: player.kill
    aliases: [杀死玩家, 杀死, 击杀玩家, 弄死, kill]
    examples: ["杀死lcy", "把小明弄死", "击杀玩家阿呆", "让lcy死一次", "kill lcy", "把lcy杀了重来"]
    negatives: ["lcy打了谁", "击杀附近生物", "全员死亡"]
    tier: R3
    confirm: typed
    receipt: {done: "已让 {player} 死亡"}

  - id: player.reset_character
    aliases: [重选角色, 换人物, 重置玩家, 换角色, 重置角色, reset_character, despawn]
