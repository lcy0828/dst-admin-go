    # 问题 #7：“重置世界”必须去 regenerate，不能落到重置玩家。
    negatives: ["重置世界", "重新生成世界", "重置远古"]
    tier: R3
    confirm: typed
    receipt: {done: "已让 {player} 重选角色"}

  - id: player.resurrect
    aliases: [复活, 救活, 救人, 拉起来, 复活玩家, resurrect, revive]
    examples: ["复活lcy", "复活 lcy", "复活玩家 lcy", "把小明救活", "再次复活", "lcy死了 拉一下", "救一下阿呆"]
    negatives: ["全员复活", "lcy是怎么死的"]
    # 复活是单人可逆操作：任何入口都不确认（问题 #1）。
    tier: R1
    confirm: none
    receipt: {done: "已复活 {player}", pending: "已提交：复活 {player}，等待游戏确认"}

  - id: player.spawn_entity
    aliases: [生成, 刷, 生物, 座狼, 狗王, 刷怪, spawn]
    examples: ["在lcy旁边刷两只猎犬", "给小明生成一只座狼", "在lcy附近刷3只蜘蛛", "刷个狗王给lcy打", "在阿呆身边生成兔子", "给lcy刷点蜜蜂"]
    negatives: ["生成驯化皮弗娄牛", "生成特殊设施"]
    # 固定白名单内的敌对生物也会影响附近其他玩家，按 R2。
    tier: R2
    confirm: once
    slots:
      entity: {role: entity}
      count: {role: quantity}
    receipt: {done: "已在 {player} 附近生成 {entity} ×{count}", pending: "已提交：在 {player} 附近生成 {entity} ×{count}"}

