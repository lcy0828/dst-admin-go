      parameters:
        - { name: view, in: query, description: The facts view omits Steam metadata and cross-room references; version comparison remains unknown until enriched., schema: { type: string, enum: [full, facts], default: full } }
      responses:
        "200": { description: Actual Mod content on the selected installation, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeInstallationModInventoryEnvelope" } } } }
