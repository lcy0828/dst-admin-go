        schedule: { type: string, default: "0 4 * * *" }
        timezone: { type: string, default: "Asia/Shanghai" }
        keep: { type: integer, minimum: 1, maximum: 100, default: 7 }
        mode: { type: string, enum: [automatic, hot-consistent, cold-consistent], default: automatic }
    BackupScheduleInput:
      type: object
      additionalProperties: false
      properties:
        taskId: { type: string, format: uuid, description: Existing backup task. Required when multiple plans exist. }
        createNew: { type: boolean, default: false, description: Explicitly create an additional plan instead of reusing one. }
        expectedRevision: { type: string, format: uuid, description: Latest task revision; mismatches return a conflict. }
        enabled: { type: boolean, description: Preserve existing state when omitted; new plans default to true. }
        name: { type: string, minLength: 1, maxLength: 80 }
        schedule: { type: string, minLength: 1, maxLength: 128, description: Five-field or six-field Cron; new plans default to daily at 04:00. }
        timezone: { type: string, minLength: 1, maxLength: 64, description: IANA time zone; new plans default to Asia/Shanghai. }
        keep: { type: integer, minimum: 1, maximum: 100, description: Recent successful automatic snapshots to keep; defaults to 7 only when creating. Manual/protection backups and real saves are preserved. }
        mode: { type: string, enum: [automatic, hot-consistent, cold-consistent], description: Preserve when omitted. New plans and old tasks without mode use automatic. Automatic uses an online backup only when every world runs; otherwise it stops and restores running worlds. Explicit hot-consistent never stops worlds or falls back to cold. Cold backups use the room maintenance announcement policy before stopping. Mode selection applies to automation tasks, not legacy interval policies. Pause an old interval policy separately when replacing it with a new plan. }
        clearRetention: { type: boolean, default: false, description: Disable automatic snapshot cleanup; mutually exclusive with keep. }
      not:
        anyOf:
          - required: [keep, clearRetention]
            properties: { clearRetention: { const: true } }
          - required: [taskId, createNew]
            properties: { createNew: { const: true } }
