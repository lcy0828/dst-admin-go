    AnnouncementDeleteEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/AnnouncementDeleteResult" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    JobStatus:
