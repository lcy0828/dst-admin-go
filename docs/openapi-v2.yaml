        resultNotes: "返回新的重试 Job；用其 id 查询 getJob，继续用原 releaseId 查询 getGameRelease，不能互换。安装全部已验证但自动恢复受阻时，可按用户要求携带 finishWithoutRestart=true 及原计划 planHash/confirmation 结束维护、保持世界当前状态；不完整或未知写入不能解锁。abandoned 表示主动结束维护，不表示自动恢复成功。分片 warningCode=RUNTIME_FALLBACK_GAME 表示加速组件不可用而使用原版恢复，不能说仍在使用 LuaJIT。"
        actions: ["重试游戏版本发布任务", "断点续做版本升级", "跳过已到达目标版本的安装", "结束已验证安装的维护，保留世界当前状态"]
        queries: ["游戏版本那批发布失败了，再跑一遍", "有几台机器已经升到新版本了，剩下的重新推一下"]
        terms: ["版本发布", "目标版本", "灰度升级", "断点续做", "发布批次", "维护锁", "结束维护", "不继续启动"]
      summary: Resume a release using persisted write receipts and original world restore intentions
      description: |
        To end maintenance without restarting, send finishWithoutRestart=true with the original stored planHash as both planHash and confirmation. This abandons only automatic restart: it requires every installation to have verified write evidence, the expected build and a healthy Steam manifest, plus stable current world states. It never unlocks a partial or unknown installation, repairs LuaJIT, or starts/stops worlds. The terminal release stage is abandoned, not succeeded.
        If nextAction is backup_decision, send an empty body to retry backups, {"confirmed":true,"skipBackup":true} to explicitly skip remaining backups, or {"confirmed":true,"cancelUpdate":true} to cancel and restore original running worlds. Skip/cancel cannot be combined with version-repair or plan-hash fields.
        Read getGameRelease first. Unknown dispatched writes are observed before any resend. For irrecoverable receipts, explicitly re-preview with policy.validate true and confirm validateUnknown to perform a guarded repair. Verified installations are not downloaded again. If nextAction is preview_and_retry, preview the original exact installation scope and policy, then send that planHash as both planHash and confirmation to accept the new latest Steam build. The path is an object with releaseId, not a bare string or an id field. Poll the returned new Job ID with getJob and keep reading the original release ID with getGameRelease. Do not pass the retry Job ID to getGameRelease.
        MCP arguments example (replace sample IDs, hash and requestId with actual values; reuse requestId only for the same request):
        {"path":{"releaseId":"24a00000-0000-4000-8000-000000000001"},"requestId":"issue24-retry-001"}
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                planHash: { type: string, pattern: '^[a-f0-9]{64}$', description: Fresh re-preview hash when explicitly accepting a changed upstream build }
                confirmation: { type: string, pattern: '^[a-f0-9]{64}$', description: Must equal planHash }
                confirmed: { type: boolean, description: Explicit confirmation required for skipBackup or cancelUpdate }
                skipBackup: { type: boolean, default: false, description: Skip remaining backups and resume this release. Requires confirmed=true and nextAction=backup_decision before any game write. }
                cancelUpdate: { type: boolean, default: false, description: Cancel a backup-decision pause and restore originally running worlds. Requires confirmed=true. Mutually exclusive with skipBackup and version repair options. }
                finishWithoutRestart: { type: boolean, default: false, description: End verified maintenance while preserving current world states. Requires original planHash and matching confirmation. Cannot combine with validateUnknown. }
                validateUnknown: { type: boolean, default: false, description: Explicit repair of a lost write receipt. Requires a fresh original-scope preview with policy.validate true and matching planHash/confirmation. Starts a new fenced validation attempt only after node-local directory and SteamCMD process guards pass. }
      responses:
        "202":
          description: Release recovery Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
