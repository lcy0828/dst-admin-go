        statusCode: { type: string }
        paused: { type: boolean, description: "Current process simulation pause state; omitted when unknown." }
        placement: { $ref: "#/components/schemas/TopologyPlacement" }
        target: { $ref: "#/components/schemas/TopologyTargetSummary" }
    FleetRuntimeRoom:
      type: object
      additionalProperties: false
      required: [id, directoryName, name, description, gameMode, maxPlayers, pvp, passwordProtected, managed, controlState, controlAvailable, worldCount, targetIds, availableTargetIds, updatedAt, worlds, mixedPlacement, topologyRevision]
      properties:
        id: { type: string }
        directoryName: { type: string }
        name: { type: string }
        description: { type: string }
        gameMode: { type: string }
        maxPlayers: { type: integer }
        pvp: { type: boolean }
        passwordProtected: { type: boolean }
        managed: { type: boolean }
        controlState: { type: string, enum: [ready, degraded, offline, unavailable] }
        controlAvailable: { type: boolean }
        worldCount: { type: integer }
        updatedAt: { type: string, format: date-time }
        worlds: { type: array, items: { $ref: "#/components/schemas/FleetRuntimeWorld" } }
        targetIds: { type: array, uniqueItems: true, items: { type: string } }
        availableTargetIds: { type: array, uniqueItems: true, items: { type: string } }
        mixedPlacement: { type: boolean }
        topologyRevision: { type: string }
    FleetRuntimeOverview:
      type: object
      additionalProperties: false
      required: [scope, summary, targets, rooms, issues, observedAt]
      properties:
        scope: { $ref: "#/components/schemas/FleetRuntimeScope" }
        summary: { $ref: "#/components/schemas/FleetRuntimeSummary" }
        targets: { type: array, items: { $ref: "#/components/schemas/TopologyTargetSummary" } }
        rooms: { type: array, items: { $ref: "#/components/schemas/FleetRuntimeRoom" } }
        issues: { type: array, items: { $ref: "#/components/schemas/FleetRuntimeProblem" } }
        observedAt: { type: string, format: date-time }
    FleetRuntimeOverviewEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/FleetRuntimeOverview" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    GameNotificationInput:
      type: object
      additionalProperties: false
      required: [roomId, message]
      properties:
        roomId: { type: string }
        message: { type: string, minLength: 1, maxLength: 500 }
    GameNotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, notificationId, worldId, worldName, status]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        notificationId: { type: string, format: uuid }
        worldId: { type: string }
        worldName: { type: string }
        targetId: { type: string }
        agentId: { type: string }
        status: { type: string, enum: [queued, succeeded, failed, skipped, canceled] }
        message: { type: string }
        errorCode: { type: string }
        errorMessage: { type: string }
        topologyRevision: { type: string }
        sentAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
    GameNotification:
      type: object
      additionalProperties: false
      required: [id, roomId, roomName, message, source, status, successCount, failureCount, skippedCount, canceledCount, createdAt, deliveries]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string }
        roomName: { type: string }
        message: { type: string }
        source: { type: string, enum: [manual, room_stop, room_restart, game_update, mod_sync, automation] }
        status: { type: string, enum: [queued, sending, succeeded, partial, failed, skipped, canceled] }
        jobId: { type: string, format: uuid }
        successCount: { type: integer, minimum: 0 }
        failureCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        canceledCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        deliveries: { type: array, items: { $ref: "#/components/schemas/GameNotificationDelivery" } }
    GameNotificationList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GameNotification" } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    GameNotificationListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/GameNotificationList" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    GameNotificationPolicyInput:
      type: object
      additionalProperties: false
      required: [enabled, countdownSeconds]
      properties:
        enabled: { type: boolean }
        countdownSeconds: { type: integer, minimum: 10, maximum: 600 }
    GameNotificationPolicy:
      type: object
      additionalProperties: false
      required: [roomId, enabled, countdownSeconds, updatedAt]
      properties:
        roomId: { type: string }
        enabled: { type: boolean }
        countdownSeconds: { type: integer, minimum: 10, maximum: 600 }
        updatedAt: { type: string, format: date-time }
    GameNotificationPolicyEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/GameNotificationPolicy" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
    JobOutcome:
      type: string
      enum: [pending, full, partial, none]
    JobError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    JobTarget:
      type: object
      additionalProperties: false
      required: [id, targetId, name, status]
      properties:
        id:
          type: integer
          format: int64
        targetId:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        message:
          type: string
        error:
          $ref: "#/components/schemas/JobError"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - status
        - outcome
        - progress
        - cancelRequested
        - createdAt
        - targets
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        outcome:
          $ref: "#/components/schemas/JobOutcome"
        roomId:
          type: string
        worldId:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
        transfer:
          $ref: "#/components/schemas/JobTransferProgress"
        progressDetail:
          $ref: "#/components/schemas/JobProgressDetail"
        error:
          $ref: "#/components/schemas/JobError"
        cancelRequested:
          type: boolean
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        targets:
          type: array
          items:
            $ref: "#/components/schemas/JobTarget"
    JobProgressDetail:
      type: object
      additionalProperties: false
      description: Current phase and cumulative per-Mod/world results. Transfer bytes describe the current Mod, not the whole batch.
      properties:
        observedAt:
          type: string
          format: date-time
          description: Time of the latest progress sample, used to hide stale throughput estimates.
        stage:
          type: string
        workshopId:
          type: string
        currentItem:
          type: integer
        totalItems:
          type: integer
        targetId:
          type: string
        installationId:
          type: string
        items:
          type: array
          description: Cumulative per-mod download results, retained through later job phases and completion. An unstarted item remains queued if the job fails.
          items:
            $ref: "#/components/schemas/ModDownloadProgress"
        worlds:
          type: array
          description: Per-world start/restart milestones from existing lifecycle/readiness observations; retained through task completion. Batch tasks use room-scoped world IDs and readable room/world names. Percent estimates stage completion, not elapsed or remaining time.
          items:
            $ref: "#/components/schemas/WorldOperationProgress"
    WorldOperationProgress:
      type: object
      additionalProperties: false
      required: [worldId, name, stage, percent]
      properties:
        worldId: { type: string }
        name: { type: string }
        isMaster: { type: boolean }
        stage: { type: string, enum: [queued, stopping, stopped, starting, initializing, loading_mods, generating_world, loading_world, connecting, ready, failed, canceled, unconfirmed] }
        percent: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
    ModDownloadProgress:
      type: object
      additionalProperties: false
      required: [workshopId, status]
      properties:
        workshopId: { type: string }
        targetId: { type: string }
        installationId: { type: string }
        status: { type: string, enum: [queued, downloading, succeeded, failed] }
        message: { type: string }
        currentBytes: { type: integer, format: int64, minimum: 0 }
        totalBytes: { type: integer, format: int64, minimum: 0 }
        bytesPerSecond: { type: integer, format: int64, minimum: 0 }
    JobTransferProgress:
      type: object
      additionalProperties: false
      required: [currentBytes, totalBytes]
      properties:
        currentBytes:
          type: integer
          format: int64
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        bytesPerSecond:
          type: integer
          format: int64
          minimum: 0
          description: Approximate throughput reported by the active transfer source.
    JobEvent:
      type: object
      additionalProperties: false
      required: [id, jobId, type, data, createdAt]
      properties:
        id:
          type: integer
          format: int64
        jobId:
          type: string
          format: uuid
        type:
          type: string
        data:
          $ref: "#/components/schemas/Job"
        createdAt:
          type: string
          format: date-time
    JobEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Job"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    JobList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    JobListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/JobList"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
security:
  - sessionCookie: []
