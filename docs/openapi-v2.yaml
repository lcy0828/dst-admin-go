  /rooms/{roomId}/worlds/{worldId}/entity-catalog/snapshot:
    parameters: [{ $ref: "#/components/parameters/RoomID" }, { $ref: "#/components/parameters/WorldID" }]
    get:
      tags: [Entity Catalog]
      operationId: readWorldEntitySnapshot
      x-dst-access:
        profile: panel-manage
        category: world
      x-dst-intent:
        purpose: "分页浏览或按名字搜索某个世界缓存的实体快照，用来看清世界里到底刷了哪些东西、每类各有多少。"
        actions: ["分页浏览世界实体快照", "按 prefab 名搜索实体", "统计某类生物或物件的数量"]
        queries: ["服里卡顿，想数一下世界里到底堆了多少实体", "谁在基地刷了一堆东西，搜下实体快照"]
        terms: ["实体快照", "prefab", "实体数量", "缓存快照", "世界数据"]
      x-dst-tool: {"runtime": "shard-ready"}
      summary: Browse or search a cached world Prefab snapshot with bounded pagination
      description: Coalesces concurrent requests to the same world. At most two collections and two snapshots, cached for five minutes. Uses bounded Runtime 2.4.8 batches over the existing Agent transport, with up to 2048 entries and 128 KiB of encoded item JSON per batch, with legacy 120-entry pages only after explicit batch rejection. One batch in flight per world, at most 50000 entries and an 8 MiB metadata budget, within 30 seconds. Inconsistent or partial reads fail. No game mutations or fallback to local placement. No idle polling. A forced refresh replaces the previous snapshot. Canceled collectors finish unwinding before replacement. A collection retries busy/stale pages at most three times within its original deadline. Errors include details.retryable and a reason code; incomplete snapshots are never cached.
      parameters:
        - { name: refresh, in: query, description: Refresh only on the first page; later pages must reuse the same snapshot, schema: { type: boolean, default: false } }
        - { name: observedAt, in: query, description: Pass the prior page's observedAt to reject mixed snapshots with RUNTIME_CATALOG_CHANGED if the cache expired or another caller refreshed it, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string, maxLength: 100, default: "" } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 50000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 120, default: 60 } }
        - { name: complete, in: query, description: Explicit full-directory mode for the web workbench; keep false for AI and MCP calls, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Defaults to 60 matching entries and the original snapshot observation time. Page changes reuse the bounded snapshot without further game commands. complete=true returns the full matching directory for client-side ranking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/CatalogEntity" } }
                      mods: { type: array, items: { type: object } }
                      total: { type: integer }
                      offset: { type: integer }
                      limit: { type: integer }
                      hasMore: { type: boolean }
                      observedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Directory unavailable; error codes include RUNTIME_BUSY, RUNTIME_CATALOG_CHANGED, RUNTIME_CATALOG_TIMEOUT, RUNTIME_CATALOG_LIMIT, RUNTIME_NOT_INSTALLED and RUNTIME_CATALOG_UNAVAILABLE. error.details.retryable indicates whether bounded read retries are appropriate.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "499": { description: Client canceled the directory read }
