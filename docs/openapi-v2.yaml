      type: object
      additionalProperties: false
      required: [roomId]
      properties:
        roomId:
          type: string
        worldIds:
          type: array
          uniqueItems: true
          items:
            type: string
        allowCapacityRisk:
          type: boolean
          default: false
        runtimeMode:
          $ref: "#/components/schemas/RuntimePerformanceMode"
          description: Explicit Lua runtime for this selection. Omit to preserve each world's own running or remembered mode, including mixed modes.
        runtimeVersion:
          type: string
          pattern: '^(game|[0-9]+\.[0-9]+\.[0-9]+)$'
          description: Exact LuaJIT package version shown to the user.
