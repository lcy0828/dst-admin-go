          $ref: "#/components/schemas/RoomLogSnapshot"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    ChatLogChange:
      type: object
      required: [id, operation, kind, recordedAt, historical]
      properties:
        id: { type: string, description: Stable chat record ID, distinct from the SSE revision cursor }
        operation: { type: string, enum: [created, updated, deleted] }
        kind: { $ref: "#/components/schemas/ChatLogKind" }
        recordedAt: { type: string, format: date-time, description: Journal commit preparation time, not speech time }
        historical: { type: boolean, description: Archive or repair ingestion; false does not guarantee recent occurrence }
        truncated: { type: boolean, description: Payload exceeded the SSE limit; do not treat as complete }
        entry: { $ref: "#/components/schemas/ChatLogEntry" }
