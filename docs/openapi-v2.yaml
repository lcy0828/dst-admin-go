        content: { type: string }
        publishTime: { type: string, format: date-time }
        expireTime: { type: string, format: date-time }
        target: { $ref: "#/components/schemas/AnnouncementTarget" }
        important: { type: boolean }
        status: { $ref: "#/components/schemas/AnnouncementStatus" }
