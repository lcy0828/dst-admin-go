openapi: 3.1.0
info:
  title: DST Admin API
  version: 2.0.0-alpha.1
  description: >-
    Contract for the authenticated DST Admin management API. JSON fields use
    camelCase. Authenticated state-changing requests require X-CSRF-Token and
    Idempotency-Key headers. Clients send X-DST-Runtime-Target with local or an
    agent-prefixed target ID; unsupported remote domain operations fail closed.
servers:
  - url: /api/v2
tags:
  - name: Auth
  - name: System
  - name: Rooms
  - name: Logs
  - name: Console
  - name: Backups
  - name: Game
  - name: Maps
  - name: Configuration
  - name: Mods
  - name: Players
  - name: Runtime
  - name: Runtime Audit
  - name: WorldState
  - name: Automation
  - name: Agents
  - name: Kubernetes
  - name: Topology
  - name: Containers
  - name: Jobs
  - name: Save Imports
paths:
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      security: []
      summary: Inspect setup and session state
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
  /auth/setup:
    post:
      tags: [Auth]
      operationId: setupAdmin
      security: []
      summary: Create the single administrator on first run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCredentials"
      responses:
        "201":
          description: Administrator and session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Create an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Login attempts are temporarily rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change the administrator password and revoke every session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  maxLength: 72
                newPassword:
                  type: string
                  minLength: 6
                  maxLength: 72
      responses:
        "200":
          description: Password changed; the client must log in again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /system/capabilities:
    get:
      tags: [System]
      operationId: getSystemCapabilities
      summary: Detect platform, tools, paths, and available management features
      responses:
        "200":
          description: Runtime capability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/setup-checks:
    get:
      tags: [System]
      operationId: getSetupChecks
      summary: Re-run deployment and room discovery checks
      responses:
        "200":
          description: Current deployment readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Read host, CPU, memory, disk, process, and Go runtime metrics
      responses:
        "200": { description: Current system status, content: { application/json: { schema: { $ref: "#/components/schemas/SystemStatusEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /system/settings:
    get:
      tags: [System]
      operationId: getSystemSettings
      summary: Read effective editable settings and their source without revealing secrets
      responses:
        "200":
          description: Current settings
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsEnvelope" } } }
  /system/settings/preview:
    post:
      tags: [System]
      operationId: previewSystemSettings
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsInput" } } } }
      responses:
        "200":
          description: Validated settings diff
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsPreviewEnvelope" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /system/settings/actions/apply:
    post:
      tags: [System]
      operationId: applySystemSettings
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsInput" } } } }
      responses:
        "200":
          description: Applied settings and restart state
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsApplyEnvelope" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /system/settings/actions/test-email:
    post:
      tags: [System]
      operationId: testSystemSMTPConnection
      summary: Establish a real SMTP connection, negotiate TLS, and authenticate when configured
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPTestInput"
      responses:
        "200":
          description: SMTP connection and optional authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPTestResultEnvelope"
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      summary: Discover DST rooms from the configured save root
      responses:
        "200":
          description: Discovered rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Atomically create and adopt a DST room
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInput"
      responses:
        "201":
          description: Room created and adopted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/actions/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [start, stop, restart]
    post:
      tags: [Rooms, Jobs]
      operationId: runBatchRoomAction
      summary: Start, stop, or restart selected worlds across multiple rooms through one persistent job
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRoomActionInput"
      responses:
        "202":
          description: Batch operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Read a discovered room
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Rooms]
      operationId: deleteRoom
      summary: Move a stopped room into the save-root recovery directory
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoomInput"
      responses:
        "200":
          description: Room moved to the recovery directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRoomResultEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/topology:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Topology]
      operationId: getRoomTopology
      summary: Read desired and applied Shard placement with whole-node capacity projections
      responses:
        "200":
          description: Planning-only room topology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [Topology]
      operationId: updateRoomTopology
      summary: Save desired placement without activating remote execution
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopologyUpdateInput" }
      responses:
        "200":
          description: Desired placement saved; applied placement remains unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/topology/preview:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Topology]
      operationId: previewRoomTopology
      summary: Preview cross-room target capacity, stale inventory, missing Shards, and duplicate runtimes
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopologyUpdateInput" }
      responses:
        "200":
          description: Topology preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/topology/actions/apply:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Topology, Jobs]
      operationId: applyRoomTopologyPlacement
      summary: Move one stopped Shard to its desired target and atomically activate the placement
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementMigrationInput" }
      responses:
        "202":
          description: Placement migration job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/backup-sets:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Backups]
      operationId: listDistributedBackupSets
      summary: List coordinated backup sets for every Shard in a room
      responses:
        "200":
          description: Coordinated backup sets ordered newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributedBackupSetListEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Backups, Jobs]
      operationId: createDistributedBackupSet
      summary: Stop all Shards and create a verified cold-consistent backup set
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributedBackupSetCreateInput" }
      responses:
        "202":
          description: Coordinated backup job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /backup-sets/{backupSetId}:
    parameters:
      - name: backupSetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Backups]
      operationId: getDistributedBackupSet
      summary: Inspect a coordinated backup set and every verified Shard part
      responses:
        "200":
          description: Coordinated backup set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributedBackupSetEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /backup-sets/{backupSetId}/actions/restore:
    parameters:
      - name: backupSetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Backups, Jobs]
      operationId: restoreDistributedBackupSet
      summary: Create a protection set, then restore and publish every Shard atomically
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributedBackupSetRestoreInput" }
      responses:
        "202":
          description: Coordinated restore job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-infrastructure:
    get:
      tags: [Topology, Runtime]
      operationId: getRuntimeInfrastructure
      summary: Inspect Runtime providers, execution environments, network scopes, port reservations, and CPU allocations
      responses:
        "200": { description: Current Runtime infrastructure snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeInfrastructureEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /runtime-infrastructure/network-profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Topology, Runtime]
      operationId: updateRuntimeNetworkProfile
      summary: Update one execution environment network identity
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeNetworkProfileInput" }
      responses:
        "200": { description: Updated network profile, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeNetworkProfileEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-infrastructure/cpu-allocations:
    put:
      tags: [Topology, Runtime]
      operationId: updateRuntimeCPUAllocation
      summary: Configure optional shared or exclusive logical CPU affinity for one Shard
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeCPUAllocationInput" }
      responses:
        "200": { description: Updated CPU allocation, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeCPUAllocationEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/recovery:
    get:
      tags: [Rooms]
      operationId: listRoomRecoveries
      summary: List recoverable room directories
      responses:
        "200":
          description: Recoverable rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryListEnvelope"
  /rooms/recovery/{recoveryName}/actions/restore:
    parameters:
      - $ref: "#/components/parameters/RecoveryName"
    post:
      tags: [Rooms]
      operationId: restoreRoomRecovery
      summary: Restore and adopt a deleted room
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Restored room, content: { application/json: { schema: { $ref: "#/components/schemas/RoomEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/recovery/{recoveryName}:
    parameters:
      - $ref: "#/components/parameters/RecoveryName"
    delete:
      tags: [Rooms]
      operationId: purgeRoomRecovery
      summary: Permanently remove a deleted room
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeRecoveryInput" }
      responses:
        "200": { description: Recovery item removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/adopt:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Rooms]
      operationId: adoptRoom
      summary: Mark a discovered room as managed
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Adopted room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{roomId}/worlds:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Rooms]
      operationId: listRoomWorlds
      summary: List shard configuration and current tmux state
      responses:
        "200":
          description: Room worlds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldListEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Rooms]
      operationId: createRoomWorld
      summary: Atomically create a stopped world with collision-free shard ports
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorldInput"
      responses:
        "201":
          description: World created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldRecordEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/worlds/{worldId}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    delete:
      tags: [Rooms]
      operationId: deleteRoomWorld
      summary: Move a stopped world into the room recovery directory
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteWorldInput"
      responses:
        "200":
          description: World moved to the recovery directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteWorldResultEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/worlds/recovery:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Rooms]
      operationId: listWorldRecoveries
      summary: List recoverable world directories for a room
      responses:
        "200": { description: Recoverable worlds, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryListEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /rooms/{roomId}/worlds/recovery/{recoveryName}/actions/restore:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/RecoveryName"
    post:
      tags: [Rooms]
      operationId: restoreWorldRecovery
      summary: Restore a deleted world while the room is stopped
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Restored world, content: { application/json: { schema: { $ref: "#/components/schemas/WorldRecordEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/worlds/recovery/{recoveryName}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/RecoveryName"
    delete:
      tags: [Rooms]
      operationId: purgeWorldRecovery
      summary: Permanently remove a deleted world
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeRecoveryInput" }
      responses:
        "200": { description: Recovery item removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/runtime:
