      description: |
        After the user confirms the selected scope, send confirmed=true with the same targetIds or installations and policy. policy.stopDelaySeconds accepts 0–360 seconds (0 stops immediately); policy.skipBackup=true explicitly skips new backups. The server resolves affected shared installations, verifies stop results and validates installed versions. Legacy clients may still send matching planHash and confirmation strings from an unchanged preview instead of confirmed=true. The returned Job ID is also the initial release ID. Poll getJob and getGameRelease for countdown, backup, update and restoration progress; getGameUpdateRun belongs to the legacy game.update flow. If nextAction=backup_decision, game files have not been updated: retry backup, explicitly skip it, or cancel and restore worlds through retryGameRelease.
