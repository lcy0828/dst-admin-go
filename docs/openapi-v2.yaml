        fileName:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        truncated:
          type: boolean
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
    RoomLogProblem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    WorldLogSnapshot:
      type: object
      additionalProperties: false
      required: [worldId, worldName, worldRole, readAt]
      properties:
        worldId: { type: string }
        worldName: { type: string }
        worldRole: { type: string, enum: [master, caves, custom] }
        readAt: { type: string, format: date-time }
        snapshot:
          $ref: "#/components/schemas/LogSnapshot"
        problem:
          $ref: "#/components/schemas/RoomLogProblem"
    RoomLogSnapshot:
      type: object
      additionalProperties: false
