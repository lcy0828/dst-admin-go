        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /runtime-targets/{targetId}/installations/{installationId}/mods/{modId}/actions/download:
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string, pattern: '^(local|agent:[A-Za-z0-9][A-Za-z0-9._-]{0,127})$' }
      - name: installationId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
      - $ref: "#/components/parameters/ModID"
    post:
      tags: [Mods, Agents, Jobs]
      operationId: downloadRuntimeInstallationMod
      summary: Download one Mod directly on a runtime installation without changing any room configuration
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Runtime installation Mod download Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /runtime-targets/{targetId}/installations/{installationId}/mods/{modId}/actions/update:
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string, pattern: '^(local|agent:[A-Za-z0-9][A-Za-z0-9._-]{0,127})$' }
      - name: installationId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
      - $ref: "#/components/parameters/ModID"
    post:
      tags: [Mods, Agents, Jobs]
      operationId: updateRuntimeInstallationMod
      summary: Update one Mod in a runtime installation without changing room configuration or world processes
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Runtime installation Mod update Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /runtime-targets/{targetId}/installations/{installationId}/mods/actions/update-outdated:
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string, pattern: '^(local|agent:[A-Za-z0-9][A-Za-z0-9._-]{0,127})$' }
      - name: installationId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    post:
      tags: [Mods, Agents, Jobs]
      operationId: updateOutdatedRuntimeInstallationMods
      summary: Update every outdated Mod in one runtime installation without changing room configuration or world processes
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Runtime installation Mod batch update Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /rooms/{roomId}/mods:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    get:
      tags: [Mods]
      operationId: listRoomMods
      parameters:
