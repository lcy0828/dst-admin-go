      description: >-
        Sends once through the applied Runtime placement, waiting at most eight seconds for a matching execution receipt.
        Never retries another Shard after a dispatch attempt. Job completion alone does not prove game execution:
        read listGameNotifications and match jobId, then inspect outcome. confirmed does not prove receipt by every player.
