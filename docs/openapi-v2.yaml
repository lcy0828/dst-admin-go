      type: string
      enum: [say, whisper, announcement]
    ChatLogSource:
      type: object
      additionalProperties: false
      required: [worldId, worldName, worldRole]
      properties:
        worldId: { type: string }
        worldName: { type: string }
        worldRole: { type: string, enum: [master, caves, custom] }
    ChatLogProblem:
      type: object
      additionalProperties: false
      required: [worldId, worldName, code, message]
      properties:
        worldId: { type: string }
        worldName: { type: string }
        code: { type: string }
        message: { type: string }
    ChatLogEntry:
      type: object
      additionalProperties: false
      required: [id, kind, content, sourceTimestamp, sources]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ChatLogKind" }
        announcementType: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        content: { type: string }
        sourceTimestamp: { type: string, pattern: '^[0-9]{2,}:[0-9]{2}:[0-9]{2}$' }
        occurredAt: { type: string, format: date-time }
