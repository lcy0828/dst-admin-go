      properties:
        schemaVersion: { type: integer, enum: [1] }
        producerVersion: { type: string }
        producerInstanceId: { type: string }
        sessionId: { type: string }
        shardId: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        requestId: { type: string }
        profile: { $ref: "#/components/schemas/DSTRuntimeDiagnosticProfile" }
        ok: { type: boolean }
        code: { type: string }
        message: { type: string }
        result: { type: object, additionalProperties: true }
        completedAtUnix: { type: integer, format: int64, minimum: 1 }

    DSTRuntimeDiagnosticEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/DSTRuntimeDiagnostic" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    DSTRuntimeUpdate:
      type: object
      additionalProperties: false
      required: [state, message, updatedAt]
      properties:
        state: { type: string, enum: [updating, current, updated, failed, disabled], description: "updating also covers temporary deferral while a room or Runtime operation is busy" }
        message: { type: string }
        version: { type: string }
        installationState:
          allOf: [{ $ref: "#/components/schemas/DSTRuntimeInstallState" }]
          description: "Last confirmed installation state for the current applied placement, installation path and Agent instance; progress, contention and transport errors retain evidence only within that location. Superseded requests cannot replace a newer report."
        updatedAt: { type: string, format: date-time }
    DSTRuntimeReport:
      type: object
      additionalProperties: false
      required: [roomId, worldId, worldName, state, processRunning, healthState]
      properties:
        roomId: { type: string }
        worldId: { type: string }
        worldName: { type: string }
        state: { $ref: "#/components/schemas/DSTRuntimeInstallState" }
        version: { type: string, description: "Installed Runtime version on the selected node; health.producerVersion identifies the running collector" }
        protocolVersion: { type: integer, minimum: 1 }
        changed: { type: boolean }
        backupPath: { type: string }
        message: { type: string }
        processRunning: { type: boolean }
        paused: { type: boolean, description: Simulation pause observed from the current process; absent when unknown }
        startupStage: { type: string, description: Current game startup milestone when available }
        healthState: { $ref: "#/components/schemas/DSTRuntimeHealthState" }
        health:
          allOf: [{ $ref: "#/components/schemas/DSTRuntimeHealth" }]
          description: "Observed collector health, including an older running version while installed files have already changed. Status observation does not relax version checks for Runtime commands."
        autoUpdate: { $ref: "#/components/schemas/DSTRuntimeUpdate" }
        healthMessage: { type: string }
    DSTRuntimeStatusEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/DSTRuntimeStatus" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    DSTRuntimeStatusList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DSTRuntimeStatus" } }
