        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rooms/{roomId}/worlds/{worldId}/runtime/events/stream:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    get:
      tags: [Runtime]
      operationId: streamWorldRuntimeEvents
      summary: Stream bounded Runtime events and resume after the last delivered producer cursor
      parameters:
        - name: cursor
          in: query
          description: Opaque producer-instance and sequence cursor returned in an earlier SSE id field
          schema: { type: string, maxLength: 277 }
