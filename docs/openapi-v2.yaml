      additionalProperties: false
      required: [id, providerId, targetId, kind, driver, networkProfileId, cpu, updatedAt]
      properties:
        id: { type: string }
        providerId: { type: string }
        targetId: { type: string }
        kind: { type: string, enum: [native, container] }
        driver: { type: string }
        networkProfileId: { type: string }
        cpu: { $ref: "#/components/schemas/AgentInventoryCPU" }
        observedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuntimeNetworkProfile:
      type: object
      additionalProperties: false
      required: [id, environmentId, name, mode, scopeId, bindAddress, advertiseAddress, updatedAt]
      properties:
        id: { type: string }
        environmentId: { type: string }
        name: { type: string }
        mode: { type: string, enum: [host, bridge] }
        scopeId: { type: string }
        bindAddress: { type: string }
        advertiseAddress: { type: string }
        updatedAt: { type: string, format: date-time }
    RuntimeNetworkProfileInput:
      type: object
      additionalProperties: false
      required: [name, bindAddress, advertiseAddress]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        bindAddress: { type: string }
        advertiseAddress: { type: string, maxLength: 255 }
    RuntimePortReservation:
      type: object
      additionalProperties: false
      required: [id, environmentId, networkProfileId, scopeId, targetId, cluster, shard, purpose, protocol, bindAddress, port, state, managed, updatedAt]
      properties:
        id: { type: string }
        environmentId: { type: string }
        networkProfileId: { type: string }
        scopeId: { type: string }
        targetId: { type: string }
        roomId: { type: string }
        worldId: { type: string }
        cluster: { type: string }
        shard: { type: string }
        purpose: { type: string, enum: [dst_server, cluster_master, steam_authentication, steam_master_server] }
        protocol: { type: string, const: udp }
        bindAddress: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        state: { type: string, enum: [active, planned, observed] }
        managed: { type: boolean }
        updatedAt: { type: string, format: date-time }
    RuntimeCPUAllocation:
      type: object
      additionalProperties: false
      required: [id, environmentId, targetId, roomId, worldId, policy, logicalCpuIds, physicalCoreKeys, allowSmtSiblingRisk, warnings, executionState, updatedAt]
      properties:
        id: { type: string }
        environmentId: { type: string }
        targetId: { type: string }
        roomId: { type: string }
        worldId: { type: string }
        policy: { type: string, enum: [none, shared, exclusive] }
        logicalCpuIds: { type: array, uniqueItems: true, items: { type: integer, minimum: 0 } }
        physicalCoreKeys: { type: array, uniqueItems: true, items: { type: string } }
        allowSmtSiblingRisk: { type: boolean }
        warnings: { type: array, items: { type: string } }
        executionState: { type: string, enum: [desired, prepared, applied, released, failed] }
        observed: { $ref: "#/components/schemas/RuntimeCPUObservation" }
        executionError: { type: string }
        updatedAt: { type: string, format: date-time }
    RuntimeCPUObservation:
      type: object
      additionalProperties: false
      required: [policy, state, runtime_kind, enforced, instance_running, observed_at]
      properties:
        policy: { type: string, enum: [none, shared, exclusive] }
        logical_cpu_ids: { type: array, uniqueItems: true, items: { type: integer, minimum: 0 } }
        effective_cpu_ids: { type: array, uniqueItems: true, items: { type: integer, minimum: 0 } }
        state: { type: string, enum: [prepared, applied, released, unknown] }
        runtime_kind: { type: string, enum: [native, container, memory] }
        instance_id: { type: string }
        pid: { type: integer, format: int32, minimum: 1 }
        quota_micros: { type: integer, format: int64, minimum: 0 }
        period_micros: { type: integer, format: int64, minimum: 0 }
        enforced: { type: boolean }
        instance_running: { type: boolean }
        observed_at: { type: string, format: date-time }
    RuntimeCPUAllocationInput:
      type: object
      additionalProperties: false
      required: [roomId, worldId, environmentId, policy, logicalCpuIds, allowSmtSiblingRisk]
      properties:
        roomId: { type: string }
        worldId: { type: string }
        environmentId: { type: string }
        policy: { type: string, enum: [none, shared, exclusive] }
        logicalCpuIds: { type: array, uniqueItems: true, items: { type: integer, minimum: 0 } }
        allowSmtSiblingRisk: { type: boolean }
    RuntimeResourceConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        scopeId: { type: string }
        port: { type: integer }
        targetId: { type: string }
        roomId: { type: string }
        worldId: { type: string }
    RuntimeResourcePreflight:
      type: object
      additionalProperties: false
      required: [ready, warnings, conflicts]
      properties:
        ready: { type: boolean }
        warnings: { type: array, items: { type: string } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/RuntimeResourceConflict" } }
    RuntimeInfrastructure:
      type: object
      additionalProperties: false
      required: [providers, environments, networkProfiles, portReservations, cpuAllocations, preflight, capacityPolicy, observedAt]
      properties:
        providers: { type: array, items: { $ref: "#/components/schemas/RuntimeProvider" } }
        environments: { type: array, items: { $ref: "#/components/schemas/RuntimeExecutionEnvironment" } }
        networkProfiles: { type: array, items: { $ref: "#/components/schemas/RuntimeNetworkProfile" } }
        portReservations: { type: array, items: { $ref: "#/components/schemas/RuntimePortReservation" } }
        cpuAllocations: { type: array, items: { $ref: "#/components/schemas/RuntimeCPUAllocation" } }
        preflight: { $ref: "#/components/schemas/RuntimeResourcePreflight" }
        capacityPolicy: { $ref: "#/components/schemas/TopologyCapacityPolicy" }
        observedAt: { type: string, format: date-time }
    RuntimeInfrastructureEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/RuntimeInfrastructure" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    RuntimeNetworkProfileEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/RuntimeNetworkProfile" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    RuntimeCPUAllocationEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/RuntimeCPUAllocation" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    TopologyPlacementInput:
      type: object
      additionalProperties: false
      required: [worldId, targetId]
      properties:
        worldId: { type: string }
        targetId: { type: string, description: local or agent followed by a colon and Agent ID }
    TopologyUpdateInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, placements]
      properties:
        expectedRevision: { type: string, format: uuid }
        allowOvercommit:
          type: boolean
          default: false
          description: Explicitly acknowledge the advisory risk when projected Shards exceed the recommended physical-core budget.
        placements:
          type: array
          items: { $ref: "#/components/schemas/TopologyPlacementInput" }
    PlacementMigrationInput:
      type: object
      additionalProperties: false
      required: [worldId, expectedRevision, confirmation]
      properties:
        worldId: { type: string }
        expectedRevision: { type: string, format: uuid }
        confirmation:
          type: string
          description: Exact room name used as explicit confirmation.
    TopologyPlacementState:
      type: string
      enum: [aligned, planned, target_offline, inventory_stale, inventory_missing, shard_missing, conflict]
    TopologyPlacement:
      type: object
      additionalProperties: false
      required: [worldId, worldName, worldRole, desiredTargetId, appliedTargetId, state, observedTargetIds]
      properties:
        worldId: { type: string }
        worldName: { type: string }
        worldRole: { type: string, enum: [master, caves, custom] }
        desiredTargetId: { type: string }
        appliedTargetId: { type: string }
        state: { $ref: "#/components/schemas/TopologyPlacementState" }
        observedTargetIds: { type: array, items: { type: string } }
    TopologyTargetSummary:
      type: object
      additionalProperties: false
      required: [id, name, kind, status, online, configured, inventoryAvailable, inventoryStale, observedRunningShards, unmanagedRunningShards, plannedShards, projectedShards, currentCapacity, projectedCapacity, requiresOvercommitConfirmation]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/RuntimeKind" }
        status: { $ref: "#/components/schemas/RuntimeStatus" }
        online: { type: boolean }
        configured: { type: boolean }
        inventoryAvailable: { type: boolean }
        inventoryStale: { type: boolean }
        staleReason: { type: string }
        observedAt: { type: string, format: date-time }
        observedRunningShards: { type: integer, minimum: 0 }
        unmanagedRunningShards: { type: integer, minimum: 0 }
        plannedShards: { type: integer, minimum: 0 }
        projectedShards: { type: integer, minimum: 0 }
        currentCapacity: { $ref: "#/components/schemas/AgentCapacity" }
        projectedCapacity: { $ref: "#/components/schemas/AgentCapacity" }
        requiresOvercommitConfirmation: { type: boolean }
    TopologyIssue:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string }
        targetId: { type: string }
        worldId: { type: string }
    TopologyCapacityPolicy:
      type: object
      additionalProperties: false
      required: [basis, shardsPerPhysicalCore, reservedPhysicalCores, enforced, message]
      properties:
        basis: { type: string, enum: [physical_cores] }
        shardsPerPhysicalCore: { type: integer, const: 1 }
        reservedPhysicalCores: { type: integer, minimum: 1 }
        enforced:
          type: boolean
          const: false
          description: Capacity is advisory; users may explicitly acknowledge overcommit.
        message: { type: string }
    Topology:
      type: object
      additionalProperties: false
      required: [roomId, revision, mode, remoteExecutionReady, placements, targets, issues, requiresOvercommitConfirmation, capacityPolicy, updatedAt]
      properties:
        roomId: { type: string }
        revision: { type: string, format: uuid }
        mode: { type: string, const: applied_placement }
        remoteExecutionReady:
          type: boolean
          const: true
          description: Desired placement can be activated through a verified stopped-Shard migration job.
        placements: { type: array, items: { $ref: "#/components/schemas/TopologyPlacement" } }
        targets: { type: array, items: { $ref: "#/components/schemas/TopologyTargetSummary" } }
        issues: { type: array, items: { $ref: "#/components/schemas/TopologyIssue" } }
        requiresOvercommitConfirmation: { type: boolean }
        capacityPolicy: { $ref: "#/components/schemas/TopologyCapacityPolicy" }
        updatedAt: { type: string, format: date-time }
    TopologyEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/Topology" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    AnnouncementTarget:
      type: string
