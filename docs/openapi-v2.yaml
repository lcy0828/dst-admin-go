      parameters:
        - { name: targetId, in: query, schema: { type: string } }
      responses:
        "200": { description: "Installation rows with exact targetId and installationId, online status, installed flag, gameVersion, serverPath, resolvedPath, savePath, SteamCMD availability, supported actions and per-node errors" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /runtime-targets/game-installations/probe:
    post:
      tags: [Runtime]
      operationId: probeExistingGameInstallation
      summary: Inspect an existing directory on the selected node without installing or moving files
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, installationId, path]
              properties:
                targetId: { type: string }
                installationId: { type: string }
                path: { type: string, maxLength: 4096 }
      responses:
        "200": { description: "Detected game version, canonical source directory and content fingerprint for explicit adoption" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-targets/game-installations/actions/install:
    post:
      tags: [Runtime]
      operationId: installGameOnRuntime
      summary: Install or validate DST with SteamCMD at a registered node location; all worlds must be stopped
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, installationId]
              properties:
                targetId: { type: string }
                installationId: { type: string }
      responses:
        "202": { description: "Tracked installation Job; execution and downloads belong to the selected Runtime" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-targets/game-installations/actions/adopt:
    post:
      tags: [Runtime]
      operationId: adoptExistingGameInstallation
      summary: Connect an inspected game directory to an empty registered installation location, preserving saves
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, installationId, path, fingerprint]
              properties:
                targetId: { type: string }
                installationId: { type: string }
                path: { type: string, maxLength: 4096 }
                fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "202": { description: "Tracked adoption Job; nonempty destination and changed source are rejected" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-targets/luajit:
    get:
      tags: [Runtime]
      operationId: listLuaJITPackagesAndInstallations
      summary: List compatible LuaJIT packages and exact runtime installations
      parameters:
        - { name: targetId, in: query, schema: { type: string } }
      responses:
        "200": { description: "Envelope containing optional controller transfers and installations; local installation includes its own releases, remote releases are fetched through the selected installation status endpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /runtime-targets/luajit/status:
    get:
      tags: [Runtime]
      operationId: inspectLuaJITInstallation
      summary: Read fresh LuaJIT readiness from the selected local or Agent installation
      parameters:
        - { name: targetId, in: query, required: true, schema: { type: string } }
        - { name: installationId, in: query, required: true, schema: { type: string } }
        - { name: refreshUpstream, in: query, schema: { type: boolean, default: false }, description: Explicitly refresh upstream release metadata on the selected Runtime; never downloads or installs a package. }
      responses:
        "200": { description: Envelope containing the selected installation, its own available releases and current performance report }
        "404": { $ref: "#/components/responses/NotFound" }
  /runtime-targets/luajit/packages:
    post:
      tags: [Runtime]
      operationId: uploadLuaJITPackage
      summary: Upload a compatible ZIP to the optional controller transfer store, maximum 256 MiB
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: "Package metadata: id, version, revision, os, arch, sha256, size, optional channel and sourceUrl" }
        "400": { description: Invalid upload or size limit exceeded }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-targets/luajit/actions/download:
    post:
      tags: [Runtime]
      operationId: downloadLuaJITPackage
      summary: Have the selected Runtime download an HTTPS package directly and cache it after SHA-256 verification
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, installationId, url, sha256]
              properties:
                targetId: { type: string }
                installationId: { type: string }
                url: { type: string, format: uri, pattern: '^https://' }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        "202": { description: LuaJIT download Job; poll the control-plane jobs endpoint }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-targets/luajit/actions/install:
    post:
      tags: [Runtime]
      operationId: installLuaJITPackage
      summary: Install or repair LuaJIT on one stopped DST installation with backup and rollback
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, installationId, releaseId]
              properties:
                targetId: { type: string }
                installationId: { type: string }
                releaseId: { type: string, pattern: '^[a-f0-9]{64}$' }
                source: { type: string, enum: [runtime, controller], default: runtime, description: 'Use node-owned packages by default; controller explicitly transfers an uploaded package' }
      responses:
        "202": { description: LuaJIT installation Job; success requires a confirmed readiness report }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-targets:
    get:
      tags: [Agents]
      operationId: listRuntimeTargets
      summary: List the controller-local runtime first, followed by Agent-backed remote runtimes
      responses:
        "200":
          description: Local-first runtime target list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTargetListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /runtime-targets/{targetId}:
    parameters:
      - name: targetId
        in: path
        required: true
        schema: { type: string, pattern: '^(local|agent:[A-Za-z0-9][A-Za-z0-9._-]{0,127})$' }
    patch:
      tags: [Agents]
      operationId: renameRuntimeTarget
      summary: Set the user-facing machine name without changing its hostname or runtime installation name
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeTargetNameInput" }
      responses:
        "200": { description: Renamed runtime target, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeTargetEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /runtime-targets/agents/{agentId}:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: getAgentRuntimeTarget
      summary: Read one Agent and its isolated remote runtime configuration
      responses:
        "200": { description: Remote runtime target, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeTargetEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Agents]
      operationId: configureAgentRuntimeTarget
      summary: Save paths interpreted only on the selected Agent machine
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeConfigInput" }
      responses:
        "200": { description: Configured remote runtime target, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeTargetEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Agents]
      operationId: unconfigureAgentRuntimeTarget
      summary: Remove only the Agent runtime paths without forgetting the Agent
      description: Also suppresses automatic adoption for this Agent so the same discovered installation is not recreated immediately. A later manual PUT clears the suppression.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Remote runtime configuration removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List persisted Agent snapshots and current connectivity
      responses:
        "200":
          description: Agent nodes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /agent-releases:
    get:
      tags: [Agents]
      operationId: listAgentReleases
      summary: List uploaded Agent binaries and detected target platforms
      responses:
        "200": { description: Agent releases, content: { application/json: { schema: { $ref: "#/components/schemas/AgentReleaseListEnvelope" } } } }
    post:
      tags: [Agents]
      operationId: uploadAgentRelease
      summary: Upload a versioned Go Agent binary for page-controlled upgrades
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, file]
              properties:
                version: { type: string, pattern: "^[0-9][0-9A-Za-z._+-]{0,63}$" }
                file: { type: string, format: binary }
      responses:
        "201": { description: Agent release stored, content: { application/json: { schema: { $ref: "#/components/schemas/AgentReleaseEnvelope" } } } }
        "413": { description: Agent binary exceeds the 128 MiB upload limit }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /agent-releases/{releaseId}:
    parameters:
      - { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Agents]
      operationId: deleteAgentRelease
      summary: Delete an Agent binary that is not being downloaded
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Agent release deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /agents/actions:
    get:
      tags: [Agents]
      operationId: listAgentActions
      summary: List the fixed domain action allowlist
      responses:
        "200":
          description: Allowed Agent actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentActionListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /agents/commands:
    get:
      tags: [Agents]
      operationId: listAgentCommands
      summary: List persisted Agent command history
      parameters:
        - { name: agentId, in: query, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AgentCommandStatus" } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Agent command history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCommandListEnvelope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /agents/commands/{commandId}:
    parameters:
      - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Agents]
      operationId: getAgentCommand
      summary: Read one persisted Agent command result
      responses:
        "200": { description: Agent command result, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCommandEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents/security:
    get:
      tags: [Agents]
      operationId: getAgentSecurity
      summary: Read masked Agent key metadata without exposing the secret
      responses:
        "200":
          description: Masked Agent key state
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSecurityEnvelope" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/security/actions/rotate:
    post:
      tags: [Agents]
      operationId: rotateAgentKey
      summary: Rotate the Agent key and reveal the replacement exactly once
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRotateKeyInput" }
      responses:
        "200":
          description: One-time replacement key
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRotateKeyEnvelope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}/inventory:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: getAgentRuntimeInventory
      summary: Read the last typed DST installation, room, Shard, process, and capacity observation
      responses:
        "200": { description: Agent runtime inventory snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/AgentInventorySnapshotEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents/{agentId}/actions/upgrade:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    post:
      tags: [Agents, Jobs]
      operationId: upgradeAgent
      summary: Upgrade a compatible native Agent and wait for the expected version to reconnect
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpgradeInput" }
      responses:
        "202": { description: Agent upgrade Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /agents/{agentId}/inventory/actions/refresh:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    post:
      tags: [Agents, Jobs]
      operationId: refreshAgentRuntimeInventory
      summary: Request one read-only typed runtime inventory observation from a configured online Agent
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Inventory refresh Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /agents/{agentId}:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        "200": { description: Agent node, content: { application/json: { schema: { $ref: "#/components/schemas/AgentEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Agents]
      operationId: forgetAgent
      summary: Remove an offline Agent snapshot
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Offline Agent snapshot removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /agents/{agentId}/commands:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: listAgentCommandsForAgent
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AgentCommandStatus" } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Agent command history, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCommandListEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      tags: [Agents, Jobs]
      operationId: runAgentCommand
      summary: Run one fixed domain action on an online Agent
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCommandInput" }
      responses:
        "202": { description: Agent command Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /game-notifications:
    get:
      tags: [GameNotifications]
      operationId: listGameNotifications
      summary: List immutable game notification delivery history
      parameters:
        - { name: roomId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Game notification history ordered by creation time
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNotificationListEnvelope" }
    post:
      tags: [GameNotifications, Jobs]
      operationId: sendGameNotification
      summary: Broadcast once through a running Shard, preferring the Master; DST forwards to connected Shards
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNotificationInput" }
      responses:
        "202": { description: Game notification Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/maintenance-preview:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    get:
      tags: [GameNotifications]
      operationId: previewRoomMaintenance
      summary: Read the current game roster and notification policy on demand
      description: Queries applied runtime placements in parallel with a six-second total deadline. No stored online count is used. Does not announce or change world state. An unavailable count is null, never zero.
      responses:
        "200":
          description: Current player count or an explicit unknown result, plus the saved notification policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [policy, onlinePlayers, checkedAt]
                    properties:
                      policy: { $ref: "#/components/schemas/GameNotificationPolicy" }
                      onlinePlayers: { type: [integer, "null"], minimum: 0 }
                      checkedAt: { type: string, format: date-time }
                      warning: { type: string }
                  error: { type: "null" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/game-notification-policy:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    get:
      tags: [GameNotifications]
      operationId: getGameNotificationPolicy
      summary: Get maintenance countdown notification policy
      responses:
        "200":
          description: Room game notification policy
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameNotificationPolicyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [GameNotifications]
      operationId: updateGameNotificationPolicy
      summary: Update maintenance countdown notification policy
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameNotificationPolicyInput" }
      responses:
        "200": { description: Policy updated, content: { application/json: { schema: { $ref: "#/components/schemas/GameNotificationPolicyEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /containers:
    get:
      tags: [Containers]
      operationId: listContainers
      summary: List managed or clearly DST-owned Docker containers
      responses:
        "200": { description: Docker capability and containers, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerListEnvelope" } } } }
  /containers/{containerId}/actions/{action}:
    parameters:
      - { $ref: "#/components/parameters/ContainerID" }
      - { name: action, in: path, required: true, schema: { $ref: "#/components/schemas/ContainerAction" } }
    post:
      tags: [Containers, Jobs]
      operationId: runContainerAction
      summary: Run a fixed lifecycle action on a managed DST container
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerActionInput" } } } }
      responses:
        "202": { description: Container Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dst_admin_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique operation key. Reusing it with the same request replays the original response; reusing it with different JSON content returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    RoomID:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    WorldID:
      name: worldId
      in: path
      required: true
      schema:
        type: string
    RecoveryName:
      name: recoveryName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10,20}-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    CommandRunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandID:
      name: commandId
      in: path
      required: true
      schema:
        type: string
    BackupID:
      name: backupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameReleaseID:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModID:
      name: modId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{1,20}$'
    ModPublicationID:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayerID:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
    StructuredLogRuleID:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentID:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    KubernetesProviderID:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ContainerID:
      name: containerId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{12,64}$' }
  responses:
    BadRequest:
      description: The request body or resource identifier is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: A valid administrator session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with current setup state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: The request is valid JSON but violates a domain constraint
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required local path or runtime dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GatewayTimeout:
      description: A runtime probe did not publish a fresh snapshot before its deadline
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadGateway:
      description: An upstream service returned an invalid response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    EntityCapability:
      type: string
      enum: [give, spawn, remove]
    CatalogEntity:
      type: object
      additionalProperties: false
      required: [key, namespace, id, nameZhCN, nameEn, type, capabilities, common, source]
      properties:
        key: { type: string }
        namespace: { type: string }
        id: { type: string, pattern: '^[A-Za-z0-9_]+$' }
        nameZhCN: { type: string }
        nameEn: { type: string }
        type: { type: string }
        artworkUrl: { type: string, format: uri }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/EntityCapability" }
        common: { type: boolean }
        source: { type: string, enum: [builtin, beacon] }
    EntityCatalogSearchResult:
      type: object
      additionalProperties: false
      required: [items, query, source, remoteAvailable]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogEntity" }
        query: { type: string }
        source: { type: string, enum: [builtin, beacon] }
        remoteAvailable: { type: boolean }
        releaseId: { type: string }
    EntityCatalogEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/EntityCatalogSearchResult" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
    ErrorEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          type: "null"
        error:
          $ref: "#/components/schemas/APIError"
        meta:
          $ref: "#/components/schemas/Meta"
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
    SetupCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 6
          maxLength: 72
    Admin:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string
    SessionState:
      type: object
      required: [authenticated, setupRequired, preferences]
      properties:
        authenticated:
          type: boolean
        setupRequired:
          type: boolean
        onboarding:
          $ref: "#/components/schemas/InitialSetupProgress"
        passwordPolicy:
          type: object
          description: Present before administrator creation; no credentials are included.
          properties:
            minimumLength: { type: integer, minimum: 6, maximum: 20 }
            maximumBytes: { type: integer, const: 72 }
            requireComplexity: { type: boolean }
        user:
          $ref: "#/components/schemas/Admin"
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
        passwordChanged:
          type: boolean
        preferences:
          $ref: "#/components/schemas/UIPreferences"
    InitialSetupProgress:
      type: object
      required: [required, step]
      properties:
        required: { type: boolean }
        step:
          type: string
          enum: ["", deployment, environment, game, room, review, complete]
    UIPreferences:
      type: object
      additionalProperties: false
      required: [systemName, timezone, dateFormat, themeColor]
      properties:
        systemName: { type: string, minLength: 1, maxLength: 256 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        dateFormat:
          type: string
          enum: [YYYY-MM-DD, MM/DD/YYYY, DD/MM/YYYY, YYYY年MM月DD日]
        themeColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$'
    SessionEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/SessionState"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    ToolCapability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        path:
          type: string
        kind:
          type: string
        source:
          type: string
        version:
          type: string
        diagnostic:
          type: string
    PathCapability:
      type: object
      required: [configured, exists, writable]
      properties:
        configured:
          type: boolean
        exists:
          type: boolean
        writable:
          type: boolean
        value:
          type: string
    Capabilities:
      type: object
      required: [platform, arch, tools, paths, features]
      properties:
        platform:
          type: string
        arch:
          type: string
        tools:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ToolCapability"
        paths:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PathCapability"
        features:
          type: object
          additionalProperties:
            type: boolean
    CapabilitiesEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Capabilities"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    CheckStatus:
      type: string
      enum: [pass, warning, fail]
    SetupCheck:
      type: object
      additionalProperties: false
      required: [id, label, status, required, summary]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          $ref: "#/components/schemas/CheckStatus"
        required:
          type: boolean
        summary:
          type: string
        remediation:
          type: string
        details:
          type: object
          additionalProperties: true
    Readiness:
      type: object
      additionalProperties: false
      required: [ready, checks, onboarding]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SetupCheck"
        onboarding:
          $ref: "#/components/schemas/OnboardingStatus"
    OnboardingStatus:
      type: object
      additionalProperties: false
      required: [firstStartCompleted]
      properties:
        firstStartCompleted:
          type: boolean
        completedAt:
          type: string
          format: date-time
    ReadinessEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Readiness"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    Room:
      type: object
      additionalProperties: false
      required:
        - id
        - directoryName
        - name
        - description
        - gameMode
        - maxPlayers
        - pvp
        - passwordProtected
        - managed
        - controlState
        - controlAvailable
        - worldCount
        - targetIds
        - availableTargetIds
        - updatedAt
      properties:
        id:
          type: string
          description: Canonical opaque ID derived from the safe directory component
        directoryName:
          type: string
        name:
          type: string
        description:
          type: string
        gameMode:
          type: string
        maxPlayers:
          type: integer
        pvp:
          type: boolean
        passwordProtected:
          type: boolean
        managed:
          type: boolean
          deprecated: true
          description: Compatibility field; discovered rooms are registered automatically
        controlState:
          type: string
          enum: [ready, degraded, offline, unavailable]
        controlAvailable:
          type: boolean
        worldCount:
          type: integer
        targetIds:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Runtime targets where this logical room was discovered
        availableTargetIds:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Online targets with a fresh inventory for this room
        updatedAt:
          type: string
          format: date-time
    CreateRoomInput:
      type: object
      additionalProperties: false
      required: [directoryName, name, gameMode, maxPlayers, includeCaves]
      properties:
        directoryName:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 512
          default: ""
        gameMode:
          type: string
          enum: [survival, endless, wilderness]
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 64
        pvp:
          type: boolean
          default: false
        password:
          type: string
          maxLength: 64
          writeOnly: true
        clusterToken:
          type: string
          maxLength: 4096
          writeOnly: true
        includeCaves:
          type: boolean
    RoomActionInput:
      type: object
      additionalProperties: false
      properties:
        immediate:
          type: boolean
          default: false
          description: Explicitly skip notification and countdown for this stop or restart only. Does not change room policy.
        worldIds:
          type: array
          uniqueItems: true
          items:
            type: string
        allowCapacityRisk:
          type: boolean
          default: false
        runtimeMode:
          $ref: "#/components/schemas/RuntimePerformanceMode"
          description: Process-scoped Lua runtime for start and restart actions. Defaults to game.
        runtimeVersion:
          type: string
          pattern: '^(game|[0-9]+\.[0-9]+\.[0-9]+)$'
          description: Exact LuaJIT package version shown to the user. Omit for legacy clients or use game with the game runtime.
    BatchRoomActionSelection:
      type: object
      additionalProperties: false
      required: [roomId]
      properties:
        roomId:
          type: string
        worldIds:
          type: array
          uniqueItems: true
          items:
            type: string
        allowCapacityRisk:
          type: boolean
          default: false
        runtimeMode:
          $ref: "#/components/schemas/RuntimePerformanceMode"
          description: Process-scoped Lua runtime for this room selection. Defaults to game.
        runtimeVersion:
          type: string
          pattern: '^(game|[0-9]+\.[0-9]+\.[0-9]+)$'
          description: Exact LuaJIT package version shown to the user.
    BatchRoomActionInput:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BatchRoomActionSelection"
        allowCapacityRisk:
          type: boolean
          default: false
    RoomEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Room"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    RoomList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        total:
          type: integer
    RoomListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/RoomList"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    RecoveryItem:
      type: object
      additionalProperties: false
      required: [recoveryName, directoryName, displayName, deletedAt, updatedAt]
      properties:
        recoveryName: { type: string }
        directoryName: { type: string }
        displayName: { type: string }
        deletedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecoveryList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecoveryItem" }
        total: { type: integer }
    RecoveryListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/RecoveryList" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    PurgeRecoveryInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must exactly equal recoveryName
    World:
      type: object
      additionalProperties: false
      required:
        - id
        - roomId
        - directoryName
        - name
        - role
        - type
        - isMaster
        - shardId
        - serverPort
        - targetIds
        - availableTargetIds
        - updatedAt
        - status
        - controlAvailable
      properties:
        id:
          type: string
        roomId:
          type: string
        directoryName:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [master, caves, custom]
        type:
          type: string
          enum: [forest, cave, unknown]
        isMaster:
          type: boolean
        shardId:
          type: integer
        serverPort:
          type: integer
        targetIds:
          type: array
          uniqueItems: true
          items: { type: string }
        availableTargetIds:
          type: array
          uniqueItems: true
          items: { type: string }
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [running, stopped, unknown]
        controlAvailable:
          type: boolean
        statusMessage:
          type: string
        statusCode:
          type: string
        paused:
          type: boolean
          description: Latest simulation pause observation from the current running process log. Omitted when unknown; does not change lifecycle status.
    WorldRecord:
      type: object
      additionalProperties: false
      required: [id, roomId, directoryName, name, role, type, isMaster, shardId, serverPort, targetIds, availableTargetIds, updatedAt]
      properties:
        id: { type: string }
        roomId: { type: string }
        directoryName: { type: string }
        name: { type: string }
        role: { type: string, enum: [master, caves, custom] }
        type: { type: string, enum: [forest, cave, unknown] }
        isMaster: { type: boolean }
        shardId: { type: integer }
        serverPort: { type: integer }
        targetIds: { type: array, uniqueItems: true, items: { type: string } }
        availableTargetIds: { type: array, uniqueItems: true, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    CreateWorldInput:
      type: object
      additionalProperties: false
      required: [directoryName, type]
      properties:
        directoryName:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        type:
          type: string
          enum: [forest, cave]
    DeleteRoomInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must exactly equal the room name
    DeleteRoomResult:
      type: object
      additionalProperties: false
      required: [room, recoveryName]
      properties:
        room:
          $ref: "#/components/schemas/Room"
        recoveryName:
          type: string
          description: Relative path below the configured save root
    DeleteRoomResultEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/DeleteRoomResult"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    DeleteWorldInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must exactly equal the room name
    DeleteWorldResult:
      type: object
      additionalProperties: false
      required: [world, recoveryName]
      properties:
        world:
          $ref: "#/components/schemas/WorldRecord"
        recoveryName:
          type: string
          description: Relative path below the room directory
    WorldRecordEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/WorldRecord"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    DeleteWorldResultEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/DeleteWorldResult"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    WorldList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/World"
        total:
          type: integer
    WorldListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/WorldList"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    SaveImportStatus:
      type: string
      enum: [uploaded, analyzing, ready, invalid, applying, applied]
    SaveImportSeverity:
      type: string
      enum: [info, warning, error]
    SaveImportDiagnostic:
      type: object
      additionalProperties: false
      required: [code, severity, message, autoFix]
      properties:
        code: { type: string }
        severity: { $ref: "#/components/schemas/SaveImportSeverity" }
        message: { type: string }
        path: { type: string }
        autoFix: { type: boolean }
        details:
          type: object
          additionalProperties: true
    SaveImportPorts:
      type: object
      additionalProperties: false
      required: [server, authentication, masterServer]
      properties:
        server: { type: integer, minimum: 0, maximum: 65535 }
        authentication: { type: integer, minimum: 0, maximum: 65535 }
        masterServer: { type: integer, minimum: 0, maximum: 65535 }
    SaveImportWorld:
      type: object
      additionalProperties: false
      required: [directoryName, name, role, isMaster, shardId, ports, sessionCount, modFile, serverFile]
      properties:
        directoryName: { type: string }
        name: { type: string }
        role: { type: string, enum: [master, caves, custom] }
        isMaster: { type: boolean }
        shardId: { type: integer }
        ports: { $ref: "#/components/schemas/SaveImportPorts" }
        sessionCount: { type: integer, minimum: 0 }
        modFile: { type: boolean }
        serverFile: { type: string }
    SaveImportMod:
      type: object
      additionalProperties: false
      required: [id, worlds, downloaded]
      properties:
        id: { type: string, pattern: '^[0-9]+$' }
        worlds:
          type: array
          items: { type: string }
        downloaded: { type: boolean }
    SaveImportCandidate:
      type: object
      additionalProperties: false
      required: [id, root, directoryName, name, description, gameMode, maxPlayers, pvp, tokenPresent, worlds, mods, compatibility, diagnostics, ignoredSystemFiles]
      properties:
        id: { type: string }
        root: { type: string }
        directoryName: { type: string }
        name: { type: string }
        description: { type: string }
        gameMode: { type: string }
        maxPlayers: { type: integer, minimum: 0 }
        pvp: { type: boolean }
        tokenPresent: { type: boolean }
        worlds:
          type: array
          items: { $ref: "#/components/schemas/SaveImportWorld" }
        mods:
          type: array
          items: { $ref: "#/components/schemas/SaveImportMod" }
        compatibility: { type: string, enum: [ready, needs_attention, blocked] }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/SaveImportDiagnostic" }
        ignoredSystemFiles: { type: integer, minimum: 0 }
    SaveImportManifest:
      type: object
      additionalProperties: false
      required: [schemaVersion, format, sourceName, compressedSize, contentSize, fileCount, sha256, normalizedPaths, ignoredSystemFiles, candidates, diagnostics, analyzedAt]
      properties:
        schemaVersion: { type: string }
        format: { type: string, enum: [zip, tar, tar.gz] }
        sourceName: { type: string }
        compressedSize: { type: integer, format: int64, minimum: 0 }
        contentSize: { type: integer, format: int64, minimum: 0 }
        fileCount: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        normalizedPaths: { type: integer, minimum: 0 }
        ignoredSystemFiles: { type: integer, minimum: 0 }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/SaveImportCandidate" }
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/SaveImportDiagnostic" }
        analyzedAt: { type: string, format: date-time }
    SaveImport:
      type: object
      additionalProperties: false
      required: [id, name, sourceName, status, size, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sourceName: { type: string }
        status: { $ref: "#/components/schemas/SaveImportStatus" }
        size: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        errorCode: { type: string }
        errorMessage: { type: string }
        manifest: { $ref: "#/components/schemas/SaveImportManifest" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        appliedAt: { type: string, format: date-time }
    SaveImportList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SaveImport" }
        total: { type: integer, minimum: 0 }
    SaveImportUploadResult:
      type: object
      additionalProperties: false
      required: [import, job]
      properties:
        import: { $ref: "#/components/schemas/SaveImport" }
        job: { $ref: "#/components/schemas/Job" }
    SaveImportApplyInput:
      type: object
      additionalProperties: false
      required: [candidateId, mode, tokenPolicy, networkPolicy, modPolicy, allowPartial, allowMissingToken]
      properties:
        candidateId: { type: string }
