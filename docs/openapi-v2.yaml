        source: { type: string, enum: [api, ai, automation, game_update, system_monitor, external] }
        previousState: { type: string, enum: [stopped, starting, running, failed, unknown] }
        runtimeState: { type: string, enum: [stopped, starting, running, failed, unknown] }
        reasonCode: { type: string }
        message: { type: string }
        jobId: { type: string }
        requestId: { type: string }
        expectedExit: { type: boolean }
        expectedObserved: { type: boolean }
        occurredAt: { type: string, format: date-time }
    ShardRuntimeEventList:
      type: object
      additionalProperties: false
