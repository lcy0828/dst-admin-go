        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    AutomationTask:
      type: object
      additionalProperties: false
      required: [id, roomId, groupId, groupName, name, description, enabled, schedule, timezone, action, worldIds, parameters, timeoutSeconds, retryTimes, retryIntervalSeconds, dependencies, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        schedule: { type: string }
        timezone: { type: string }
        action: { $ref: "#/components/schemas/AutomationAction" }
        worldIds: { type: array, items: { type: string } }
        parameters: { type: object, additionalProperties: true }
        timeoutSeconds: { type: integer, minimum: 5, maximum: 3600 }
        retryTimes: { type: integer, minimum: 0, maximum: 10 }
        retryIntervalSeconds: { type: integer, minimum: 1, maximum: 3600 }
        dependencies: { type: array, maxItems: 64, items: { type: string, format: uuid } }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        lastStatus: { $ref: "#/components/schemas/AutomationRunStatus" }
        lastJobId: { type: string, format: uuid }
        revision: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AutomationTaskInput:
      type: object
      additionalProperties: false
      allOf:
        - if: { properties: { action: { enum: [room.start, room.restart] } }, required: [action] }
          then: { properties: { parameters: { $ref: "#/components/schemas/AutomationRuntimeModeParameters" } } }
        - if: { properties: { action: { const: backup.create } }, required: [action] }
          then: { properties: { parameters: { $ref: "#/components/schemas/AutomaticBackupParameters" } } }
        - if: { properties: { action: { const: backup.prune } }, required: [action] }
          then:
            properties:
              parameters:
                allOf:
                  - { $ref: "#/components/schemas/AutomaticBackupParameters" }
                  - { required: [keep] }
        - if: { properties: { action: { const: command.execute } }, required: [action] }
          then: { properties: { parameters: { $ref: "#/components/schemas/AutomationCommandParameters" } } }
      required: [groupId, name, description, enabled, schedule, timezone, action, worldIds, parameters, timeoutSeconds, retryTimes, retryIntervalSeconds, dependencies, expectedRevision]
      properties:
        groupId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        enabled: { type: boolean }
        schedule: { type: string, maxLength: 128 }
        timezone: { type: string, maxLength: 64 }
        action: { $ref: "#/components/schemas/AutomationAction" }
        worldIds: { type: array, maxItems: 64, items: { type: string } }
        parameters: { type: object, additionalProperties: true }
        timeoutSeconds: { type: integer, minimum: 5, maximum: 3600 }
        retryTimes: { type: integer, minimum: 0, maximum: 10 }
        retryIntervalSeconds: { type: integer, minimum: 1, maximum: 3600 }
        dependencies: { type: array, maxItems: 64, items: { type: string, format: uuid } }
        expectedRevision: { type: string }
    AutomationRuntimeModeParameters:
      type: object
      additionalProperties: false
      description: Omit runtimeMode to preserve each world's running or remembered mode. Explicit modes are revalidated at execution. Package versions are not pinned by scheduled actions.
      properties:
        runtimeMode: { $ref: "#/components/schemas/RuntimePerformanceMode" }
    AutomaticBackupParameters:
      type: object
      description: Backup settings. Omit keep to disable automatic cleanup; name is an optional archive label. Only successful automatic snapshots are pruned.
      additionalProperties: true
      properties:
        keep: { type: integer, minimum: 1, maximum: 100 }
        name: { type: string, maxLength: 80 }
    AutomationCommandParameters:
      type: object
      additionalProperties: true
      description: Existing command template or custom server Lua; not a host shell command.
      properties:
        commandId: { type: string, minLength: 1 }
        rawCommand: { type: string, minLength: 1, maxLength: 4096 }
        arguments: { type: object, additionalProperties: true }
      oneOf:
        - required: [commandId]
          not: { required: [rawCommand] }
        - required: [rawCommand]
          not: { required: [commandId] }
