openapi: 3.1.0
info:
  title: DST Admin API
  version: 2.0.0-alpha.1
  description: >-
    Contract for the authenticated DST Admin management API. JSON fields use
    camelCase. Authenticated state-changing requests require X-CSRF-Token and
    Idempotency-Key headers. Fleet views select a machine with explicit targetId
    query or targetIds body fields; room and world operations resolve their runtime
    target from persisted Placement. X-DST-Runtime-Target remains a legacy fail-closed
    guard for older clients and does not route requests to an Agent.
servers:
  - url: /api/v2
tags:
  - name: Auth
  - name: System
  - name: Rooms
  - name: Logs
  - name: Console
  - name: Backups
  - name: Game
  - name: Maps
  - name: Configuration
  - name: Mods
  - name: Players
  - name: Runtime
  - name: Runtime Audit
  - name: WorldState
  - name: Automation
  - name: Agents
  - name: Kubernetes
  - name: Topology
  - name: GameNotifications
  - name: Containers
  - name: Jobs
  - name: Save Imports
  - name: Entity Catalog
paths:
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      security: []
      summary: Inspect setup and session state
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
  /auth/setup:
    post:
      tags: [Auth]
      operationId: setupAdmin
      security: []
      summary: Create the single administrator on first run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCredentials"
      responses:
        "201":
          description: Administrator and session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Create an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Login attempts are temporarily rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                region:
                  type: string
                  enum: [cn, global]
                  default: global
                  description: Use fixed mainland-China providers for cn and international providers for global
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change the administrator password and revoke every session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  maxLength: 72
                newPassword:
                  type: string
                  minLength: 6
                  maxLength: 72
      responses:
        "200":
          description: Password changed; the client must log in again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/onboarding:
    put:
      tags: [Auth]
      operationId: saveInitialSetupProgress
      summary: Save administrator setup progress without changing game or save data
      description: Existing administrators are not enrolled during migration. Completing the wizard records UI progress only and does not certify game readiness. Delayed progress writes cannot reopen a completed wizard.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step:
                  type: string
                  enum: [deployment, environment, game, room, review, complete]
      responses:
        "200":
          description: Persisted setup progress
          content:
            application/json:
              schema:
                type: object
                required: [data, error, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/InitialSetupProgress"
                  error:
                    type: "null"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /system/capabilities:
    get:
      tags: [System]
      operationId: getSystemCapabilities
      summary: Detect platform, tools, paths, and available management features
      responses:
        "200":
          description: Runtime capability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/setup-checks:
    get:
      tags: [System]
      operationId: getSetupChecks
      summary: Re-run deployment and room discovery checks
      responses:
        "200":
          description: Current deployment readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Read host, CPU, memory, disk, process, and Go runtime metrics
      responses:
        "200": { description: Current system status, content: { application/json: { schema: { $ref: "#/components/schemas/SystemStatusEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /system/resources:
    get:
      tags: [System, Agents]
      operationId: getNodeResources
      summary: Read normalized resource metrics for the controller and remote Agents
      parameters:
        - name: targetId
          in: query
          required: false
          schema: { type: string, pattern: "^(local|agent:[A-Za-z0-9][A-Za-z0-9._-]{0,127})$" }
        - name: refresh
          in: query
          required: false
          description: Request a new report from online Agents in the selected scope. Collection failures retain the previous sample time and are returned as per-node warnings.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Normalized node resource snapshots, content: { application/json: { schema: { $ref: "#/components/schemas/NodeResourceSnapshotEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /system/settings:
    get:
      tags: [System]
      operationId: getSystemSettings
      summary: Read effective editable settings and their source without revealing secrets
      responses:
        "200":
          description: Current settings
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsEnvelope" } } }
  /system/settings/preview:
    post:
      tags: [System]
      operationId: previewSystemSettings
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsInput" } } } }
      responses:
        "200":
          description: Validated settings diff
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsPreviewEnvelope" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /system/settings/actions/apply:
    post:
      tags: [System]
      operationId: applySystemSettings
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsInput" } } } }
      responses:
        "200":
          description: Applied settings and restart state
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsApplyEnvelope" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /system/settings/actions/test-email:
    post:
      tags: [System]
      operationId: testSystemSMTPConnection
      summary: Establish a real SMTP connection, negotiate TLS, and authenticate when configured
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPTestInput"
      responses:
        "200":
          description: SMTP connection and optional authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPTestResultEnvelope"
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      summary: Discover DST rooms from the configured save root
      responses:
        "200":
          description: Discovered rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Atomically create and adopt a DST room
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInput"
      responses:
        "201":
          description: Room created and registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/actions/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [start, stop, restart]
    post:
      tags: [Rooms, Jobs]
      operationId: runBatchRoomAction
      summary: Start, stop, or restart selected worlds across multiple rooms through one persistent job
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRoomActionInput"
      responses:
        "202":
          description: Batch operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Read a discovered room
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Rooms]
      operationId: deleteRoom
      summary: Move a stopped room into the save-root recovery directory
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoomInput"
      responses:
        "200":
          description: Room moved to the recovery directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRoomResultEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/topology:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Topology]
      operationId: getRoomTopology
      summary: Read desired and applied Shard placement with whole-node capacity projections
      responses:
        "200":
          description: Planning-only room topology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [Topology]
      operationId: updateRoomTopology
      summary: Save desired placement without activating remote execution
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopologyUpdateInput" }
      responses:
        "200":
          description: Desired placement saved; applied placement remains unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/topology/preview:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Topology]
      operationId: previewRoomTopology
      summary: Preview cross-room target capacity, stale inventory, missing Shards, and duplicate runtimes
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopologyUpdateInput" }
      responses:
        "200":
          description: Topology preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/topology/shard-links/actions/discover:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Topology]
      operationId: discoverRoomShardLinks
      summary: Probe every candidate Master UDP endpoint from each planned Secondary runtime machine
      description: Runs only on demand. The Master runtime target temporarily listens on the real Shard port while each Secondary target probes every reported, configured, detected, or manually supplied address. No DST log entry is written.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShardLinkDiscoveryInput" }
      responses:
        "200":
          description: Candidate endpoints and per-Secondary reachability results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShardLinkDiscoveryEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/topology/shard-links/actions/apply:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Topology]
      operationId: applyRoomShardLinks
      summary: Transactionally apply a route-only Shard topology change without restarting worlds
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShardLinkApplyInput" }
      responses:
        "200":
          description: Applied route topology and refreshed room topology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /rooms/{roomId}/topology/actions/apply:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Topology, Jobs]
      operationId: applyRoomTopologyPlacement
      summary: Move one stopped Shard to its desired target and atomically activate the placement
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementMigrationInput" }
      responses:
        "202":
          description: Placement migration job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/topology/actions/provision:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Topology, Jobs]
      operationId: provisionRoomTopology
      summary: Publish a stopped locally managed room configuration to every planned runtime target
      description: Uses a fixed configuration allowlist, chunk hashes, atomic target publication, and durable rollback markers. It does not expose arbitrary paths, file writes, or shell execution. Existing remote Shards must use placement migration instead.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomProvisionInput" }
      responses:
        "202":
          description: Room configuration provision job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/provision-operations:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Topology]
      operationId: listRoomProvisionOperations
      summary: List durable room configuration publication operations and per-Shard phases
      responses:
        "200":
          description: Room provision operations ordered newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomProvisionOperationListEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /provision-operations/{provisionOperationId}/actions/recover:
    parameters:
      - name: provisionOperationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Topology, Jobs]
      operationId: recoverRoomProvisionOperation
      summary: Resume a committed publication or roll back an operation interrupted before its durable commit decision
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Room provision recovery job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/backup-sets:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Backups]
      operationId: listDistributedBackupSets
      summary: List coordinated backup sets for every Shard in a room
      responses:
        "200":
          description: Coordinated backup sets ordered newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributedBackupSetListEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Backups, Jobs]
      operationId: createDistributedBackupSet
      summary: Create a verified cold-consistent or hot-consistent backup set for every Shard
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributedBackupSetCreateInput" }
      responses:
        "202":
          description: Coordinated backup job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /backup-sets/{backupSetId}:
    parameters:
      - name: backupSetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Backups]
      operationId: getDistributedBackupSet
      summary: Inspect a coordinated backup set and every verified Shard part
      responses:
        "200":
          description: Coordinated backup set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributedBackupSetEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /backup-sets/{backupSetId}/actions/restore:
    parameters:
      - name: backupSetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Backups, Jobs]
      operationId: restoreDistributedBackupSet
      summary: Create a protection set, then restore and publish every Shard atomically
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributedBackupSetRestoreInput" }
      responses:
        "202":
          description: Coordinated restore job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/backup-operations:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Backups]
      operationId: listDistributedBackupOperations
      summary: List durable create and restore operations, including recovery-required state
      responses:
        "200":
          description: Backup operations ordered by most recent update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributedBackupOperationListEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /backup-operations/{backupOperationId}/actions/recover:
    parameters:
      - name: backupOperationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Backups, Jobs]
      operationId: recoverDistributedBackupOperation
      summary: Idempotently resume or roll back a recovery-required backup operation
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Backup recovery job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /runtime-infrastructure:
    get:
      tags: [Topology, Runtime]
      operationId: getRuntimeInfrastructure
      summary: Inspect Runtime providers, execution environments, network scopes, port reservations, and CPU allocations
      responses:
        "200": { description: Current Runtime infrastructure snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeInfrastructureEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /runtime-overview:
    get:
      tags: [Topology, Runtime]
      operationId: getFleetRuntimeOverview
      summary: Read current managed rooms and their applied Runtime placements from the fleet or one target
      parameters:
        - name: targetId
          in: query
          required: false
          schema: { type: string }
          description: Runtime target ID. Omit to return the complete fleet.
        - name: detail
          in: query
          required: false
          schema: { type: string, enum: [full, inventory], default: full }
          description: Inventory reads current process state once per machine without per-world log and health probes. Intended for running counts; full includes detailed world status.
      responses:
        "200":
          description: Fleet Runtime overview projected to the requested management scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetRuntimeOverviewEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /runtime-observations/stream:
    get:
      tags: [Topology, Runtime]
      operationId: streamRuntimeObservations
      summary: Keep the selected Runtime targets actively observed while the page is visible
      parameters:
        - name: targetId
          in: query
          required: false
          schema: { type: string }
        - name: roomId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Server-sent observation snapshots, refresh transitions, inventory updates, and errors. observation.refreshed updates timestamps and observation status without requiring another overview fetch; inventory.updated is emitted only when content or availability changes. topology.changed also notifies views after explicit runtime operations, which can change readiness or files without changing process identities.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
