        meta: { $ref: "#/components/schemas/Meta" }
    AIConfigInput:
      type: object
      required: [revision, enabled, endpoint, model]
      properties:
        revision: { type: string, description: Revision from GET /system/ai; stale saves return 409 }
        enabled: { type: boolean, default: false }
        endpoint: { type: string, maxLength: 2048, description: Trusted administrator-selected HTTP(S) Chat Completions endpoint; empty permits MCP-only use }
        model: { type: string, maxLength: 200 }
        apiKey: { type: string, maxLength: 2048, writeOnly: true, description: Blank preserves the saved credential }
        clearKey: { type: boolean, default: false }
        limits:
          $ref: "#/components/schemas/AIChatLimits"
          description: Omit to preserve saved limits. Saved changes apply to subsequent browser chat requests, not externally managed MCP client loops.
    AIChatLimits:
      type: object
      description: Browser chat limits; 0 disables the corresponding limit. Omitted fields in a supplied object use defaults. A tool-free summary may follow the tool phase, within the configured turn timeout.
      properties:
        maxRounds: { type: integer, minimum: 0, default: 8 }
        maxToolCalls: { type: integer, minimum: 0, default: 12 }
        timeoutSeconds: { type: integer, minimum: 0, maximum: 9223372036, default: 150 }
    PlayerResolutionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, match, coverage, total, offset, hasMore, items, normalizationVersion]
          properties:
            status: { type: string, enum: [resolved, ambiguous, not_found, unavailable] }
            match: { type: string, enum: [exact_id, exact_name, normalized_name, substring, ""] }
            coverage: { type: string, enum: [current_directory, directory_limit] }
            total: { type: integer }
            offset: { type: integer }
            hasMore: { type: boolean }
            normalizationVersion: { type: integer }
            items: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/Player" } }
    AITokenInput:
      type: object
      required: [name, days]
      properties:
        profile: { type: string, enum: [game-read, game-manage, panel-manage], default: panel-manage, description: Executable server capability preset. Existing tokens retain panel-manage compatibility. }
        roomIds: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 255 }, description: Required nonempty for game profiles. Empty grants all rooms only with panel-manage. }
        name: { type: string, minLength: 1, maxLength: 100 }
        days: { type: integer, minimum: 1, maximum: 365 }
    AIChatInput:
      type: object
      required: [messages]
      properties:
        callIds: { type: array, maxItems: 16, items: { type: string, maxLength: 64 }, description: Rehydrate real receipts owned by the page assistant in the selected scope }
        roomId: { type: string, maxLength: 255, description: Selected room context, not an authorization boundary. Empty means all rooms. Explicit requests may select another room. }
        locale: { type: string, enum: [zh-CN, en-US], default: zh-CN }
        messages:
          type: array
          minItems: 1
          maxItems: 16
          description: User and assistant text only, last message must be user; each message at most 8192 UTF-8 bytes and total 48 KiB
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, maxLength: 8192 }
              files: { type: array, maxItems: 8, items: { type: string, format: uuid }, description: Caller-owned uploaded file references; user messages only }
              privateInputs: { type: array, maxItems: 8, items: { type: string, format: uuid }, description: Caller-owned encrypted inputs; the model receives references only }
