  /bot/gateway:
    post:
      tags: [AI]
      operationId: invokeCompanionGateway
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      summary: 可信插件通用调用
      description: 仅持有完整服务凭据的可信插件可用。actor 必须由平台适配器构造，不能作为模型参数。此身份委托传输不向 MCP 或面板模型开放；业务接口沿用原契约和鉴权。先协商 companion-gateway-v1。请求上限 64 KiB，每连接同时最多两个任务，不自动重发修改。
