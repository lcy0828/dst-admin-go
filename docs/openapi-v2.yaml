        id: { type: string, format: uuid }
        revision: { type: string }
        name: { type: string }
        type: { type: string, enum: [email, webhook] }
        enabled: { type: boolean }
        events: { type: array, items: { $ref: "#/components/schemas/NotificationEventKind" } }
        failuresOnly: { type: boolean }
        recipients: { type: array, nullable: true, items: { type: string, format: email } }
        method: { type: string }
        format: { type: string }
        template: { type: string }
        responseMode: { type: string }
        urlConfigured: { type: boolean }
        headersConfigured: { type: boolean }
        updatedAt: { type: string, format: date-time }
