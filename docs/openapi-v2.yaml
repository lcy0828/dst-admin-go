        version:
          type: string
        bootId:
          type: string
        message:
          type: string
        stack:
          type: string
        requestId:
          type: string
        jobId:
          type: string
        operationId:
          type: string
        roomId:
          type: string
        worldId:
          type: string
        code:
          type: string
        method:
          type: string
        path:
          type: string
        time:
          type: string
          format: date-time
        level:
