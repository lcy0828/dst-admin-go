      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationDocument" } } } }
      responses:
        "200": { description: Import validation and digest, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationImportPreviewEnvelope" } } } }
  /rooms/{roomId}/automation/imports:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    post:
      tags: [Automation]
      operationId: importAutomation
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationImportInput" } } } }
      responses:
        "200": { description: Imported group and task counts, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationImportResultEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/structured-logs/actions/refresh:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    post:
      tags: [Logs, Jobs]
      operationId: refreshStructuredLogs
      summary: Parse bounded current log snapshots for every room shard
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Structured log refresh job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/structured-logs/actions/clear:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    post:
      tags: [Logs]
      operationId: clearStructuredLogs
      summary: Delete one world's derived structured-log snapshot and refresh cursor
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogClearInput" } } } }
      responses:
        "200": { description: Derived snapshot cleared, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogClearResultEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/log-rules:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    get:
      tags: [Logs]
      operationId: listStructuredLogRules
      summary: List room-scoped structured log extraction rules
      responses:
        "200": { description: Extraction rules ordered by priority, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleListEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      tags: [Logs]
      operationId: createStructuredLogRule
      summary: Create a room-scoped extraction rule
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleInput" } } } }
      responses:
        "201": { description: Created extraction rule, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/log-rules/{ruleId}:
    parameters: [{ $ref: "#/components/parameters/RoomID" }, { $ref: "#/components/parameters/StructuredLogRuleID" }]
    put:
      tags: [Logs]
      operationId: updateStructuredLogRule
      summary: Replace a room-scoped extraction rule
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleInput" } } } }
      responses:
        "200": { description: Updated extraction rule, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Logs]
      operationId: deleteStructuredLogRule
      summary: Delete a custom extraction rule
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Custom extraction rule deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/log-rules/actions/test:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    post:
      tags: [Logs]
      operationId: testStructuredLogRule
      summary: Compile and test an extraction rule against a bounded text sample
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleTestInput" } } } }
      responses:
        "200": { description: Rule test result, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleTestEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/log-rules/migration-preview:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    get:
      tags: [Logs]
      operationId: previewLegacyStructuredLogRuleMigration
      summary: Preview an idempotent migration from legacy global log rules into one managed room
      responses:
        "200": { description: Legacy rule migration classification and counts, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleMigrationPreviewEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/log-rules/actions/migrate-legacy:
    parameters: [{ $ref: "#/components/parameters/RoomID" }]
    post:
      tags: [Logs]
      operationId: migrateLegacyStructuredLogRules
      summary: Import migration-ready legacy global log rules into one managed room
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Imported rule count and the applied preview, content: { application/json: { schema: { $ref: "#/components/schemas/StructuredLogRuleMigrationResultEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /runtime-targets:
    get:
      tags: [Agents]
      operationId: listRuntimeTargets
      summary: List the controller-local runtime first, followed by Agent-backed remote runtimes
      responses:
        "200":
          description: Local-first runtime target list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTargetListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /runtime-targets/agents/{agentId}:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: getAgentRuntimeTarget
      summary: Read one Agent and its isolated remote runtime configuration
      responses:
        "200": { description: Remote runtime target, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeTargetEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Agents]
      operationId: configureAgentRuntimeTarget
      summary: Save paths interpreted only on the selected Agent machine
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeConfigInput" }
      responses:
        "200": { description: Configured remote runtime target, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeTargetEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Agents]
      operationId: unconfigureAgentRuntimeTarget
      summary: Remove only the Agent runtime paths without forgetting the Agent
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Remote runtime configuration removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List persisted Agent snapshots and current connectivity
      responses:
        "200":
          description: Agent nodes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /agents/actions:
    get:
      tags: [Agents]
      operationId: listAgentActions
      summary: List the fixed domain action allowlist
      responses:
        "200":
          description: Allowed Agent actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentActionListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /agents/commands:
    get:
      tags: [Agents]
      operationId: listAgentCommands
      summary: List persisted Agent command history
      parameters:
        - { name: agentId, in: query, schema: { type: string, maxLength: 128 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AgentCommandStatus" } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Agent command history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCommandListEnvelope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /agents/commands/{commandId}:
    parameters:
      - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Agents]
      operationId: getAgentCommand
      summary: Read one persisted Agent command result
      responses:
        "200": { description: Agent command result, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCommandEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents/security:
    get:
      tags: [Agents]
      operationId: getAgentSecurity
      summary: Read masked Agent key metadata without exposing the secret
      responses:
        "200":
          description: Masked Agent key state
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSecurityEnvelope" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/security/actions/rotate:
    post:
      tags: [Agents]
      operationId: rotateAgentKey
      summary: Rotate the Agent key and reveal the replacement exactly once
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRotateKeyInput" }
      responses:
        "200":
          description: One-time replacement key
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRotateKeyEnvelope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        "200": { description: Agent node, content: { application/json: { schema: { $ref: "#/components/schemas/AgentEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Agents]
      operationId: forgetAgent
      summary: Remove an offline Agent snapshot
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Offline Agent snapshot removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /agents/{agentId}/commands:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: listAgentCommandsForAgent
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AgentCommandStatus" } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Agent command history, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCommandListEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      tags: [Agents, Jobs]
      operationId: runAgentCommand
      summary: Run one fixed domain action on an online Agent
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCommandInput" }
      responses:
        "202": { description: Agent command Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /announcements:
    get:
      tags: [Announcements]
      operationId: listAnnouncements
      summary: List persisted system announcements
      responses:
        "200":
          description: Announcements ordered by importance and publication time
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementListEnvelope" }
    post:
      tags: [Announcements]
      operationId: createAnnouncement
      summary: Publish a system announcement
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201": { description: Announcement created, content: { application/json: { schema: { $ref: "#/components/schemas/AnnouncementEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /announcements/{announcementId}:
    parameters: [{ $ref: "#/components/parameters/AnnouncementID" }]
    get:
      tags: [Announcements]
      operationId: getAnnouncement
      responses:
        "200":
          description: Persisted announcement
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Announcements]
      operationId: updateAnnouncement
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "200": { description: Announcement updated, content: { application/json: { schema: { $ref: "#/components/schemas/AnnouncementEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Announcements]
      operationId: deleteAnnouncement
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Announcement deleted, content: { application/json: { schema: { $ref: "#/components/schemas/AnnouncementDeleteEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /containers:
    get:
      tags: [Containers]
      operationId: listContainers
      summary: List managed or clearly DST-owned Docker containers
      responses:
        "200": { description: Docker capability and containers, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerListEnvelope" } } } }
  /containers/{containerId}/actions/{action}:
    parameters:
      - { $ref: "#/components/parameters/ContainerID" }
      - { name: action, in: path, required: true, schema: { $ref: "#/components/schemas/ContainerAction" } }
    post:
      tags: [Containers, Jobs]
      operationId: runContainerAction
      summary: Run a fixed lifecycle action on a managed DST container
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerActionInput" } } } }
      responses:
        "202": { description: Container Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dst_admin_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique operation key. Reusing it with the same request replays the original response; reusing it with different JSON content returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    RoomID:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    WorldID:
      name: worldId
      in: path
      required: true
      schema:
        type: string
    CommandRunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandID:
      name: commandId
      in: path
      required: true
      schema:
        type: string
    BackupID:
      name: backupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModID:
      name: modId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{1,20}$'
    PlayerID:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
    StructuredLogRuleID:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentID:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    AnnouncementID:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ContainerID:
      name: containerId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{12,64}$' }
  responses:
    Unauthorized:
      description: A valid administrator session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with current setup state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: The request is valid JSON but violates a domain constraint
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required local path or runtime dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
    ErrorEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          type: "null"
        error:
          $ref: "#/components/schemas/APIError"
        meta:
          $ref: "#/components/schemas/Meta"
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
    SetupCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 6
          maxLength: 72
    Admin:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string
    SessionState:
      type: object
      required: [authenticated, setupRequired]
      properties:
        authenticated:
          type: boolean
        setupRequired:
          type: boolean
        user:
          $ref: "#/components/schemas/Admin"
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
        passwordChanged:
          type: boolean
    SessionEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/SessionState"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    ToolCapability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        path:
          type: string
        kind:
          type: string
        source:
          type: string
        version:
          type: string
        diagnostic:
          type: string
    PathCapability:
      type: object
      required: [configured, exists, writable]
      properties:
        configured:
          type: boolean
        exists:
          type: boolean
        writable:
          type: boolean
        value:
          type: string
    Capabilities:
      type: object
      required: [platform, arch, tools, paths, features]
      properties:
        platform:
          type: string
        arch:
          type: string
        tools:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ToolCapability"
        paths:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PathCapability"
        features:
          type: object
          additionalProperties:
            type: boolean
    CapabilitiesEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Capabilities"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    CheckStatus:
      type: string
      enum: [pass, warning, fail]
    SetupCheck:
      type: object
      additionalProperties: false
      required: [id, label, status, required, summary]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          $ref: "#/components/schemas/CheckStatus"
        required:
          type: boolean
        summary:
          type: string
        remediation:
          type: string
        details:
          type: object
          additionalProperties: true
    Readiness:
      type: object
      additionalProperties: false
