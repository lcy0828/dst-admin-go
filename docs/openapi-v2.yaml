        resultNotes: "首次提交返回的 Job ID 同时是原 releaseId。用 getJob 和 getGameRelease 查看倒计时、备份、更新和恢复。nextAction=backup_decision 表示游戏尚未更新，需用户选择重试备份、跳过备份或取消并恢复；跳过需显式确认。"
