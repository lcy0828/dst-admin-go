openapi: 3.1.0
info:
  title: DST Admin API
  version: 2.0.0-alpha.1
  description: >-
    Contract for the authenticated DST Admin management API. JSON fields use
    camelCase. Use an administrator session cookie or an administrator API Bearer
    token created in AI settings. State-changing requests require Idempotency-Key;
    cookie authentication also requires X-CSRF-Token. Fleet views select a machine with explicit targetId
    query or targetIds body fields; room and world operations resolve their runtime
    target from persisted Placement. X-DST-Runtime-Target remains a legacy fail-closed
    guard for older clients and does not route requests to an Agent.
servers:
  - url: /api/v2
tags:
  - name: AI
  - name: Auth
  - name: System
  - name: Rooms
  - name: Logs
  - name: Console
  - name: Backups
  - name: Game
  - name: Maps
  - name: Configuration
  - name: Mods
  - name: Diagnostics
  - name: Players
  - name: Runtime
  - name: Runtime Audit
  - name: WorldState
  - name: Automation
  - name: Agents
  - name: Kubernetes
  - name: Topology
  - name: GameNotifications
  - name: Containers
  - name: Jobs
  - name: Save Imports
  - name: Entity Catalog
paths:
  /rooms/{roomId}/performance:
    get:
      tags: [WorldState, Runtime]
      operationId: getRoomPerformanceReport
      x-dst-access:
        profile: game-read
        category: performance
      x-dst-intent:
        purpose: "读取房间各世界的量化表现、CPU内存历史曲线和智能分析报表"
        actions: ["查询", "分析", "对比"]
        queries: ["查看这个房间每个分片最近一天的性能评分和CPU内存", "游戏为什么卡顿，性能报表有没有低分时段"]
        terms: ["性能", "评分", "报表", "历史曲线", "卡顿", "CPU", "内存"]
        resultNotes: "评分基于模拟与真实时钟，不是FPS。暂停休眠缺测不打分；不要把CPU高自动判成卡顿。AI用maxPoints=60。"
      x-dst-tool: { tags: [performance, report] }
      summary: Read world simulation scores, CPU and memory history with evidence-based findings
      description: >-
        Uses background-collected records, never game commands or inventory refresh. Score is simulated seconds divided by native monotonic real seconds and game time scale, capped at 100. It is not FPS. Paused, sleeping, stopped, missing clocks and discontinuous windows are not scored. CPU 100 percent means one logical core. Default range is 24 hours. For AI use maxPoints=60 and read worlds summaries first. Missing history is not zero performance. Aggregated memory and CPU peaks preserve extremes. Restart/session/placement boundaries remain separate. Findings describe correlations, not proof of a faulty mod. Path is an object containing the real roomId from listRooms; query contains optional worldId/from/to/maxPoints.
      parameters:
        - { $ref: "#/components/parameters/RoomID" }
        - { name: worldId, in: query, schema: { type: string }, description: Optional exact world ID returned by the room }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Inclusive RFC3339 range start, within configured aggregate retention }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Inclusive RFC3339 range end; defaults to now }
        - { name: maxPoints, in: query, schema: { type: integer, minimum: 30, maximum: 1200, default: 600 }, description: Total plotted rows across worlds; use 60 for concise AI results }
      responses:
        "200":
          description: Bounded series with explicit missing scores and per-world summaries
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/PerformanceReport" } } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/performance/settings:
    get:
      tags: [WorldState, Runtime]
      operationId: getRoomPerformanceSettings
      x-dst-access:
        profile: panel-manage
        category: performance
      x-dst-intent:
        purpose: "查询房间后台性能采样频率与明细汇总保留策略"
        actions: ["查询"]
        queries: ["性能报表采集开了吗", "性能指标多久采集一次，保存多少天"]
        terms: ["性能", "采集设置", "采样频率", "保留时间"]
        resultNotes: "使用返回的revision修改设置，后台采集不依赖浏览器。"
      summary: Read persistent background performance sampling and retention settings
      parameters: [{ $ref: "#/components/parameters/RoomID" }]
      responses:
        "200":
          description: Current settings and optimistic revision
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/PerformanceSettings" } } } } }
    put:
      tags: [WorldState, Runtime]
      operationId: updateRoomPerformanceSettings
      x-dst-access:
        profile: panel-manage
        category: performance
      x-dst-intent:
        purpose: "调整房间性能采集开关、采样频率和历史保留天数"
        actions: ["配置", "开启", "关闭"]
        queries: ["开启性能历史采集，每30秒采样", "将性能明细保存7天汇总保存90天"]
        terms: ["性能", "采集频率", "保留策略", "启用"]
        resultNotes: "无需重启游戏；必须携带当前revision，关闭不会删除已有记录。"
      x-dst-tool: { destructive: false, tags: [performance] }
      summary: Enable or adjust background performance sampling and bounded retention without restarting worlds
      description: Supply all settings with the revision returned by getRoomPerformanceSettings. Changes apply to subsequent samples; history is not fabricated or erased when disabled. Reducing retention expires old data through bounded background cleanup.
      parameters: [{ $ref: "#/components/parameters/RoomID" }, { $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceSettings" } } } }
      responses:
        "200":
          description: Applied settings with a new revision
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/PerformanceSettings" } } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms/{roomId}/notifications/events:
    get:
      tags: [Rooms]
      operationId: readRoomNotificationEvents
      x-dst-access:
        profile: game-read
        category: status
      x-dst-intent:
        purpose: "按授权房间续读季节、回档、重启、更新和备份通知，断线后继续同步"
        actions: ["查询", "订阅"]
        queries: ["接收房间通知", "断线后补读房间事件"]
        terms: ["回档", "季节变化", "更新提醒", "Boss击杀", "模组通知", "运行告警", "死亡复活"]
        resultNotes: "只返回当前授权范围内已记录的事实；结果未确认不等于成功，记录缺口不表示事件未发生。不会执行或重放游戏操作。 死亡和击杀依赖已启用的活动采集；Boss仅限已识别的玩家击杀，无法推断全部参与者。新事件类型以supportedKinds为准，未知类型局部降级。"
      summary: Read room notifications for seasons, maintenance, backups and updates using a durable cursor
      x-dst-tool: {readOnly: true, destructive: false, risk: low, tags: [notification, room]}
      description: Room read permission only. Returns this room's recorded facts, never system notifications or other rooms. tail=true with no after seeds a new subscription without replay. Persist nextCursor after durable processing; follow hasMore. No model or game command is executed. Unknown effects remain uncertain, and historyTruncated means coverage is incomplete.
      parameters:
        - {$ref: "#/components/parameters/RoomID"}
        - {name: after, in: query, schema: {type: string, maxLength: 1024}}
        - {name: kinds, in: query, schema: {type: string, maxLength: 512}}
        - {name: tail, in: query, schema: {type: boolean, default: false}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Authorized room notification page
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/NotificationFeed"}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /rooms/{roomId}/notifications/stream:
    get:
      tags: [Rooms]
      operationId: streamRoomNotifications
      x-dst-access:
        profile: game-read
        category: status
      x-dst-intent:
        purpose: "获取房间动态推送链接，插件订阅后直接播报，无须调用模型"
        actions: ["查询", "订阅"]
        queries: ["订阅房间事件推送", "持续接收重启和换季通知"]
        terms: ["推送", "事件流", "Boss击杀", "模组通知", "运行告警", "死亡复活"]
        resultNotes: "只返回当前授权范围内已记录的事实；结果未确认不等于成功，记录缺口不表示事件未发生。不会执行或重放游戏操作。 死亡和击杀依赖已启用的活动采集；Boss仅限已识别的玩家击杀，无法推断全部参与者。新事件类型以supportedKinds为准，未知类型局部降级。"
      summary: Subscribe to recorded room notifications without polling or invoking the model
      x-dst-tool: {readOnly: true, destructive: false, risk: low, tags: [notification, stream], runtime: any}
      description: Authenticated room-only SSE. notice.page frames contain NotificationFeed and use nextCursor as their SSE id. No cursor starts at the current tail. Persist each page with its delivery outbox before acknowledging the cursor. Heartbeats every 15 seconds; reconnect after one minute for renewed authorization. History gaps are explicit. MCP returns an authenticated resource link; a host subscription is required for proactive messages.
      parameters:
        - {$ref: "#/components/parameters/RoomID"}
        - {name: after, in: query, schema: {type: string, maxLength: 1024}}
        - {name: kinds, in: query, schema: {type: string, maxLength: 512}}
        - {name: Last-Event-ID, in: header, schema: {type: string, maxLength: 1024}}
      responses:
        "200":
          description: SSE notice.page and heartbeat comments
          content: {text/event-stream: {schema: {type: string}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /rooms/{roomId}/recent-events:
    get:
      tags: [Rooms]
      operationId: listRoomRecentEvents
      x-dst-access:
        profile: game-read
        category: status
      x-dst-intent:
        purpose: "查看房间最近发生的重启、回档观测、季节变化和更新记录"
        actions: ["查询"]
        queries: ["最近发生了什么", "刚才为什么重启", "回档到了多少天"]
        terms: ["最近动态", "回档记录", "重启记录", "季节变化", "Boss击杀", "模组通知", "运行告警", "死亡复活"]
        resultNotes: "只返回当前授权范围内已记录的事实；结果未确认不等于成功，记录缺口不表示事件未发生。不会执行或重放游戏操作。 死亡和击杀依赖已启用的活动采集；Boss仅限已识别的玩家击杀，无法推断全部参与者。新事件类型以supportedKinds为准，未知类型局部降级。"
      summary: See what recently happened in a room, including restarts, rollback observations, seasons and updates
      x-dst-tool: {readOnly: true, destructive: false, risk: low, tags: [notification, history]}
      description: Newest recorded facts first. These records may contain gaps and are not a complete game history. uncertain means the effect has not been confirmed, not success. Does not execute or repeat an operation.
      parameters:
        - {$ref: "#/components/parameters/RoomID"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
      responses:
        "200":
          description: Recent room records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/NotificationEvent"}}
                      retentionDays: {type: integer}
                      complete: {type: boolean, enum: [false]}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /system/notifications/events:
    get:
      tags: [System]
      operationId: readNotificationEvents
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-intent:
        purpose: "机器人按游标接收平台通知与面板Agent新版本事件，断线后继续补读"
        actions: ["接收", "补读", "查询"]
        queries: ["主动通知我面板有新版", "获取上次之后的平台通知，机器人断线后补读"]
        terms: ["主动通知", "机器人", "通知", "版本提醒", "游标", "补读"]
        resultNotes: "宿主定时调用并唤醒模型，普通MCP连接不会自动唤醒。处理后保存nextCursor；historyTruncated时重新核实当前版本，不自动安装。"
      x-dst-tool: { tags: [notification, software] }
      summary: Consume durable platform notifications using a stable cursor, including new software releases
      description: >-
        For robots without a webhook receiver. Events are recorded without requiring a notification channel. The host must schedule this MCP/API call and wake the model; an ordinary MCP request-response connection cannot wake it automatically. First call with no after; save nextCursor only after processing the page. Follow hasMore until caught up. Reuse the same kinds filter on every page. Resume after reconnect using the saved cursor; deduplicate by stable event id. historyTruncated indicates history expired (30 days or 10000 events); recheck current software status rather than assuming completeness. Delivery retries are separate from this event feed. A discovered update never initiates installation. No room path is required.
      parameters:
        - { name: after, in: query, schema: { type: string, maxLength: 1024 }, description: Opaque nextCursor returned by the previous call; not an offset or server path }
        - { name: kinds, in: query, schema: { type: string, maxLength: 512 }, description: Optional comma-separated event kinds; for software use software.available,agent.software.available }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Oldest unread events first; webhook credentials omitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [items, nextCursor, hasMore, historyTruncated, retentionDays]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/NotificationEvent" } }
                      nextCursor: { type: string }
                      hasMore: { type: boolean }
                      historyTruncated: { type: boolean }
                      retentionDays: { type: integer }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /system/ai/private-inputs:
    post:
      tags: [AI]
      operationId: createPrivateAIInput
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-transport: assistant
      summary: Store a private input for a management operation without disclosing its value to the model
      description: Encrypted caller-owned values expire after 24 hours. Supply the returned id as a message privateInputs reference; use the reference string in an API body. This input is not an approval step.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                value: { type: string, minLength: 1, maxLength: 8192, writeOnly: true }
      responses:
        "201":
          description: Private input reference, name and creation time; never plaintext
          content: { application/json: { schema: { type: object, properties: { data: { type: object, required: [id, name, createdAt], properties: { id: { type: string, format: uuid }, name: { type: string }, createdAt: { type: string, format: date-time } } } } } } }
  /system/ai/private-results/{resourceId}:
    get:
      tags: [AI]
      operationId: downloadPrivateAIResult
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-transport: assistant
      summary: Download a caller-owned private API result
      description: Values such as newly created API credentials are encrypted in temporary storage and excluded from model input and chat history. The authenticated administrator can download the original result for 24 hours.
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Original private JSON result, content: { application/json: { schema: { type: object } } } }
  /system/openapi:
    get:
      tags: [System]
      operationId: downloadManagementContract
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-transport: assistant
      summary: Download the exact OpenAPI contract used by management tools
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content: { application/yaml: { schema: { type: string } } }
  /system/ai/attachments:
    post:
      tags: [AI]
      operationId: uploadAIAttachment
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-transport: assistant
      summary: Stream a file into private temporary assistant storage
      description: Maximum 2 GiB per file and 4 GiB total. References expire after 24 hours and belong to the authenticated caller. File contents are never sent to the model. Pass the returned id as attachmentId to a management upload operation.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "201":
          description: Uploaded file metadata, not file contents
          content: { application/json: { schema: { $ref: "#/components/schemas/AIAttachmentEnvelope" } } }
  /system/ai/attachments/{attachmentId}:
    delete:
      tags: [AI]
      operationId: deleteAIAttachment
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-tool: {"risk": "high"}
      x-dst-transport: assistant
      summary: Delete an assistant attachment owned by the caller
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Temporary attachment deleted, content: { application/json: { schema: { $ref: "#/components/schemas/AIEnvelope" } } } }
  /system/ai/resources/{resourceId}:
    get:
      tags: [AI]
      operationId: downloadAIResource
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-transport: assistant
      summary: Download or stream a management result prepared by the assistant
      description: Rechecks caller ownership, expiry and the original management endpoint authentication. A prepared link does not mean its contents were downloaded or inspected.
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Original authenticated binary or streaming response, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /system/ai:
    get:
      tags: [AI]
      operationId: getAIStatus
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-intent:
        purpose: "读取管理服务的 AI 开关、模型配置与工具目录，不返回模型密钥。"
        actions: ["查看 AI 助手开关状态", "读取可用工具清单", "确认 AI 配置项"]
        queries: ["AI 助手好像没反应，看下它到底开没开", "确认下 AI 现在能用哪些工具，别越权改东西"]
        terms: ["AI 控制器", "工具清单", "AI 开关", "密钥脱敏"]
      summary: Read Controller AI configuration and tool catalog without secrets
      responses:
        "200":
          description: Read Controller AI configuration and tool catalog without secrets
          content: { application/json: { schema: { $ref: "#/components/schemas/AIEnvelope" } } }
    put:
      tags: [AI]
      operationId: configureAI
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-intent:
        purpose: "保存面板 AI 助手配置，带修订号校验避免并发覆盖，只更新提交的字段并保留其它配置与修订。"
        actions: ["保存 AI 配置", "修改 AI 模型参数", "更新 AI 助手设置"]
        queries: ["改一下面板 AI 助手的配置，顺手保存一下", "AI 配置要换模型和密钥，帮忙存一下"]
        terms: ["AI 助手", "模型配置", "API Key", "修订号", "面板设置"]
      summary: Save AI configuration with revision checking
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AIConfigInput" } } } }
      responses:
        "200":
          description: Save AI configuration with revision checking
          content: { application/json: { schema: { $ref: "#/components/schemas/AIEnvelope" } } }
  /system/ai/actions/test:
    post:
      tags: [AI]
      operationId: testAIProvider
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-intent:
        purpose: "用一条最小提示词验证已保存的大模型连接是否可用，确认改完配置后面板 AI 功能能真正调通。"
        actions: ["测试模型连通性", "发送最小提示词", "校验密钥与接口地址"]
        queries: ["面板里的 AI 助手连不上了，帮我测一下模型通不通", "刚换了 API Key，发条测试问句看看能不能回"]
        terms: ["大模型", "API Key", "Provider", "最小提示词", "连通性测试"]
      x-dst-tool: {"openWorld": true}
      summary: Test the saved model connection; sends a minimal prompt
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Test the saved model connection; sends a minimal prompt
          content: { application/json: { schema: { $ref: "#/components/schemas/AIEnvelope" } } }
  /system/ai/tokens:
    get:
      tags: [AI]
      operationId: listAITokens
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-intent:
        purpose: "列出已配置的 MCP 凭据元数据，包括名称、创建时间和有效期等，只返回脱敏信息、不展示明文密钥，便于管理面板接入授权。"
        actions: ["列出 MCP 凭据清单", "查看密钥元数据", "检查令牌有效期"]
        queries: ["面板接了哪些 MCP 密钥，把有效期给我列一下", "这个 token 是谁建的、什么时候过期，帮我查一下"]
        terms: ["MCP Token", "密钥脱敏", "凭据有效期", "接入授权", "API Key"]
      summary: List MCP credential metadata; no plaintext keys
      responses:
        "200":
          description: List MCP credential metadata; no plaintext keys
          content: { application/json: { schema: { $ref: "#/components/schemas/AIEnvelope" } } }
    post:
      tags: [AI]
      operationId: createAIToken
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-intent:
        purpose: "创建有名称和有效期的管理员 API/MCP 接入凭据，明文只返回一次；AI 通道保护私密结果，不提供自定义只读权限。"
        actions: ["创建 MCP 密钥", "添加外部 AI 接入令牌"]
        queries: ["给外部 AI 客户端创建一把接入密钥", "创建一个有有效期的 MCP 凭据"]
        terms: ["MCP", "接入密钥", "令牌", "有效期"]
      summary: Create a named administrator API/MCP credential; plaintext returned once
