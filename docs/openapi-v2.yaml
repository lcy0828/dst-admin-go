          required: [id, name, size, sha256, createdAt]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            size: { type: integer, minimum: 0, maximum: 2147483648 }
            sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            createdAt: { type: string, format: date-time }
