          in: query
          required: false
          description: RFC3339 timestamp; default last hour; maximum range 31 days.
          schema:
            type: string
            format: date-time
        - name: level
          in: query
          required: false
          description: ""
          schema:
            type: string
            enum:
              - debug
              - info
              - warn
              - error
              - fatal
        - name: component
          in: query
          required: false
          description: ""
          schema:
            type: string
            maxLength: 64
        - name: keyword
          in: query
          required: false
          description: ""
          schema:
            type: string
            maxLength: 256
        - name: requestId
          in: query
          required: false
          description: ""
          schema:
            type: string
            maxLength: 128
        - name: jobId
          in: query
          required: false
          description: ""
          schema:
            type: string
            maxLength: 128
        - name: operationId
          in: query
          required: false
          description: ""
          schema:
            type: string
            maxLength: 128
        - name: cursor
          in: query
          required: false
          description: Opaque continuation token; preserve all filters when following nextCursor.
          schema:
            type: string
            maxLength: 2048
        - name: afterId
          in: query
          required: false
          description: Newest previously seen entry ID for bounded refresh; coverageLost means the anchor was not reached.
