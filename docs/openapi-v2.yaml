openapi: 3.1.0
info:
  title: DST Admin API
  version: 2.0.0-alpha.1
  description: >-
    Contract for the authenticated DST Admin management API. JSON fields use
    camelCase. Authenticated state-changing requests require X-CSRF-Token and
    Idempotency-Key headers. Clients send X-DST-Runtime-Target with local or an
    agent-prefixed target ID; unsupported remote domain operations fail closed.
servers:
  - url: /api/v2
tags:
  - name: Auth
  - name: System
  - name: Rooms
  - name: Logs
  - name: Console
  - name: Backups
  - name: Game
  - name: Maps
  - name: Configuration
  - name: Mods
  - name: Players
  - name: WorldState
  - name: Automation
  - name: Agents
  - name: Containers
  - name: Jobs
paths:
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      security: []
      summary: Inspect setup and session state
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
  /auth/setup:
    post:
      tags: [Auth]
      operationId: setupAdmin
      security: []
      summary: Create the single administrator on first run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCredentials"
      responses:
        "201":
          description: Administrator and session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Create an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Login attempts are temporarily rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: Change the administrator password and revoke every session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  maxLength: 72
                newPassword:
                  type: string
                  minLength: 6
                  maxLength: 72
      responses:
        "200":
          description: Password changed; the client must log in again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /system/capabilities:
    get:
      tags: [System]
      operationId: getSystemCapabilities
      summary: Detect platform, tools, paths, and available management features
      responses:
        "200":
          description: Runtime capability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/setup-checks:
    get:
      tags: [System]
      operationId: getSetupChecks
      summary: Re-run deployment and room discovery checks
      responses:
        "200":
          description: Current deployment readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Read host, CPU, memory, disk, process, and Go runtime metrics
      responses:
        "200": { description: Current system status, content: { application/json: { schema: { $ref: "#/components/schemas/SystemStatusEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /system/settings:
    get:
      tags: [System]
      operationId: getSystemSettings
      summary: Read effective editable settings and their source without revealing secrets
      responses:
        "200":
          description: Current settings
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsEnvelope" } } }
  /system/settings/preview:
    post:
      tags: [System]
      operationId: previewSystemSettings
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsInput" } } } }
      responses:
        "200":
          description: Validated settings diff
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsPreviewEnvelope" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /system/settings/actions/apply:
    post:
      tags: [System]
      operationId: applySystemSettings
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsInput" } } } }
      responses:
        "200":
          description: Applied settings and restart state
          headers: { Cache-Control: { schema: { type: string }, description: Always no-store } }
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettingsApplyEnvelope" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /system/settings/actions/test-email:
    post:
      tags: [System]
      operationId: testSystemSMTPConnection
      summary: Establish a real SMTP connection, negotiate TLS, and authenticate when configured
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [server, port]
              properties:
                server: { type: string }
                port: { type: integer, minimum: 1, maximum: 65535 }
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: SMTP connection and optional authentication succeeded
          content:
            application/json:
              schema:
                type: object
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      summary: Discover DST rooms from the configured save root
      responses:
        "200":
          description: Discovered rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Atomically create and adopt a DST room
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInput"
      responses:
        "201":
          description: Room created and adopted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Read a discovered room
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Rooms]
      operationId: deleteRoom
      summary: Move a stopped room into the save-root recovery directory
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoomInput"
      responses:
        "200":
          description: Room moved to the recovery directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRoomResultEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/adopt:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Rooms]
      operationId: adoptRoom
      summary: Mark a discovered room as managed
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Adopted room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{roomId}/worlds:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Rooms]
      operationId: listRoomWorlds
      summary: List shard configuration and current tmux state
      responses:
        "200":
          description: Room worlds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldListEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Rooms]
      operationId: createRoomWorld
      summary: Atomically create a stopped world with collision-free shard ports
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorldInput"
      responses:
        "201":
          description: World created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldRecordEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/worlds/{worldId}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    delete:
      tags: [Rooms]
      operationId: deleteRoomWorld
      summary: Move a stopped world into the room recovery directory
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteWorldInput"
      responses:
        "200":
          description: World moved to the recovery directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteWorldResultEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [start, stop, restart]
    post:
      tags: [Rooms, Jobs]
      operationId: runRoomAction
      summary: Start, stop, or restart selected worlds through a persistent job
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomActionInput"
      responses:
        "202":
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/worlds/{worldId}/logs:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    get:
      tags: [Logs]
      operationId: getWorldLog
      summary: Read a bounded tail of the current world log
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
        - name: query
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Current log snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSnapshotEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{roomId}/worlds/{worldId}/logs/download:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    get:
      tags: [Logs]
      operationId: downloadWorldLog
      summary: Download the current world log without creating a missing file
      responses:
        "200":
          description: Current world log file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{roomId}/worlds/{worldId}/logs/events:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    get:
      tags: [Logs]
      operationId: streamWorldLog
      summary: Stream log snapshots, appended lines, resets, and heartbeats
      parameters:
        - name: tail
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: Authenticated server-sent event stream containing LogEvent values
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /commands:
    get:
      tags: [Console]
      operationId: listCommands
      summary: List built-in and persistent custom command definitions
      responses:
        "200":
          description: Commands ordered for display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDefinitionListEnvelope"
    post:
      tags: [Console]
      operationId: createCommand
      summary: Persist a custom Lua command definition
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandDefinitionInput"
      responses:
        "201":
          description: Custom command created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDefinitionEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /commands/{commandId}:
    parameters:
      - $ref: "#/components/parameters/CommandID"
    get:
      tags: [Console]
      operationId: getCommand
      summary: Read one built-in or custom command definition
      responses:
        "200":
          description: Command definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDefinitionEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Console]
      operationId: updateCommand
      summary: Update a persistent custom command definition
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandDefinitionInput"
      responses:
        "200":
          description: Custom command updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDefinitionEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Console]
      operationId: deleteCommand
      summary: Delete a persistent custom command definition
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Custom command deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDeleteResultEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /rooms/{roomId}/commands:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Console]
      operationId: listRoomCommands
      summary: List built-in and persistent custom command definitions
      responses:
        "200":
          description: Built-in commands ordered for display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDefinitionListEnvelope"
  /rooms/{roomId}/command-runs:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Console]
      operationId: listCommandRuns
      summary: List persistent command audit records
      parameters:
        - name: worldId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Command records ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandRunListEnvelope"
    delete:
      tags: [Console]
      operationId: clearCommandRuns
      summary: Delete persistent command audit records for a room or world
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: worldId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Number of command records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandClearRunsResultEnvelope"
  /rooms/{roomId}/command-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/CommandRunID"
    get:
      tags: [Console]
      operationId: getCommandRun
      summary: Read one persistent command record
      responses:
        "200":
          description: Command record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandRunEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{roomId}/worlds/{worldId}/commands:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    post:
      tags: [Console]
      operationId: executeRoomCommand
      summary: Render and send a typed built-in command
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteCommandInput"
      responses:
        "201":
          description: Command send attempt persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandRunEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/worlds/{worldId}/raw-commands:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    post:
      tags: [Console]
      operationId: executeRawRoomCommand
      summary: Send a bounded raw Lua command after exact room-name confirmation
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRawCommandInput"
      responses:
        "201":
          description: Raw command send attempt persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandRunEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/backups:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Backups]
      operationId: listRoomBackups
      summary: List verified backups for a managed room
      responses:
        "200":
          description: Backups ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupListEnvelope"
    post:
      tags: [Backups, Jobs]
      operationId: createRoomBackup
      summary: Request a consistent manual backup through a persistent job
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupInput"
      responses:
        "202":
          description: Backup job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/backups/upload:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Backups]
      operationId: uploadRoomBackup
      summary: Upload and verify a ZIP backup without publishing invalid content
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  maxLength: 128
      responses:
        "201":
          description: Verified upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupEnvelope"
        "413":
          description: Upload or expanded archive exceeds safety limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/backups/actions/prune:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Backups, Jobs]
      operationId: pruneRoomBackups
      summary: Apply the current snapshot retention limit through a persistent job
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Prune job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
  /rooms/{roomId}/backup-policy:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Backups]
      operationId: getRoomBackupPolicy
      summary: Read the persisted automatic snapshot policy
      responses:
        "200":
          description: Snapshot policy
