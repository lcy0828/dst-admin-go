      x-dst-access: {profile: panel-manage}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor, mode]
              properties:
                actor:
                  type: object
                  additionalProperties: false
                  required: [identity, profile, rooms, categories, writes, deny]
                  properties:
                    identity: {type: array, minItems: 4, maxItems: 4, items: {type: string, minLength: 1, maxLength: 255}, description: 平台、机器人、会话、用户，由可信适配器验证}
                    profile: {type: string, enum: [game-read, game-manage, panel-manage]}
                    rooms: {type: array, maxItems: 64, items: {type: string, minLength: 1, maxLength: 255}}
                    categories: {type: array, maxItems: 64, items: {type: string, minLength: 1, maxLength: 255}}
                    writes: {type: array, maxItems: 256, items: {type: string, minLength: 1, maxLength: 255}}
                    deny: {type: array, maxItems: 256, items: {type: string, minLength: 1, maxLength: 255}}
                    workbench: {type: string, enum: [off, standard, all], default: off}
                    panelWide: {type: boolean, default: false, description: 由可信适配器验证的面板维护者全局管理授权；不会移除房间过滤}
                mode: {type: string, enum: [find, read, run, execute, result, recover, resource]}
                query: {type: string, maxLength: 256}
                operationId: {type: string, maxLength: 64}
                arguments: {type: object, description: 原 API 的 path/query/body/headers；未提供字段保持省略，不代填 default}
                requestId: {type: string, minLength: 8, maxLength: 128, description: 插件按消息生成；模型不可选择}
                taskRef: {type: string, format: uuid}
      responses:
        '200':
          description: 授权候选、待确认计划或原始执行回执；accepted 不表示任务完成。resource 模式按原接口返回认证的文件或流，并再次验证调用者归属。
          content:
            application/json:
              schema:
                type: object
                required: [data, error, meta]
                properties:
                  data: {type: object}
                  error: {type: [object, 'null']}
                  meta: {$ref: '#/components/schemas/Meta'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
