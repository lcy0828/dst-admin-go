    Player:
      type: object
      additionalProperties: false
      required: [id, roomId, worldId, worldName, name, online, banned, admin, age, firstSeenAt, lastSeenAt, statusChangedAt, lastRefreshedAt, presenceStatus, fields, presenceConflict, observedWorldIds]
      properties:
        sessionId: { type: string, description: Validated per-world save session; absent for legacy observations }
        historical: { type: boolean, description: True for a read-only archived record }
        historyId: { type: integer, minimum: 1, description: Stable archived record identifier }
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
        roomId: { type: string }
        worldId: { type: string }
        worldName: { type: string }
        localEntity: { type: boolean, description: Explicit local entity evidence from the selected observation; absent for older producers and history. Does not by itself guarantee fresh presence }
        worldConfirmed: { type: boolean, description: For online players, true only for current local entity evidence without conflict. When false, worldId and worldName can be last-known history and must not be shown as current location. A cluster-wide client list alone is insufficient }
        name: { type: string }
        prefab: { type: string }
        online: { type: boolean }
        banned: { type: boolean }
        banReason: { type: string, maxLength: 300 }
        bannedAt: { type: string, format: date-time }
        banExpiresAt: { type: string, format: date-time }
        admin: { type: boolean }
        age: { type: integer, minimum: 0 }
        netId: { type: string }
        netScore: { type: integer, minimum: 0, description: "玩家网络连接质量原生档位 netScore；不是 Ping 或网络往返延迟毫秒，不能换算为 RTT、丢包率、抖动或客户端 FPS。" }
        performance: { type: integer, deprecated: true, description: Legacy field retained for read compatibility; use netScore }
        healthPercent: { type: number }
        hungerPercent: { type: number }
        sanityPercent: { type: number }
        temperature: { type: number }
        moisture: { type: number }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        lastSeenSource: { $ref: "#/components/schemas/PlayerDataSource" }
        lastConnectedAt: { type: string, format: date-time, description: Latest authenticated connection event across room shards }
        lastDisconnectedAt: { type: string, format: date-time, description: Latest shard disconnect event; includes shard migration and is not necessarily a room exit }
        statusChangedAt: { type: string, format: date-time }
        lastRefreshedAt: { type: string, format: date-time }
        presenceStatus: { $ref: "#/components/schemas/PlayerFreshnessStatus" }
        presenceObservedAt: { type: string, format: date-time }
        fields:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PlayerFieldState" }
        presenceConflict: { type: boolean, description: Simultaneous shard-local entity evidence in multiple worlds; duplicated cluster client entries alone do not create a conflict }
        observedWorldIds: { type: array, items: { type: string } }
    PlayerDataSource:
      type: string
      enum: [customcommands, console-fallback, native-log]
    PlayerFreshnessStatus:
      type: string
      enum: [live, stale, unavailable]
    PlayerFieldState:
      type: object
      additionalProperties: false
      required: [source, status]
      properties:
        source: { $ref: "#/components/schemas/PlayerDataSource" }
        observedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/PlayerFreshnessStatus" }
    PlayerEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/Player" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    PlayerList:
      type: object
      additionalProperties: false
      required: [items, total, online, staleOnline, offline, banned, limit, offset]
      properties:
        stale: { type: integer, minimum: 0, description: All records with stale presence including offline records; staleOnline retains its safety-oriented meaning }
        items: { type: array, items: { $ref: "#/components/schemas/Player" } }
        total: { type: integer, minimum: 0 }
        online:
          type: integer
          minimum: 0
          description: Unique real cluster connections in the latest successful observation, including selecting, loading and migrating players. A player can be online without a confirmed current world.
        staleOnline:
          type: integer
          minimum: 0
          description: Players last known online whose latest world observation failed.
        offline:
          type: integer
          minimum: 0
          description: Players confirmed offline.
        banned: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        pausedWorldIds:
          type: array
          description: Worlds with validated current-process snapshots whose sampling is paused. Retained player records are last-known observations, not confirmed current presence. Real read failures remain warnings.
          items: { type: string }
        warnings: { type: array, items: { type: string } }
        accessListsAvailable: { type: boolean }
        accessListsState:
          type: string
          enum: [not_permitted, not_requested, available, unavailable]
          description: "Management-list coverage: not_permitted means the caller's default excludes lists; not_requested means explicit false; available means retrieved; unavailable means requested and permitted but the source could not be read. When not read, banned=false and banned count 0 are compatibility placeholders, not verified absence of bans. Older servers may omit this field."
        lastRefreshedAt: { type: string, format: date-time }
    PlayerListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/PlayerList" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
