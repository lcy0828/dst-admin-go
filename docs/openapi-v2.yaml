  /rooms/{roomId}/chat-logs/stream:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Logs]
      operationId: streamRoomChatLogs
      x-dst-access:
        profile: panel-manage
        category: status
      x-dst-intent:
        purpose: "获取房间游戏聊天推送流的认证链接，包含玩家发言和写入聊天日志的模组公告；支持断线续读。生成链接不代表已经订阅或收到了消息。"
        actions: ["订阅游戏聊天", "推送模组公告", "聊天断线续读"]
        queries: ["我需要游戏聊天记录的推送流", "模组在游戏聊天里打印的消息能实时接收吗"]
        terms: ["聊天记录", "公屏", "模组公告", "SSE", "续读"]
      summary: Subscribe to persisted room chat changes, including player messages and mod announcements
      x-dst-tool: {readOnly: true, destructive: false, risk: low, tags: [chat, stream], runtime: any}
      description: >-
        Room-scoped authenticated SSE; uses the same read permission as room chat history.
        Without a cursor starts at the current journal tail, not historical messages.
        Omit kind for say, whisper and announcement; use kind=say for public-chat forwarding.
        chat.record data follows ChatLogChange; id is a resume cursor, not the chat record ID.
        Operations are created, updated (including a second shard source), and deleted.
        Persist all SSE ids, including chat.cursor. Cursor is bound to room and kind.
        chat.gap means retention exceeded and is followed by retained replay;
        chat.reset means journal replacement or restoration and starts at the current tail.
        Both require explicit consumer handling, never infer uninterrupted coverage.
        chat.status reports source synchronization; chat.error requires reconnect with the last committed cursor.
        chat.reconnect requests periodic reauthorization. Heartbeat comments arrive every 15 seconds.
        Created means newly persisted, not necessarily newly spoken; historical marks archive/repair ingestion.
        The journal retains at most 2048 changes or 4 MiB per room, with 64 KiB maximum record payloads.
        Consumers deduplicate deliveries by SSE id and update records by chat record ID; truncated records must not be treated as complete.
        Concurrent subscribers share demand-driven collection (normally every 2 seconds, backoff on failure).
        MCP returns an authenticated resource link, not an active model subscription. See docs/chat-stream.md.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ChatLogKind" }
        - name: cursor
          in: query
          description: Opaque room-and-kind-bound cursor from a previously committed SSE id; takes precedence over Last-Event-ID
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: Last-Event-ID
          in: header
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: SSE chat.cursor, chat.record, chat.status, chat.gap, chat.reset, chat.error, chat.reconnect and heartbeat comments
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429":
          description: Subscription budget exhausted; retry after Retry-After seconds (32 total, 8 rooms, 8 subscribers per room)
          headers:
            Retry-After:
              schema: { type: integer, example: 5 }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
