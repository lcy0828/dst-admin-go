      additionalProperties: false
      required: [id, roomId, worldId, mode, name, risk, status, resultState, mayHaveExecuted, logQuery, createdAt]
      properties:
        batch: {$ref: '#/components/schemas/WorkbenchBatchResult'}
        movement: {$ref: '#/components/schemas/WorkbenchMovementResult'}
        resultState:
          type: string
          enum: [waiting, output, no_output, output_unavailable, failed, unconfirmed]
          description: Evidence state. output includes printed 0; no_output means confirmed execution with empty synchronous capture, not zero matches. output_unavailable means confirmed execution without capture support. unconfirmed never implies zero or failure. Failed execution takes precedence over any partial output.
        receiptRefreshUntil:
          type: string
          format: date-time
          description: Eligible unconfirmed managed runs can request refresh=true until this time (2 minutes from submission). Receipts may be overwritten earlier. Absence means no late lookup is offered.
        receiptCheck:
          type: object
          additionalProperties: false
          required: [status, checkedAt]
          description: Outcome of an explicit receipt lookup in this response; not persisted as command execution evidence.
          properties:
            status:
              type: string
              enum: [found, not_found, unavailable, expired, unsupported]
            checkedAt:
              type: string
              format: date-time
