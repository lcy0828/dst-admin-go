    ShardRuntimeEventListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/ShardRuntimeEventList" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    DSTRuntimeInstallState:
      type: string
      enum: [missing, installed, outdated, invalid]
    DSTRuntimeHealthState:
      type: string
      enum: [ready, starting, stopped, degraded, unavailable]
    DSTRuntimeStatus:
      type: object
      additionalProperties: false
      required: [roomId, worldId, worldName, state]
      properties:
        roomId: { type: string }
        worldId: { type: string }
        worldName: { type: string }
        state: { $ref: "#/components/schemas/DSTRuntimeInstallState" }
        version: { type: string }
        protocolVersion: { type: integer, minimum: 1 }
        changed: { type: boolean }
        backupPath: { type: string, description: Relative path below the shard directory }
        message: { type: string }
    DSTRuntimeHealth:
      type: object
      additionalProperties: false
      required: [schemaVersion, producerVersion, producerInstanceId, sessionId, shardId, running, ready, writing, sequence, consecutiveFailures]
      properties:
        updateId: { type: string, maxLength: 80, description: Correlation identifier for the installed Runtime activation attempt }
        schemaVersion: { type: integer, minimum: 1 }
        producerVersion: { type: string }
        producerInstanceId: { type: string }
        sessionId: { type: string }
        shardId: { type: string }
        running: { type: boolean }
        ready: { type: boolean }
        writing: { type: boolean }
        sequence: { type: integer, format: int64, minimum: 0 }
        heartbeatSequence: { type: integer, format: int64, minimum: 0, description: Independent heartbeat counter; does not imply a successful sample }
        heartbeatAtUnix: { type: integer, format: int64, minimum: 1, description: Last persisted collector heartbeat; native empty-server sleep may suspend updates }
        paused: { type: boolean, description: Actual simulation pause state; absent when unknown or from a legacy collector }
        lastCapturedAtUnix: { type: integer, format: int64 }
        lastWrittenAtUnix: { type: integer, format: int64 }
        lastDurationMilliseconds: { type: number, minimum: 0 }
        lastError: { type: string }
        consecutiveFailures: { type: integer, minimum: 0 }
        modules:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DSTRuntimeModuleHealth" }

    DSTRuntimeLifecycleMode:
      type: string
      enum: [activate, reload, current]

    DSTRuntimeLifecycle:
      type: object
      additionalProperties: false
      required: [roomId, worldId, worldName, mode, health, message]
      properties:
        roomId: { type: string }
        worldId: { type: string }
        worldName: { type: string }
        mode: { $ref: "#/components/schemas/DSTRuntimeLifecycleMode" }
        health: { $ref: "#/components/schemas/DSTRuntimeHealth" }
        message: { type: string }

    DSTRuntimeLifecycleEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/DSTRuntimeLifecycle" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    DSTRuntimeModuleHealth:
      type: object
      additionalProperties: false
      required: [running, ready]
      properties:
        producerInstanceId: { type: string, maxLength: 128, description: Module producer identity; commands use this identity for receipts, not the telemetry producer identity }
        running: { type: boolean }
        ready: { type: boolean }
        busy: { type: boolean }
        sequence: { type: integer, format: int64, minimum: 0 }
        lastCapturedAtUnix: { type: integer, format: int64, minimum: 1 }
        lastWrittenAtUnix: { type: integer, format: int64, minimum: 1 }
        lastDurationMilliseconds: { type: number, minimum: 0 }
        consecutiveFailures: { type: integer, minimum: 0 }
        lastError: { type: string, maxLength: 1024 }

    DSTRuntimeEvent:
      type: object
      additionalProperties: false
      required: [sequence, kind, occurredAtUnix, fields]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        kind:
          type: string
          enum: [player.joined, player.left, world.save, world.reset, world.shutdown, world.cycles, world.phase, world.season, world.rain, mod.notice]
        occurredAtUnix: { type: integer, format: int64, minimum: 1 }
        fields: { type: object, additionalProperties: true }

    DSTRuntimeEventBatch:
      type: object
      additionalProperties: false
      required: [schemaVersion, producerVersion, producerInstanceId, sessionId, shardId, firstSequence, lastSequence, events]
