        - pvp
        - passwordProtected
        - managed
        - controlState
        - controlAvailable
        - worldCount
        - targetIds
        - availableTargetIds
        - updatedAt
      properties:
        id:
          type: string
          description: Canonical opaque ID derived from the safe directory component
        directoryName:
          type: string
        name:
          type: string
        description:
          type: string
        gameMode:
          type: string
        maxPlayers:
          type: integer
        pvp:
          type: boolean
        passwordProtected:
          type: boolean
        managed:
          type: boolean
          deprecated: true
          description: Compatibility field; discovered rooms are registered automatically
        controlState:
          type: string
          enum: [ready, degraded, offline, unavailable]
        controlAvailable:
          type: boolean
        worldCount:
          type: integer
        targetIds:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Runtime targets where this logical room was discovered
        availableTargetIds:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Online targets with a fresh inventory for this room
        updatedAt:
          type: string
          format: date-time
    CreateRoomInput:
      type: object
      additionalProperties: false
      required: [directoryName, name, gameMode, maxPlayers, includeCaves]
      properties:
        directoryName:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 512
          default: ""
        gameMode:
          type: string
          enum: [survival, endless, wilderness]
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 64
        pvp:
          type: boolean
          default: false
        password:
          type: string
          maxLength: 64
          writeOnly: true
        clusterToken:
          type: string
          maxLength: 4096
          writeOnly: true
        includeCaves:
          type: boolean
    RoomActionInput:
      type: object
      additionalProperties: false
      properties:
        immediate:
          type: boolean
          default: false
          description: Explicitly skip notification and countdown for this stop or restart only. Does not change room policy.
        worldIds:
          type: array
          uniqueItems: true
          items:
            type: string
        allowCapacityRisk:
          type: boolean
          default: false
        runtimeMode:
          $ref: "#/components/schemas/RuntimePerformanceMode"
          description: Explicit Lua runtime for start/restart. Omit to retain each running world's actual mode, or its remembered mode when stopped. A new world without history uses game. Optional runtimes are validated before a restart stops any world.
        runtimeVersion:
          type: string
          pattern: '^(game|[0-9]+\.[0-9]+\.[0-9]+)$'
          description: Exact LuaJIT package version shown to the user. Omit for legacy clients or use game with the game runtime.
