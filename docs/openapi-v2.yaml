          format: uuid
        kind:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        outcome:
          $ref: "#/components/schemas/JobOutcome"
        roomId:
          type: string
        worldId:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
        error:
          $ref: "#/components/schemas/JobError"
        cancelRequested:
          type: boolean
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        targets:
          type: array
          items:
            $ref: "#/components/schemas/JobTarget"
    JobEvent:
