      - name: installationId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    get:
      tags: [Mods, Agents]
      operationId: listRuntimeInstallationMods
      summary: Read the Mod files currently present in one runtime installation
