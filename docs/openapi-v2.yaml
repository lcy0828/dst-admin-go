      responses:
        "200": { description: Runtime installation result, content: { application/json: { schema: { $ref: "#/components/schemas/DSTRuntimeStatusEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /rooms/{roomId}/worlds/{worldId}/runtime/actions/activate:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
