      operationId: configureRoomBackupSchedule
      x-dst-access:
        profile: game-manage
        category: status
      x-dst-intent:
        purpose: "开启、修改或暂停房间自动备份计划，支持部分更新已有计划或按默认值新建，避免重复创建调度。"
        actions: ["开启自动备份", "修改备份计划", "暂停自动备份", "设置定时备份", "修改备份时间"]
        queries: ["给房间开个自动备份，每天定时存一份", "自动备份的时间想改，改成每两小时一次"]
        terms: ["自动备份", "备份计划", "快照", "定时调度", "存档备份", "定时备份", "计划备份"]
        resultNotes: "effectiveEnabled 表示实际启用状态；nextRunLocal 含时区。计划已启用不代表备份已执行。"
      summary: Enable, edit or pause automatic room backups without duplicate schedules
      description: >-
        Partial update of an existing backup plan, or creation using the same defaults as the UI.
        Send enabled=true to enable, enabled=false to pause. Unspecified existing settings are preserved.
        With no taskId, reuses the sole backup task; multiple candidates require an explicit taskId.
        createNew=true explicitly creates an additional plan. An active legacy interval policy is reused
        when it is the only source; use updateRoomBackupPolicy for its interval, and pause it before creating
        a Cron replacement. Enabling a task in a paused group moves it to an enabled backup group without
        enabling unrelated tasks. Returns persisted effectiveEnabled and nextRunLocal for verification.
        Does not immediately run a backup or change real saves. Use runAutomationTask or
        createDistributedBackupSet for an immediate backup; a scheduled backup covers every world through
        the existing consistency coordinator and applied Placement, including remote Agents.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BackupScheduleInput" } } }
      responses:
        "200":
          description: Persisted schedule and effective group/task state; this does not mean a backup archive was created
          content: { application/json: { schema: { $ref: "#/components/schemas/BackupScheduleEnvelope" } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
