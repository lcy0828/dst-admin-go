        issues: { type: array, items: { $ref: "#/components/schemas/TopologyIssue" } }
        observedAt: { type: string, format: date-time }

    RuntimeOverviewEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/RuntimeOverview" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

