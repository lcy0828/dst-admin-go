        producerVersion: { type: string }
        producerInstanceId: { type: string }
        sessionId: { type: string }
        shardId: { type: string }
        firstSequence: { type: integer, format: int64, minimum: 1 }
        lastSequence: { type: integer, format: int64, minimum: 1 }
        events: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/DSTRuntimeEvent" } }

    DSTRuntimeEventBatchEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/DSTRuntimeEventBatch" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }

    RuntimeOverviewProblem:
