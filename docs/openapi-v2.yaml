        runtime: { $ref: "#/components/schemas/RuntimeOverviewStatus" }
        runtimeProblem: { $ref: "#/components/schemas/RuntimeOverviewProblem" }
        health: { $ref: "#/components/schemas/RuntimeOverviewArtifact" }
        latestDiagnostic: { $ref: "#/components/schemas/RuntimeOverviewArtifact" }

    RuntimeOverviewSummary:
      type: object
      additionalProperties: false
      required: [total, healthy, degraded, unavailable, running, stopped, planned]
      properties:
        total: { type: integer, minimum: 0 }
        healthy: { type: integer, minimum: 0 }
        degraded: { type: integer, minimum: 0 }
        unavailable: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        stopped: { type: integer, minimum: 0 }
        planned: { type: integer, minimum: 0 }

    RuntimeOverview:
      type: object
      additionalProperties: false
      required: [roomId, topologyRevision, remoteExecutionReady, summary, shards, targets, issues, observedAt]
      properties:
        roomId: { type: string }
