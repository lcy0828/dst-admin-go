      tags: [Configuration]
      operationId: getClusterTokenStatus
      summary: Read only masked Cluster Token status and revision
      responses:
        "200":
          description: Masked token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenStatusEnvelope"
  /rooms/{roomId}/cluster-token/reveal:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Configuration]
      operationId: revealClusterToken
      summary: Reveal the Cluster Token after exact room-name confirmation; response is never cached
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationInput"
      responses:
        "200":
          description: Unmasked token with no-store response headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRevealEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/cluster-token/preview:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Configuration]
      operationId: previewClusterToken
      summary: Validate a token change without returning either secret in the diff
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenUpdateInput"
      responses:
        "200":
          description: Secret-safe token diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationPreviewEnvelope"
  /rooms/{roomId}/cluster-token/actions/apply:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Configuration, Jobs]
      operationId: applyClusterToken
      summary: Protect the room and atomically replace or clear the token through a persistent job
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenUpdateInput"
      responses:
        "202":
          description: Token update job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
  /game/version:
    get:
      tags: [Game]
      operationId: getGameVersion
      parameters:
        - name: steam
          in: query
          description: Set false for installed metadata and official stable version only; does not launch SteamCMD or preflight worlds.
          schema: { type: boolean, default: true }
        - name: refresh
          in: query
          description: With steam=false, bypass the official release cache for an explicit refresh.
          schema: { type: boolean, default: false }
      summary: Inspect the local Steam build, Steam update state, official Klei PC release, and update capability
      responses:
        "200":
          description: Version report; Steam and Klei failures are reported independently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameVersionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /game/installed-versions:
    get:
      tags: [Game]
      operationId: getInstalledGameVersions
      summary: Read each managed installation once from its applied Runtime target without Steam queries or update preflight
      parameters:
        - name: targetIds
          in: query
          description: Comma-separated Runtime target IDs; omitted means all managed targets.
          schema: { type: string }
      responses:
        "200":
          description: Fresh installed metadata, with per-installation errors for offline or failed reads
          content:
            application/json:
              schema:
                type: object
                required: [data, error, meta]
                properties:
                  data:
                    type: object
                    required: [installations]
                    properties:
                      installations:
                        type: array
                        items: { $ref: "#/components/schemas/InstalledGameVersion" }
                  error: { type: "null" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /game/releases/preview:
    post:
      tags: [Game]
      operationId: previewGameRelease
      summary: Preflight every affected installation and shard without changing runtime state
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameReleasePreviewInput"
      responses:
        "200":
          description: Immutable release plan with per-installation blockers and restart intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameReleasePlanEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /game/releases:
    get:
      tags: [Game]
      operationId: listGameReleases
      summary: List durable distributed game release and recovery records
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Paginated game release records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameReleaseListEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      tags: [Game, Jobs]
      operationId: publishGameRelease
      summary: Revalidate a confirmed plan, protect all rooms, update every installation, and restore prior shard state
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameReleaseCreateInput"
      responses:
        "202":
          description: Distributed game release Job accepted; the Job ID is also the release ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /game/releases/{releaseId}:
    parameters:
      - $ref: "#/components/parameters/GameReleaseID"
    get:
      tags: [Game]
      operationId: getGameRelease
      summary: Read one durable release including backups, installation results, shard state, and recovery diagnostics
      responses:
        "200":
          description: Distributed game release record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameReleaseEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /game/releases/{releaseId}/actions/retry:
    parameters:
      - $ref: "#/components/parameters/GameReleaseID"
    post:
      tags: [Game, Jobs]
      operationId: retryGameRelease
      summary: Resume a failed or recovery-required release while skipping installations already at the exact target version
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Release recovery Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /rooms/{roomId}/maps:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      tags: [Maps]
      operationId: listRoomMaps
      summary: List successful, running, and failed map generations without hiding the last usable map
      responses:
        "200":
          description: Room maps and renderer capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapListEnvelope"
  /rooms/{roomId}/maps/actions/generate:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      tags: [Maps, Jobs]
      operationId: generateRoomMap
      summary: Generate validated map layers through a persistent job and atomically publish them
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateMapInput"
      responses:
        "202":
          description: Map generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /rooms/{roomId}/worlds/{worldId}/sessions:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - $ref: "#/components/parameters/WorldID"
    get:
      tags: [Maps]
      operationId: listWorldSessions
      summary: Discover bounded regular world snapshots while excluding metadata and unsafe links
      responses:
        "200":
          description: Session snapshots ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{sessionId}/download:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Maps]
      operationId: downloadSessionSnapshot
      summary: Download an authenticated world Session snapshot for diagnosis
      responses:
        "200":
          description: Raw Session snapshot
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /maps/{mapId}/images/{layer}:
    parameters:
      - name: mapId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: layer
        in: path
        required: true
        schema:
          type: string
          enum: [terrain, icons]
    get:
      tags: [Maps]
      operationId: getMapLayerImage
      summary: Read one immutable authenticated PNG layer
      responses:
        "200":
          description: Map layer PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /maps/{mapId}/manifest:
    parameters:
      - name: mapId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Maps]
      operationId: getMapManifest
      summary: Read the immutable renderer manifest, world state, dimensions, and generation warnings
      responses:
        "200":
          description: Renderer v1 manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapManifest"
        "404":
          $ref: "#/components/responses/NotFound"
  /maps/{mapId}/features:
    parameters:
      - name: mapId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Maps]
      operationId: getMapFeatures
      summary: Read immutable map POIs while preserving unknown MOD prefabs and properties
      responses:
        "200":
          description: Renderer v1 feature collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapFeatureCollection"
        "404":
          $ref: "#/components/responses/NotFound"
  /game/actions/update:
    post:
      tags: [Game, Jobs]
      operationId: updateGameServer
      summary: Protect managed rooms, stop running shards, update a SteamCMD-managed server, and optionally restart shards
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdateInput"
      responses:
        "202":
          description: Persistent update job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /game/update-runs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [Game]
      operationId: getGameUpdateRun
      summary: Read the bounded persistent SteamCMD log and version transition for an update job
      responses:
        "200":
          description: Persisted update run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameUpdateRunEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List persisted operation jobs
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: kind
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Jobs ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListEnvelope"
  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Read one job and all target results
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Request cooperative cancellation
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/events:
    get:
      tags: [Jobs]
      operationId: streamJobEvents
      summary: Stream authenticated job events from the current watermark or resume cursor
      parameters:
        - name: after
          in: query
          description: Last persisted event ID observed by this browser session; omit on a fresh connection to start at the current watermark
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Server-sent event stream; starts with job.cursor and persisted events contain JobEvent JSON
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /entity-catalog/entities:
    get:
      tags: [Entity Catalog]
      operationId: searchEntityCatalog
      summary: Search built-in common entities and the optional Beacon catalog
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100, default: "" } }
        - { name: kind, in: query, schema: { type: string, enum: [give, spawn, remove] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 120, default: 120 } }
      responses:
        "200": { description: Entity search results, content: { application/json: { schema: { $ref: "#/components/schemas/EntityCatalogEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /mods/search:
    get:
      tags: [Mods]
      operationId: searchMods
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 100, default: "" } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, trend, most_recent, last_updated, most_subscribed, top_rated], default: relevance } }
        - { name: days, in: query, schema: { type: integer, enum: [-1, 1, 7, 30, 90, 180, 365], default: 7 } }
        - { name: tags, in: query, description: Repeat this parameter or provide a comma-separated list of Workshop category identifiers, schema: { type: array, items: { type: string, enum: [character, item, pet, creature, environment, interface, utility, art, worldgen, tweak, scenario, language, other, tutorial, client_only_mod, server_only_mod, all_clients_require_mod, server_admin] } } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Workshop search results, content: { application/json: { schema: { $ref: "#/components/schemas/ModSearchEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /mods/metadata:
    get:
      tags: [Mods]
      operationId: getModMetadata
      summary: Read Workshop metadata independently from Runtime file observations
      description: Includes localized names and authors from the same source as Mod details. Load separately from Runtime facts; versions in this response are Workshop versions, not installed disk versions.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated Workshop IDs, at most 100 per request.
          schema: { type: string, pattern: '^[0-9]+(,[0-9]+){0,99}$' }
        - name: cached
          in: query
          description: Return only stored display names, authors and images. Makes no Steam request and returns no version evidence.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Metadata keyed by Workshop ID; warning reports partial or complete Steam failure, content: { application/json: { schema: { $ref: "#/components/schemas/ModMetadataEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /mods/library:
    get:
      tags: [Mods]
      operationId: listNodeModLibrary
      summary: List Workshop files stored on the active runtime target
      responses:
        "200": { description: Runtime target Mod library, content: { application/json: { schema: { $ref: "#/components/schemas/ModListEnvelope" } } } }
  /mods/library/actions/download:
    post:
      tags: [Mods]
      operationId: downloadModToNode
      summary: Download Workshop files without changing any room configuration
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModDownloadInput" } } } }
      responses:
        "202": { description: Node download job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /mods/library/{modId}/actions/update:
    parameters: [{ $ref: "#/components/parameters/ModID" }]
    post:
      tags: [Mods]
      operationId: updateNodeMod
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Node update job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
  /mods/{modId}:
    parameters: [{ $ref: "#/components/parameters/ModID" }]
    get:
      tags: [Mods]
      operationId: getModDetails
      responses:
        "200": { description: Workshop item, content: { application/json: { schema: { $ref: "#/components/schemas/SteamModEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /runtime-targets/{targetId}/installations/{installationId}/mods:
