        sources:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChatLogSource" }
    ChatLogCounts:
      type: object
      additionalProperties: false
      required: [say, whisper, announcement]
      properties:
        say: { type: integer, minimum: 0 }
        whisper: { type: integer, minimum: 0 }
        announcement: { type: integer, minimum: 0 }
    ChatLogList:
      type: object
      additionalProperties: false
      required: [items, total, counts, limit, offset, partial, truncated, availableWorlds, unavailableWorlds, problems, historyAvailable]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatLogEntry" }
        total: { type: integer, minimum: 0 }
        counts: { $ref: "#/components/schemas/ChatLogCounts" }
        limit: { type: integer, minimum: 1, maximum: 500 }
        offset: { type: integer, minimum: 0 }
        partial: { type: boolean }
        truncated: { type: boolean }
        availableWorlds: { type: integer, minimum: 0 }
        unavailableWorlds: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        historyAvailable: { type: boolean }
        syncState: { type: string, enum: [pending, catching_up, ready, partial, review] }
        pendingGenerations: { type: integer, minimum: 0 }
        unavailableGenerations: { type: integer, minimum: 0 }
        parseErrors: { type: integer, minimum: 0 }
        uncertainTimes: { type: integer, minimum: 0 }
        parseProblems:
          type: array
