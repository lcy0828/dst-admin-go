        queries: ["官方出新版本了，想把几台服的端一口气升上去", "更新前先把房间保护起来，避免更新时有人开档", "更新游戏", "直接通过面板更新游戏", "直接通过面板直接更新", "把游戏服务端更新到最新版本"]
