components:
  securitySchemes:
    apiBearer:
      type: http
      scheme: bearer
      description: Administrator API token created in AI settings; also used at /mcp. Disabled, expired and revoked tokens fail on both transports.
    sessionCookie:
      type: apiKey
      in: cookie
      name: dst_admin_session
  parameters:
    NotificationChannelID:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationDeliveryID:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for state-changing requests authenticated by session cookie. Not required for Authorization Bearer requests.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique operation key. Reusing it with the same request replays the original response; reusing it with different JSON content returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    RoomID:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    WorldID:
      name: worldId
      in: path
      required: true
      schema:
        type: string
    RecoveryName:
      name: recoveryName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10,20}-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    CommandRunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandID:
      name: commandId
      in: path
      required: true
      schema:
        type: string
    BackupID:
      name: backupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameReleaseID:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModReference:
      name: modId
      in: path
      required: true
      description: "Numeric Workshop ID or local:<exact directory name>. Non-numeric local names are accepted as aliases. Local numeric directories require the local: prefix. Configuration keys and directory names are preserved."
      schema:
        $ref: "#/components/schemas/ModReferenceID"
    ModID:
      name: modId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{1,20}$'
    ModPublicationID:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayerID:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
    StructuredLogRuleID:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentID:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    KubernetesProviderID:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ContainerID:
      name: containerId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{12,64}$' }
  responses:
    BadRequest:
      description: The request body or resource identifier is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: A valid administrator session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with current setup state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: The request is valid JSON but violates a domain constraint
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required local path or runtime dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GatewayTimeout:
      description: A runtime probe did not publish a fresh snapshot before its deadline
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadGateway:
      description: An upstream service returned an invalid response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RoomLocation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
        roomId:
          type: string
          minLength: 1
          maxLength: 255
        worldId:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: string
          minLength: 1
          maxLength: 255
        sessionId:
          type: string
          minLength: 1
          maxLength: 255
        sourceTime: {type: string, format: date-time}
        sourceRef:
          type: string
          minLength: 1
          maxLength: 255
        x:
          type: number
          minimum: -100000
          maximum: 100000
        z:
          type: number
          minimum: -100000
          maximum: 100000
        revision:
          type: integer
          minimum: 1
        executionRevision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - roomId
      - worldId
      - name
      - x
      - z
      - revision
    RoomLocationInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 48
        worldId:
          type: string
          minLength: 1
          maxLength: 255
        playerId:
          type: string
          minLength: 1
          maxLength: 128
        x:
          type: number
          minimum: -100000
          maximum: 100000
        z:
          type: number
          minimum: -100000
          maximum: 100000
        mapId:
          type: string
          minLength: 1
          maxLength: 36
        revision:
          type: integer
          minimum: 1
      required:
      - name
    RoomTeleportInput:
      type: object
      additionalProperties: false
      properties:
        landmarkRef:
          type: string
          minLength: 1
          maxLength: 100
          description: Exact candidate ID returned by a common-destination selection; prepare checks it again.
        playerId:
          type: string
          minLength: 1
          maxLength: 128
        worldId:
          type: string
          minLength: 1
          maxLength: 255
        locationId:
          type: string
          minLength: 1
          maxLength: 36
        locationName:
          type: string
          minLength: 1
          maxLength: 48
        targetPlayerId:
          type: string
          minLength: 1
          maxLength: 128
        x:
          type: number
          minimum: -100000
          maximum: 100000
        z:
          type: number
          minimum: -100000
          maximum: 100000
      required:
      - playerId
    RoomTeleportPreview:
      type: object
      additionalProperties: false
      properties:
        needsReview: {type: boolean}
        candidates:
          type: array
          maxItems: 48
          items: {$ref: '#/components/schemas/WorldLandmarkPoint'}
        id:
          type: string
          minLength: 1
          maxLength: 255
        roomId:
          type: string
          minLength: 1
          maxLength: 255
        worldId:
          type: string
          minLength: 1
          maxLength: 255
        playerId:
          type: string
          minLength: 1
          maxLength: 255
        playerName:
          type: string
          minLength: 0
          maxLength: 255
        locationId:
          type: string
          minLength: 1
          maxLength: 255
        locationName:
          type: string
          minLength: 1
          maxLength: 255
        reason:
          type: string
          minLength: 1
          maxLength: 255
        runId:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          enum:
          - preparing
          - prepared
          - needs_selection
          - dispatching
          - confirmed
          - rejected
          - uncertain
          - cancelled
          - expired
        x:
          type: number
          minimum: -100000
          maximum: 100000
        z:
          type: number
          minimum: -100000
          maximum: 100000
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        effect:
          type: object
          additionalProperties: false
          properties:
            state:
              type: string
              minLength: 1
              maxLength: 255
            operationId:
              type: string
              minLength: 1
              maxLength: 255
            playerId:
              type: string
              minLength: 1
              maxLength: 255
            playerName:
              type: string
              minLength: 1
              maxLength: 255
            sessionId:
              type: string
              minLength: 1
              maxLength: 255
            reason:
              type: string
              minLength: 1
              maxLength: 255
            point:
              type: object
              additionalProperties: false
              properties:
                x:
                  type: number
                  minimum: -100000
                  maximum: 100000
                z:
                  type: number
                  minimum: -100000
                  maximum: 100000
              required:
              - x
              - z
            before:
              type: object
              additionalProperties: false
              properties:
                x:
                  type: number
                  minimum: -100000
                  maximum: 100000
                z:
                  type: number
                  minimum: -100000
                  maximum: 100000
              required:
              - x
              - z
            after:
              type: object
              additionalProperties: false
              properties:
                x:
                  type: number
                  minimum: -100000
                  maximum: 100000
                z:
                  type: number
                  minimum: -100000
                  maximum: 100000
              required:
              - x
              - z
            expiresAt:
              type: integer
            observedAt:
              type: integer
          required: []
      required:
      - id
      - roomId
      - worldId
      - playerId
      - state
      - expiresAt
      - serverTime
    BotTaskInput:
      type: object
      additionalProperties: false
      description: Each selected task further validates allowed and required fields. Names can replace IDs; ambiguous targets return choices. Parameters are a typed object, not a JSON string. No Lua or caller-defined action mappings are accepted.
      properties:
        room: {type: string, minLength: 1, maxLength: 255}
        player: {type: string, minLength: 1, maxLength: 255}
        world: {type: string, minLength: 1, maxLength: 255}
        view: {type: string, maxLength: 64}
        action: {type: string, maxLength: 64}
        query: {type: string, minLength: 1, maxLength: 128}
        capabilityId: {type: string, minLength: 1, maxLength: 64}
        parameters: {type: object, maxProperties: 32}
        taskRef: {type: string, format: uuid}
        mode: {type: string, enum: [prepare, execute]}
    BotTaskResponse:
      type: object
      required: [state, summary]
      properties:
        state: {type: string, description: 'prepared, needs_input, needs_confirmation, expired, pending, running, succeeded, partial, failed, rejected, unavailable or uncertain. Read result.complete and evidence before reporting completion.'}
        summary: {type: string}
        taskRef: {type: string, format: uuid}
        roomId: {type: string}
        capabilityId: {type: string}
        parameters: {type: object}
        expiresAt: {type: string, format: date-time}
        data: {type: object, description: Bounded choices or task-specific facts}
        result: {type: object, description: Original BotResult with status, complete, source, observedAt and execution evidence}
    BotTaskEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: {$ref: '#/components/schemas/BotTaskResponse'}
        error: {type: [object, 'null']}
        meta: {$ref: '#/components/schemas/Meta'}
    BotProtocolEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          type: object
          required: [protocolVersions, preferredVersion, capabilityContractVersions, profile, features]
          properties:
            protocolVersions: {type: array, items: {type: integer}}
            preferredVersion: {type: integer}
            capabilityContractVersions: {type: array, items: {type: integer}}
            profile: {type: string, enum: [game-read, game-manage, panel-manage]}
            roomIds: {type: array, nullable: true, items: {type: string}}
            roomId: {type: string}
            features: {type: array, items: {type: string}}
        error: {type: [object, 'null']}
        meta: {$ref: '#/components/schemas/Meta'}
    EntitySpawnEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: {$ref: '#/components/schemas/EntitySpawn'}
        error: {type: 'null'}
        meta: {$ref: '#/components/schemas/Meta'}
    EntitySpawn:
      type: object
      required: [runId, roomId, worldId, playerId, prefab, name, requested, status, complete, executionOutcome, mayHaveExecuted, message]
      properties:
        runId: {type: string}
        roomId: {type: string}
        worldId: {type: string}
        playerId: {type: string}
        prefab: {type: string}
        name: {type: string}
        requested: {type: integer, minimum: 1, maximum: 5}
        spawned: {type: integer, minimum: 0, maximum: 5}
        status: {type: string, enum: [running, succeeded, failed, uncertain]}
        complete: {type: boolean}
        executionOutcome: {type: string, enum: [unconfirmed, confirmed, rejected]}
        mayHaveExecuted: {type: boolean}
        message: {type: string}
        observedAt: {type: string, format: date-time}
        spawnAudit: {$ref: '#/components/schemas/CommandSpawnAudit'}
    ItemGrantEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: {$ref: '#/components/schemas/ItemGrant'}
        error: {type: 'null'}
        meta: {$ref: '#/components/schemas/Meta'}
    ItemGrant:
      type: object
      required: [runId, roomId, worldId, playerId, prefab, name, requested, status, complete, executionOutcome, mayHaveExecuted, message]
      properties:
        runId: {type: string}
        roomId: {type: string}
        worldId: {type: string}
        playerId: {type: string}
        prefab: {type: string}
        name: {type: string}
        requested: {type: integer, minimum: 1, maximum: 400}
        granted: {type: integer, minimum: 0, maximum: 400}
        status: {type: string, enum: [running, succeeded, failed, uncertain]}
        complete: {type: boolean}
        executionOutcome: {type: string, enum: [unconfirmed, confirmed, rejected]}
        mayHaveExecuted: {type: boolean}
        message: {type: string}
        observedAt: {type: string, format: date-time}
        spawnAudit: {$ref: '#/components/schemas/CommandSpawnAudit'}
    WorkbenchAction:
      type: object
      additionalProperties: false
      required: [id, title, searchTerms, parameters, risk]
      properties:
        id: {type: string, maxLength: 128}
        title: {type: string, maxLength: 128}
        searchTerms: {type: array, maxItems: 32, items: {type: string, maxLength: 128}}
        parameters: {type: object, maxProperties: 1, additionalProperties: {type: string}}
        risk: {$ref: '#/components/schemas/CommandRisk'}
        description: {type: string, maxLength: 512}
    WorkbenchBatchResult:
      type: object
      additionalProperties: false
      required: [state, matched, attempted, verified, unconfirmed, skipped, failed]
      properties:
        state: {type: string, enum: [preview, cancelled, completed, partial]}
        previewId: {type: string, format: uuid}
        expiresIn: {type: integer, const: 30}
        matched: {type: integer, minimum: 0, maximum: 40}
        attempted: {type: integer, minimum: 0, maximum: 40}
        verified: {type: integer, minimum: 0, maximum: 40}
        unconfirmed: {type: integer, minimum: 0, maximum: 40}
        skipped: {type: integer, minimum: 0, maximum: 40}
        failed: {type: integer, minimum: 0, maximum: 40}
        reason: {type: string}
        x: {type: number}
        z: {type: number}
    WorkbenchEnvelope:
      type: object
      required: [data]
      properties:
        data:
          x-dst-task-state: status
          type: object
          required: [runId, roomId, worldId, commandId, status, complete, executionOutcome, mayHaveExecuted, message]
          properties:
            runId: {type: string, x-dst-read: {operationId: getBuiltinRoomCommandRun, parameter: path.runId}}
            roomId: {type: string}
            worldId: {type: string}
            commandId: {type: string}
            status: {type: string}
            complete: {type: boolean}
            executionOutcome: {type: string}
            mayHaveExecuted: {type: boolean}
            message: {type: string}
            batch: {$ref: '#/components/schemas/WorkbenchBatchResult'}
            movement: {$ref: '#/components/schemas/WorkbenchMovementResult'}
            output: {type: object, properties: {text: {type: string}, truncated: {type: boolean}}}
    BotDirectoryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [protocolVersion, revision]
          properties:
            protocolVersion: {type: integer, enum: [1, 2]}
            revision: {type: string}
            notModified: {type: boolean}
            nextCursor: {type: string}
            total: {type: integer, minimum: 0}
            items:
              type: array
              maxItems: 64
              items:
                type: object
                required: [id, title, category, access, contractVersion, schemaRevision, parameters, nativeTools, resultKind]
                properties:
                  id: {type: string}
                  title: {type: string}
                  category: {type: string}
                  risk: {type: string, enum: [low, medium, high, critical]}
                  access: {type: string, enum: [read, write]}
                  contractVersion: {type: integer}
                  schemaRevision: {type: string}
                  behaviorRevision: {type: string}
                  actions: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/WorkbenchAction'}}
                  parameters: {type: object, additionalProperties: true}
                  parameterHints: {type: object, additionalProperties: {type: string}}
                  searchTerms: {type: array, maxItems: 32, items: {type: string, maxLength: 128}}
                  nativeTools: {type: array, items: {type: string}}
                  resultKind: {type: string}
    BotResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [requestId, capabilityId, contractVersion, roomId, status, complete, source, cached, executionOutcome, mayHaveExecuted, resultKind, data, nextAction]
          properties:
            requestId: {type: string}
            capabilityId: {type: string}
            contractVersion: {type: integer}
            roomId: {type: string}
            status: {type: string, enum: [pending, running, succeeded, partial, failed, uncertain, unavailable, rejected]}
            complete: {type: boolean}
            source: {type: string}
            cached: {type: boolean}
            observedAt: {type: [string, 'null'], format: date-time}
            executionOutcome: {type: string}
            mayHaveExecuted: {type: boolean}
            resultKind: {type: string}
            data: {}
            jobId: {type: string}
            queryRunId: {type: string}
            grantRunId: {type: string}
            spawnRunId: {type: string}
            workbenchRunId: {type: string}
            error:
              type: object
              properties:
                code: {type: string}
                message: {type: string}
            nextAction: {type: string, enum: [none, read_original, reselect_target, refresh_contract, fix_config]}
    ServiceLogEntry:
