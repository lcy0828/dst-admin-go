      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  maxLength: 128
      responses:
        "201":
          description: Verified upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupEnvelope"
        "413":
          description: Upload or expanded archive exceeds safety limits
          content:
            application/json:
              schema:
