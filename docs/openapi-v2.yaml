        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Agent command history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCommandListEnvelope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /agents/commands/{commandId}:
    parameters:
      - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Agents]
      operationId: getAgentCommand
      summary: Read one persisted Agent command result
      responses:
        "200": { description: Agent command result, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCommandEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents/security:
    get:
      tags: [Agents]
      operationId: getAgentSecurity
      summary: Read masked Agent key metadata without exposing the secret
      responses:
        "200":
          description: Masked Agent key state
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSecurityEnvelope" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/security/actions/rotate:
    post:
      tags: [Agents]
      operationId: rotateAgentKey
      summary: Rotate the Agent key and reveal the replacement exactly once
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRotateKeyInput" }
      responses:
        "200":
          description: One-time replacement key
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRotateKeyEnvelope" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}/inventory:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: getAgentRuntimeInventory
      summary: Read the last typed DST installation, room, Shard, process, and capacity observation
      responses:
        "200": { description: Agent runtime inventory snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/AgentInventorySnapshotEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /agents/{agentId}/inventory/actions/refresh:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    post:
      tags: [Agents, Jobs]
      operationId: refreshAgentRuntimeInventory
      summary: Request one read-only typed runtime inventory observation from a configured online Agent
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Inventory refresh Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /agents/{agentId}:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        "200": { description: Agent node, content: { application/json: { schema: { $ref: "#/components/schemas/AgentEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Agents]
      operationId: forgetAgent
      summary: Remove an offline Agent snapshot
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Offline Agent snapshot removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /agents/{agentId}/commands:
    parameters: [{ $ref: "#/components/parameters/AgentID" }]
    get:
      tags: [Agents]
      operationId: listAgentCommandsForAgent
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AgentCommandStatus" } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Agent command history, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCommandListEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      tags: [Agents, Jobs]
      operationId: runAgentCommand
      summary: Run one fixed domain action on an online Agent
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCommandInput" }
      responses:
        "202": { description: Agent command Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /announcements:
    get:
      tags: [Announcements]
      operationId: listAnnouncements
      summary: List persisted system announcements
      responses:
        "200":
          description: Announcements ordered by importance and publication time
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementListEnvelope" }
    post:
      tags: [Announcements]
      operationId: createAnnouncement
      summary: Publish a system announcement
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201": { description: Announcement created, content: { application/json: { schema: { $ref: "#/components/schemas/AnnouncementEnvelope" } } } }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /announcements/{announcementId}:
    parameters: [{ $ref: "#/components/parameters/AnnouncementID" }]
    get:
      tags: [Announcements]
      operationId: getAnnouncement
      responses:
        "200":
          description: Persisted announcement
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Announcements]
      operationId: updateAnnouncement
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "200": { description: Announcement updated, content: { application/json: { schema: { $ref: "#/components/schemas/AnnouncementEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Announcements]
      operationId: deleteAnnouncement
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Announcement deleted, content: { application/json: { schema: { $ref: "#/components/schemas/AnnouncementDeleteEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /containers:
    get:
      tags: [Containers]
      operationId: listContainers
      summary: List managed or clearly DST-owned Docker containers
      responses:
        "200": { description: Docker capability and containers, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerListEnvelope" } } } }
  /containers/{containerId}/actions/{action}:
    parameters:
      - { $ref: "#/components/parameters/ContainerID" }
      - { name: action, in: path, required: true, schema: { $ref: "#/components/schemas/ContainerAction" } }
    post:
      tags: [Containers, Jobs]
      operationId: runContainerAction
      summary: Run a fixed lifecycle action on a managed DST container
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContainerActionInput" } } } }
      responses:
        "202": { description: Container Job accepted, content: { application/json: { schema: { $ref: "#/components/schemas/JobEnvelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dst_admin_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique operation key. Reusing it with the same request replays the original response; reusing it with different JSON content returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    RoomID:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    WorldID:
      name: worldId
      in: path
      required: true
      schema:
        type: string
    RecoveryName:
      name: recoveryName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10,20}-[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    CommandRunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandID:
      name: commandId
      in: path
      required: true
      schema:
        type: string
    BackupID:
      name: backupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameReleaseID:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModID:
      name: modId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{1,20}$'
    ModPublicationID:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayerID:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
    StructuredLogRuleID:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentID:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    KubernetesProviderID:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AnnouncementID:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ContainerID:
      name: containerId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{12,64}$' }
  responses:
    BadRequest:
      description: The request body or resource identifier is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: A valid administrator session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with current setup state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: The request is valid JSON but violates a domain constraint
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required local path or runtime dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
    ErrorEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          type: "null"
        error:
          $ref: "#/components/schemas/APIError"
        meta:
          $ref: "#/components/schemas/Meta"
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
    SetupCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 6
          maxLength: 72
    Admin:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string
    SessionState:
      type: object
      required: [authenticated, setupRequired, preferences]
      properties:
        authenticated:
          type: boolean
        setupRequired:
          type: boolean
        user:
          $ref: "#/components/schemas/Admin"
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
        passwordChanged:
          type: boolean
        preferences:
          $ref: "#/components/schemas/UIPreferences"
    UIPreferences:
      type: object
      additionalProperties: false
      required: [systemName, timezone, dateFormat, themeColor]
      properties:
        systemName: { type: string, minLength: 1, maxLength: 256 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        dateFormat:
          type: string
          enum: [YYYY-MM-DD, MM/DD/YYYY, DD/MM/YYYY, YYYY年MM月DD日]
        themeColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$'
    SessionEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/SessionState"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    ToolCapability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        path:
          type: string
        kind:
          type: string
        source:
          type: string
        version:
          type: string
        diagnostic:
          type: string
    PathCapability:
      type: object
      required: [configured, exists, writable]
      properties:
        configured:
          type: boolean
        exists:
          type: boolean
        writable:
          type: boolean
        value:
          type: string
    Capabilities:
      type: object
      required: [platform, arch, tools, paths, features]
      properties:
        platform:
          type: string
        arch:
          type: string
        tools:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ToolCapability"
        paths:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PathCapability"
        features:
          type: object
          additionalProperties:
            type: boolean
    CapabilitiesEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Capabilities"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    CheckStatus:
      type: string
      enum: [pass, warning, fail]
    SetupCheck:
      type: object
      additionalProperties: false
      required: [id, label, status, required, summary]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          $ref: "#/components/schemas/CheckStatus"
        required:
          type: boolean
        summary:
          type: string
        remediation:
          type: string
        details:
          type: object
          additionalProperties: true
    Readiness:
      type: object
      additionalProperties: false
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SetupCheck"
    ReadinessEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Readiness"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    Room:
      type: object
      additionalProperties: false
      required:
        - id
        - directoryName
        - name
        - description
        - gameMode
        - maxPlayers
        - pvp
        - passwordProtected
        - managed
        - worldCount
        - updatedAt
      properties:
        id:
          type: string
          description: Canonical opaque ID derived from the safe directory component
        directoryName:
          type: string
        name:
          type: string
        description:
          type: string
        gameMode:
          type: string
        maxPlayers:
          type: integer
        pvp:
          type: boolean
        passwordProtected:
          type: boolean
        managed:
          type: boolean
        worldCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CreateRoomInput:
      type: object
      additionalProperties: false
      required: [directoryName, name, gameMode, maxPlayers, includeCaves]
      properties:
        directoryName:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 512
          default: ""
        gameMode:
          type: string
          enum: [survival, endless, wilderness]
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 64
        pvp:
          type: boolean
          default: false
        password:
          type: string
          maxLength: 64
          writeOnly: true
        clusterToken:
          type: string
          maxLength: 4096
          writeOnly: true
        includeCaves:
          type: boolean
    RoomActionInput:
      type: object
      additionalProperties: false
      properties:
        worldIds:
          type: array
          uniqueItems: true
          items:
            type: string
        allowCapacityRisk:
          type: boolean
          default: false
    BatchRoomActionSelection:
      type: object
      additionalProperties: false
      required: [roomId]
      properties:
        roomId:
          type: string
        worldIds:
          type: array
          uniqueItems: true
          items:
            type: string
        allowCapacityRisk:
          type: boolean
          default: false
    BatchRoomActionInput:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BatchRoomActionSelection"
        allowCapacityRisk:
          type: boolean
          default: false
    RoomEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/Room"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    RoomList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        total:
          type: integer
    RoomListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/RoomList"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    RecoveryItem:
      type: object
      additionalProperties: false
      required: [recoveryName, directoryName, displayName, deletedAt, updatedAt]
      properties:
        recoveryName: { type: string }
        directoryName: { type: string }
        displayName: { type: string }
        deletedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecoveryList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecoveryItem" }
        total: { type: integer }
    RecoveryListEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { $ref: "#/components/schemas/RecoveryList" }
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/Meta" }
    PurgeRecoveryInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must exactly equal recoveryName
    World:
      type: object
      additionalProperties: false
      required:
        - id
        - roomId
        - directoryName
        - name
        - role
        - isMaster
        - serverPort
        - updatedAt
        - status
        - controlAvailable
      properties:
        id:
          type: string
        roomId:
          type: string
        directoryName:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [master, caves, custom]
        isMaster:
          type: boolean
        serverPort:
          type: integer
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [running, stopped, unknown]
        controlAvailable:
          type: boolean
        statusMessage:
          type: string
    WorldRecord:
      type: object
      additionalProperties: false
      required: [id, roomId, directoryName, name, role, isMaster, serverPort, updatedAt]
      properties:
        id: { type: string }
        roomId: { type: string }
        directoryName: { type: string }
        name: { type: string }
        role: { type: string, enum: [master, caves, custom] }
        isMaster: { type: boolean }
        serverPort: { type: integer }
        updatedAt: { type: string, format: date-time }
    CreateWorldInput:
      type: object
      additionalProperties: false
      required: [directoryName, type]
      properties:
        directoryName:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        type:
          type: string
          enum: [forest, cave]
    DeleteRoomInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must exactly equal the room name
    DeleteRoomResult:
      type: object
      additionalProperties: false
      required: [room, recoveryName]
      properties:
        room:
          $ref: "#/components/schemas/Room"
        recoveryName:
          type: string
          description: Relative path below the configured save root
    DeleteRoomResultEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data:
          $ref: "#/components/schemas/DeleteRoomResult"
        error:
          type: "null"
        meta:
          $ref: "#/components/schemas/Meta"
    DeleteWorldInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must exactly equal the room name
    DeleteWorldResult:
      type: object
      additionalProperties: false
      required: [world, recoveryName]
      properties:
        world:
          $ref: "#/components/schemas/WorldRecord"
        recoveryName:
