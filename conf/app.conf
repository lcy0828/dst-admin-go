# DST-ADMIN 配置文件

# 代理配置
[agent]
SECURITY_KEY =
SERVER_URL = ws://localhost:8081/agent

# 路径配置
[paths]
# DST存档路径
DST_SAVE_PATH = /Users/lcy/DoNotStarveTogether
# DST备份路径
DST_BACKUP_PATH = /Users/lcy/dst-archive
# DST服务器日志路径
DST_SERVER_LOG_PATH = /Users/lcy/DoNotStarveTogether/02/Forest1/server_log.txt
# DST模组目录
DST_UGC_PATH = /Users/lcy/dstserver/ugc_mods
# DST服务器安装路径
DST_SERVER_PATH = /Users/lcy/dstserver/dontstarve_dedicated_server_nullrenderer.app/Contents/MacOS
# DST服务器启动模式，可选值：32或64，默认使用服务器支持的最高位数
DST_SERVER_MODE = 32

# 服务器配置
[server]
# 监听地址
LISTEN_ADDR = :8081
# 通信安全密钥
SECURITY_KEY =

# 其他配置
[misc]
# 日志级别: debug, info, warn, error
LOG_LEVEL = info

# 模组相关配置
[mod]
# 饥荒联机版的AppID
APP_ID = 322330
# Steam命令行工具路径
STEAM_CMD_PATH = /Users/lcy/Steam
# Steam Web API Key（按名称搜索 Mod 时需要；直接输入 Workshop ID 不需要）
STEAM_WEB_API_KEY =
# 外部 Lua fallback 解释器；gopher-lua 无法无损解析时使用
LUA_BINARY = lua
# Lua 兼容模块目录（可选）；fallback helper 已内嵌到 Go 二进制
LUA_SH_PATH = /Users/lcy/lua-sh
#模组保存位置
WORKSHOP_MOD_PATH = /Users/lcy/mod
# Workshop内容路径
WORKSHOP_CONTENT = /Users/lcy/mod/steamapps/workshop/content/322330
# Tmux会话名称
TMUX_SESSION_NAME = DST_MODDOWN
# 模组下载日志文件
WORKSHOP_LOG_FILE = /Users/lcy/Library/Application Support/Steam/logs/workshop_log.txt

# debug or release
RUN_MODE = debug
SETUP    = complete

[app]
PAGE_SIZE  = 10
JWT_SECRET =

# [database]
# TYPE = mysql
# USER = dont
# PASSWORD =
# #127.0.0.1:3306
# HOST = 192.168.2.12:3306
# NAME = dont
# TABLE_PREFIX = dont_
[database]
TYPE         = sqlite3
# NAME = dont
PATH         = ./go-dont.db
TABLE_PREFIX = dont_
