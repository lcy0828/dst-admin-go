name: dst-admin

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dst-admin:
    image: ${DST_ADMIN_IMAGE:-dst-admin/all-in-one:dev}
    platform: linux/amd64
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 90s
    environment:
      DST_ADMIN_BOOTSTRAP_DST: ${DST_ADMIN_BOOTSTRAP_DST:-false}
      DST_ADMIN_PACKAGING: container
      DST_ADMIN_LOCAL_EXECUTOR_ENABLED: "true"
      DST_ADMIN_LOCAL_RUNTIME_DRIVER: container
      DST_ADMIN_LOCAL_INSTALLATION_ID: default
      DST_ADMIN_LOCAL_CONTAINER_ENGINE: docker
      DST_ADMIN_LOCAL_CONTAINER_IMAGE: ${DST_ADMIN_RUNTIME_IMAGE:-dst-admin/dst-runtime:dev}
      DST_ADMIN_LOCAL_CONTAINER_SAVE_SOURCE: ${DST_ADMIN_DATA_ROOT:-/opt/dst}/saves
      DST_ADMIN_LOCAL_CONTAINER_SERVER_SOURCE: ${DST_ADMIN_DATA_ROOT:-/opt/dst}/server
      DST_ADMIN_LOCAL_CONTAINER_UGC_SOURCE: ${DST_ADMIN_DATA_ROOT:-/opt/dst}/workshop/steamapps/workshop
      DST_ADMIN_FLEET_CONTROLLER_ENABLED: ${DST_ADMIN_FLEET_CONTROLLER_ENABLED:-false}
      DST_ADMIN_AGENT_SECURITY_KEY: ${DST_ADMIN_AGENT_SECURITY_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DST_ADMIN_DATA_ROOT:-/opt/dst}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DST_ADMIN_HTTP_BIND:-0.0.0.0:8080}:8080/tcp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v2/auth/session"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID

  dst-runtime-image:
    profiles: ["build"]
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dst-runtime
    image: ${DST_ADMIN_RUNTIME_IMAGE:-dst-admin/dst-runtime:dev}
    entrypoint: ["/bin/true"]
