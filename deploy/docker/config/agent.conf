[agent]
SERVER_URL = ws://control-plane:8000/agent
SECURITY_KEY =

; 可选：仅在节点间需要精确模组直传时同时启用。默认关闭。
; Docker 部署还必须显式发布 18081/tcp；不要直接暴露到公网。
; MOD_PEER_LISTEN_ADDR = :18081
; MOD_PEER_ADVERTISE_URL = http://agent.example.com:18081

[runtime.container]
DRIVER = container
SAVE_PATH = /opt/dst/saves
SERVER_PATH = /opt/dst/server
UGC_PATH = /opt/dst/workshop/steamapps/workshop
WORKSHOP_CONTENT_PATH = /opt/dst/workshop/steamapps/workshop/content/322330
MOD_CACHE_PATH = /var/lib/dst-admin-agent/mod-cache
MOD_STATE_PATH = /var/lib/dst-admin-agent/mod-state
SERVER_MODE = 64
CONTAINER_ENGINE = docker
CONSOLE_SOCKET = /run/dst-admin/tmux/tmux.sock
CONSOLE_SESSION = dst
